<!DOCTYPE html>
<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
        <script src="assets/js/back-nav.js"></script>
<title>BLM48 Membership | Gifts</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/member-gift-stickers.js"></script>
    <script src="assets/js/admin-gift-form.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Quicksand', 'Kanit', sans-serif; margin: 0; min-height: 100vh; color: #444; background: #fff; }
        .top-navigation-bar { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
        .page-wrapper { max-width: 760px; margin: 0 auto; padding: 14px 12px 100px; }
        #access-denied { display: none; text-align: center; padding: 80px 20px; color: #767676; }
        #page-content { display: none; }
        .empty-state, .loading-state { text-align: center; color: #767676; font-size: 13px; padding: 40px 20px; }

        .tabs { display: flex; gap: 8px; margin-bottom: 8px; }
        .filter-tab { flex: 1; border-radius: 20px; padding: 9px 6px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }

        /* ค้นหา + กรองสถานะ + เรียง */
        .tools { display: flex; gap: 8px; margin: 4px 0 6px; }
        .search { flex: 1; min-width: 0; padding: 10px 14px; border: 1px solid #eee; border-radius: 10px; font-family: inherit; font-size: 14px; }
        .sort { border: 1px solid #eee; border-radius: 10px; padding: 0 10px; font-family: inherit; font-size: 13px; color: #444; background: #fff; }
        .chips { display: flex; gap: 6px; margin-bottom: 4px; }
        .chip { border: 1px solid #eee; background: #fff; border-radius: 20px; padding: 5px 12px; font-family: inherit; font-size: 12.5px; font-weight: 700; color: #666; cursor: pointer; }
        .chip.active { background: #222; border-color: #222; color: #fff; }
        .chip .n { font-weight: 600; opacity: .7; margin-left: 3px; }

        /* แถวของขวัญ -> กดแล้วไปหน้าแก้ไข / สวิตช์ขวาสุด = เปิด-ปิดขายทันที */
        .g-row { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #f0f0f0; }
        .g-row.off .g-img, .g-row.off .g-name { opacity: .5; }
        a.g-link { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 0; text-decoration: none; color: inherit; }
        .g-price { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: #7a5a00; background: #fff3c4; padding: 1px 8px; border-radius: 20px; font-size: 12px; }
        .switch { position: relative; flex-shrink: 0; width: 46px; height: 26px; border: none; border-radius: 20px; background: #ddd; cursor: pointer; padding: 0; transition: background .15s; }
        .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .15s; }
        .switch.on { background: #1f9d55; }
        .switch.on::after { transform: translateX(20px); }
        .switch:disabled { opacity: .5; cursor: default; }
        .sw-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; color: #767676; }
        .toast-msg { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #222; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; z-index: 300; display: none; max-width: 90vw; }
        .g-img { width: 56px; height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: center; }
        .g-info { flex: 1; min-width: 0; }
        .g-name { font-weight: 700; font-size: 15px; color: #333; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .g-sub { font-size: 12.5px; color: #767676; margin-top: 3px; }
        .g-id { font-size: 11px; color: #767676; }
        .pill-off { font-size: 11px; font-weight: 700; background: #f1f1f1; color: #666; padding: 2px 8px; border-radius: 20px; }
        .g-arrow { color: #ccc; }

        /* ปุ่มลอย + มุมขวาล่าง -> หน้าเพิ่มของขวัญ (แบบหน้า Vote Events) */
        .fab-create {
            position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 200;
            width: 58px; height: 58px; border-radius: 50%;
            background: #ffc107; color: #222; font-size: 24px;
            display: flex; align-items: center; justify-content: center; text-decoration: none;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18); transition: transform 0.15s;
        }
        .fab-create:active { transform: scale(0.94); }
    </style>
    <link rel="stylesheet" href="assets/css/admin-theme.css">
</head>
<body>

<div class="top-navigation-bar">
    <button type="button" class="back-circle-btn" onclick="blm48Back('admin')" aria-label="Back"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="top-bar-title">Gifts</div>
</div>

<div class="page-wrapper">
    <div id="access-denied"><i class="fa-solid fa-lock"></i><br>หน้านี้สำหรับ Role Admin เท่านั้นค่ะ</div>
    <div id="page-content">
        <div class="tabs" id="tabs"></div>
        <div class="tools">
            <input id="search" class="search" type="search" placeholder="Search gift..." oninput="render()">
            <select id="sort" class="sort" onchange="setSort(this.value)" aria-label="Sort">
                <option value="price">Price: low → high</option>
                <option value="price-desc">Price: high → low</option>
                <option value="sent">Most sent</option>
                <option value="id">Newest</option>
            </select>
        </div>
        <div class="chips" id="chips"></div>
        <div id="gift-list"><div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div></div>
        <a class="fab-create" id="fab-create" href="admin_gift_create" aria-label="Add Gift" title="Add Gift"><i class="fas fa-plus"></i></a>
    </div>
</div>
<div class="toast-msg" id="toast"></div>

<script>
  let user = null;
  let gifts = [];
  const TIERS = window.BLM48_GIFT_TIERS;
  let activeTier = new URLSearchParams(location.search).get('tier') || 'Normal';
  if (!TIERS.some(t => t.key === activeTier)) activeTier = 'Normal';

  function fmt(n) { return Number(n || 0).toLocaleString(); }

  async function loadGifts() {
    const list = document.getElementById('gift-list');
    try {
      const res = await blm48AdminListGifts(user.username);
      if (!res || res.status !== 'success') { list.innerHTML = `<div class="empty-state">${escapeHtml((res && res.message) || 'โหลดข้อมูลไม่สำเร็จ')}</div>`; return; }
      gifts = res.data || [];
      render();
    } catch (e) {
      list.innerHTML = '<div class="empty-state">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</div>';
    }
  }

  // สถานะ + การเรียง จำไว้ในแท็บเบราว์เซอร์นี้ (กลับมาจากหน้าแก้ไขยังเหมือนเดิม)
  const STATUS = [['all', 'All', g => true], ['on', 'On sale', g => g.active], ['off', 'Off', g => !g.active]];
  const SORTS = {
    price: (a, b) => (a.costCookies - b.costCookies) || a.giftId.localeCompare(b.giftId),
    'price-desc': (a, b) => (b.costCookies - a.costCookies) || a.giftId.localeCompare(b.giftId),
    sent: (a, b) => (b.sentQty - a.sentQty) || a.giftId.localeCompare(b.giftId),
    id: (a, b) => b.giftId.localeCompare(a.giftId, undefined, { numeric: true })
  };
  const store = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) {} return null; };
  let status = store('adminGiftsStatus') || 'all';
  let sortBy = store('adminGiftsSort') || 'price';
  if (!STATUS.some(([k]) => k === status)) status = 'all';
  if (!SORTS[sortBy]) sortBy = 'price';

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 2400);
  }

  function setStatus(k) { status = k; store('adminGiftsStatus', k); render(); }
  function setSort(k) { sortBy = k; store('adminGiftsSort', k); render(); }

  function rowHtml(g) {
    return `
      <div class="g-row ${g.active ? '' : 'off'}" data-id="${escapeHtml(g.giftId)}">
        <a class="g-link" href="admin_gift_edit?id=${encodeURIComponent(g.giftId)}">
          <div class="g-img">${blm48AdminGiftImg(g.giftId, g.imageUrl, 56)}</div>
          <div class="g-info">
            <div class="g-name">${escapeHtml(g.giftName || g.giftId)}</div>
            <div class="g-sub"><span class="g-price"><i class="fa-solid fa-cookie-bite"></i> ${fmt(g.costCookies)}</span> · +${fmt(g.points)} คะแนน</div>
            <div class="g-id">${escapeHtml(g.giftId)} · ส่งแล้ว ${fmt(g.sentQty)}${g.walletQty ? ` · อยู่ใน Backpack ${fmt(g.walletQty)}` : ''}</div>
          </div>
        </a>
        <div class="sw-wrap">
          <button type="button" class="switch ${g.active ? 'on' : ''}" role="switch" aria-checked="${g.active}" aria-label="On sale" onclick="toggleActive('${escapeHtml(g.giftId)}', this)"></button>
          <span>${g.active ? 'On sale' : 'Off'}</span>
        </div>
      </div>`;
  }

  function render() {
    document.getElementById('tabs').innerHTML = TIERS.map(t => {
      const n = gifts.filter(g => g.tier === t.key).length;
      return `<button type="button" class="filter-tab ${activeTier === t.key ? 'active' : ''}" onclick="setTier('${t.key}')">${t.label} (${n})</button>`;
    }).join('');
    // ปุ่ม + เปิดหน้าเพิ่มของขวัญโดยเลือกหมวดของแท็บนี้ไว้ให้
    document.getElementById('fab-create').href = 'admin_gift_create?tier=' + encodeURIComponent(activeTier);
    document.getElementById('sort').value = sortBy;
    const q = document.getElementById('search').value.trim().toLowerCase();
    const inTier = gifts.filter(g => g.tier === activeTier && (!q || String(g.giftName || '').toLowerCase().includes(q) || g.giftId.toLowerCase().includes(q)));
    document.getElementById('chips').innerHTML = STATUS.map(([k, label, fn]) =>
      `<button type="button" class="chip ${k === status ? 'active' : ''}" onclick="setStatus('${k}')">${label}<span class="n">${inTier.filter(fn).length}</span></button>`).join('');
    const rows = inTier.filter(STATUS.find(([k]) => k === status)[2]).sort(SORTS[sortBy]);
    document.getElementById('gift-list').innerHTML = rows.length ? rows.map(rowHtml).join('')
      : `<div class="empty-state">${q || status !== 'all' ? 'ไม่พบของขวัญ' : 'ยังไม่มีของขวัญในหมวดนี้ · กด + เพื่อเพิ่ม'}</div>`;
  }

  // เปิด/ปิดขายจากรายการได้เลย ไม่ต้องเข้าหน้าแก้ไข (ส่งค่าเดิมทุกช่อง เปลี่ยนแค่ active)
  async function toggleActive(id, btn) {
    const g = gifts.find(x => x.giftId === id);
    if (!g) return;
    btn.disabled = true;
    const next = !g.active;
    try {
      const res = await blm48AdminSaveGift(user.username, g.giftId, { giftName: g.giftName, tier: g.tier, costCookies: g.costCookies, points: g.points, imageUrl: g.imageUrl, active: next });
      if (!res || res.status !== 'success') throw new Error((res && res.message) || 'บันทึกไม่สำเร็จ');
      g.active = next;
      toast(`${g.giftName}: ${next ? 'เปิดขายแล้ว' : 'ปิดขายแล้ว'}`);
    } catch (e) {
      toast(e.message || 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้');
    }
    render();
  }

  function setTier(t) {
    activeTier = t;
    history.replaceState(history.state, '','admin_gifts?tier=' + encodeURIComponent(t)); // กลับมาจากหน้าแก้ไขแล้วอยู่แท็บเดิม
    render();
  }

  window.addEventListener('DOMContentLoaded', () => {
    user = getUserSession();
    if (!user) { window.location.href = 'login'; return; }
    if (!(user.is_admin === true || (user.role && user.role.toLowerCase() === 'admin'))) {
      document.getElementById('access-denied').style.display = 'block';
      return;
    }
    document.getElementById('page-content').style.display = 'block';
    loadGifts();
  });
</script>
</body>
</html>
