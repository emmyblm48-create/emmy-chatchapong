<!DOCTYPE html>
<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
        <script src="assets/js/back-nav.js"></script>
<title>BLM48 Membership | โอน Token / Cookie / GEToken</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffc0cb">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s192">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>

    <style>
        :root {
            --primary-pink: #ff85a2;
            --soft-pink: #ffe4e1;
            --card-border: #ffeef2;
            --text-dark: #444;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Quicksand', 'Kanit', sans-serif; margin: 0; padding: 0; min-height: 100vh; color: var(--text-dark); background: #ffffff; }

        .top-navigation-bar {
            display: flex; align-items: center; gap: 12px;
            background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(var(--glass-blur-lg));
            backdrop-filter: blur(var(--glass-blur-lg));
            padding: 14px 16px; border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100; box-shadow: var(--glass-shadow-sm);
        }
        .back-circle-btn {
            flex: 0 0 auto; background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(var(--glass-blur-sm));
            backdrop-filter: blur(var(--glass-blur-sm));
            border: 1px solid var(--glass-border);
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary-pink); cursor: pointer; transition: 0.2s;
        }
        .back-circle-btn:hover { background: var(--primary-pink); color: white; transform: scale(1.05); }
        .top-bar-title { font-family: 'Quicksand', 'Kanit', sans-serif; font-weight: 600; font-size: 16px; color: #333; }

        .page-wrapper { max-width: 520px; margin: 0 auto; padding: 18px 12px 50px; }
        @media (min-width: 768px) { .page-wrapper { padding: 24px 24px 60px; } }

        .header-title-zone { text-align: center; margin-bottom: 20px; }
        .header-title-zone h1 { color: var(--primary-pink); font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 24px; margin: 0 0 6px 0; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header-title-zone p { color: #767676; font-size: 13px; margin: 0; }

        .form-card {
            background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(var(--glass-blur));
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 18px 16px; box-shadow: var(--glass-shadow-sm);
        }
        .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .form-field label { font-size: 13px; color: #666; font-weight: 600; }
        .form-field input {
            border: 1px solid var(--glass-border); border-radius: 12px;
            padding: 11px 14px; font-size: 14px; font-family: 'Quicksand', 'Kanit', sans-serif;
            color: var(--text-dark); background: rgba(255, 255, 255, 0.7);
        }
        .form-field input:focus { outline: none; border-color: var(--primary-pink); }

        .btn-primary {
            width: 100%; border: none; border-radius: 20px; padding: 13px;
            background: var(--primary-pink); color: #fff; font-weight: 700; font-size: 14px;
            font-family: 'Quicksand', 'Kanit', sans-serif; cursor: pointer; transition: 0.2s;
        }
        .btn-primary:hover { background: #ff6b8b; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary {
            width: 100%; border: 1px solid var(--glass-border); border-radius: 20px; padding: 12px; margin-top: 8px;
            background: transparent; color: #767676; font-weight: 600; font-size: 13px;
            font-family: 'Quicksand', 'Kanit', sans-serif; cursor: pointer;
        }

        .form-msg { border-radius: 12px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 14px; display: none; }
        .form-msg.error { background: #ffeef0; color: #ff5c7a; display: block; }

        .confirm-card { display: none; margin-top: 18px; }
        .confirm-card.show { display: block; }
        .target-preview { display: flex; align-items: center; gap: 12px; padding: 12px; background: #fff0f3; border-radius: 14px; margin-bottom: 12px; }
        .target-preview img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #fff; flex: 0 0 auto; }
        .target-preview .t-name { font-weight: 700; font-size: 14px; color: #333; }
        .target-preview .t-sub { font-size: 12px; color: #767676; }
        .balance-line { font-size: 12.5px; color: #666; margin-bottom: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
        .balance-line i { margin-right: 3px; }
        .transfer-list { border-top: 1px dashed #ffd7e1; padding-top: 10px; font-size: 14px; }
        .transfer-list .t-label { color: #767676; margin-bottom: 4px; font-size: 12.5px; }
        .transfer-list div.item { padding: 2px 0; color: #333; font-weight: 600; }
        /* ปุ่มเติมจำนวนเร็ว */
        .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .quick button { border: 1px solid #eee; background: #fff; border-radius: 20px; padding: 4px 10px; font-family: inherit; font-size: 12px; font-weight: 700; color: #555; cursor: pointer; }
        /* ยอดหลังโอน */
        .after-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        .after-table th, .after-table td { padding: 6px 4px; text-align: right; border-bottom: 1px solid #f3f3f3; white-space: nowrap; }
        .after-table th:first-child, .after-table td:first-child { text-align: left; color: #555; }
        .after-table th { font-size: 11.5px; color: #767676; font-weight: 600; }
        .after-table .plus { color: #1f7a45; font-weight: 700; }
        .after-table .minus { color: #c43d58; font-weight: 700; }

        .my-balance { background: #fffbea; border: 1px solid #ffe8a3; border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
        .my-balance .t-label { color: #7a5a00; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
        #access-denied { display: none; text-align: center; padding: 80px 20px; color: #767676; }
        #access-denied i { font-size: 40px; color: #ffd7e1; display: block; margin-bottom: 14px; }
        #page-content { display: none; }
    </style>
    <link rel="stylesheet" href="assets/css/admin-theme.css">
</head>
<body>

<div class="top-navigation-bar">
    <button type="button" class="back-circle-btn" onclick="goBack()" aria-label="ย้อนกลับ">
        <i class="fa-solid fa-chevron-left"></i>
    </button>
    <div class="top-bar-title">โอน Token / Cookie / GEToken</div>
</div>

<div class="page-wrapper">
    <div id="access-denied">
        <i class="fa-solid fa-lock"></i>
        หน้านี้สำหรับ Role Admin เท่านั้นค่ะ
    </div>

    <div id="page-content">
        <div class="header-title-zone">
            <h1><i class="fa-solid fa-money-bill-transfer"></i> โอนเงินในระบบ</h1>
            <p>โอน Token / Cookie / GEToken จากบัญชีของคุณให้ User หรือ Member (หักจากยอดของคุณจริง)</p>
        </div>

        <div class="form-card" id="form-step">
            <div id="form-msg" class="form-msg"></div>

            <div class="my-balance">
                <div class="t-label">ยอดของคุณ (ผู้โอน)</div>
                <div class="balance-line" style="margin-bottom:0;">
                    <span><i class="fas fa-coins" style="color:#f59f00;"></i> <span class="my-token">-</span></span>
                    <span><i class="fas fa-cookie-bite" style="color:#d2691e;"></i> <span class="my-cookie">-</span></span>
                    <span><i class="fas fa-gem" style="color:#4dabf7;"></i> <span class="my-getoken">-</span></span>
                </div>
            </div>

            <div class="form-field">
                <label>Username ผู้รับ (User หรือ Member เท่านั้น)</label>
                <input id="tr-username" type="text" placeholder="เช่น 00-191">
            </div>
            <div class="form-field">
                <label>Token</label>
                <input id="tr-token" type="number" inputmode="numeric" min="0" value="0">
                <div class="quick" data-for="tr-token"></div>
            </div>
            <div class="form-field">
                <label>Cookie</label>
                <input id="tr-cookie" type="number" inputmode="numeric" min="0" value="0">
                <div class="quick" data-for="tr-cookie"></div>
            </div>
            <div class="form-field">
                <label>GEToken</label>
                <input id="tr-getoken" type="number" inputmode="numeric" min="0" value="0">
                <div class="quick" data-for="tr-getoken"></div>
            </div>

            <button class="btn-primary" id="lookup-btn" onclick="lookupTransferTarget()">
                <i class="fas fa-magnifying-glass"></i> ตรวจสอบข้อมูล
            </button>
        </div>

        <div class="form-card confirm-card" id="confirm-step">
            <div class="target-preview">
                <img id="cf-avatar" src="">
                <div>
                    <div class="t-name" id="cf-name"></div>
                    <div class="t-sub" id="cf-sub"></div>
                </div>
            </div>
            <div class="transfer-list">
                <div class="t-label">จะโอนให้ (หักจากบัญชีคุณ):</div>
                <div id="cf-transfer-items"></div>
                <!-- ยอดก่อน -> หลังโอน ของทั้งผู้รับและผู้โอน -->
                <table class="after-table" id="cf-after"></table>
            </div>
            <div id="confirm-msg" class="form-msg"></div>
            <button class="btn-primary" id="confirm-btn" onclick="confirmTransfer()" style="margin-top:14px;">
                <i class="fas fa-check"></i> ยืนยันการโอน
            </button>
            <button class="btn-secondary" onclick="resetTransferForm()">
                <i class="fas fa-arrow-left"></i> แก้ไขข้อมูล
            </button>
        </div>
    </div>
</div>

<script>
  let user = null;
  let pendingTransfer = null;
  let myBalance = null;

  // ยอดของแอดมินผู้โอน - การโอนหักจากบัญชีนี้จริง
  function renderMyBalance() {
    if (!myBalance) return;
    const fmt = v => Number(v || 0).toLocaleString();
    document.querySelectorAll('.my-token').forEach(el => el.textContent = fmt(myBalance.token));
    document.querySelectorAll('.my-cookie').forEach(el => el.textContent = fmt(myBalance.cookie));
    document.querySelectorAll('.my-getoken').forEach(el => el.textContent = fmt(myBalance.geToken));
  }
  async function loadMyBalance() {
    try {
      const w = await blm48GetWallet(user.username);
      if (w && w.token !== undefined) { myBalance = { token: Number(w.token) || 0, cookie: Number(w.cookie) || 0, geToken: Number(w.geToken) || 0 }; renderMyBalance(); }
    } catch (e) { console.error('โหลดยอดของแอดมินไม่สำเร็จ:', e); }
  }

  function goBack() {
    blm48Back('admin');
  }

  function resolveDriveImage(url) {
    const fallback = 'https://lh3.googleusercontent.com/d/1rebp2F8vyP0nyvsEOFD9Nw2mPcRtVqtG=s1000';
    if (!url) return fallback;
    if (url.includes('drive.google.com')) {
      const driveMatch = url.match(/[-\w]{25,}/);
      return driveMatch ? `https://lh3.googleusercontent.com/u/0/d/${driveMatch[0]}` : url;
    }
    return url;
  }

  function showFormError(msg) {
    const el = document.getElementById('form-msg');
    el.textContent = msg;
    el.classList.add('error');
  }
  function clearFormError() {
    const el = document.getElementById('form-msg');
    el.textContent = '';
    el.classList.remove('error');
  }

  function resetTransferForm() {
    pendingTransfer = null;
    document.getElementById('confirm-step').classList.remove('show');
    document.getElementById('form-step').style.display = 'block';
  }

  async function lookupTransferTarget() {
    clearFormError();
    const uname = document.getElementById('tr-username').value.trim();
    const token = parseFloat(document.getElementById('tr-token').value) || 0;
    const cookie = parseFloat(document.getElementById('tr-cookie').value) || 0;
    const getoken = parseFloat(document.getElementById('tr-getoken').value) || 0;

    if (!uname) { showFormError('กรุณากรอก Username ผู้รับ'); return; }
    if (token < 0 || cookie < 0 || getoken < 0) { showFormError('จำนวนต้องไม่ติดลบ'); return; }
    if (token === 0 && cookie === 0 && getoken === 0) { showFormError('กรุณากรอกจำนวนที่ต้องการโอนอย่างน้อย 1 ช่อง'); return; }
    if (uname === user.username) { showFormError('ไม่สามารถโอนให้บัญชีตัวเองได้'); return; }
    if (myBalance) {
      const short = [];
      if (token > myBalance.token) short.push('Token');
      if (cookie > myBalance.cookie) short.push('Cookie');
      if (getoken > myBalance.geToken) short.push('GEToken');
      if (short.length) { showFormError('ยอดในบัญชีของคุณไม่พอ: ' + short.join(', ')); return; }
    }

    const btn = document.getElementById('lookup-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบ...';
    try {
      const lookup = await blm48AdminLookupUser(user.username, uname);
      if (lookup.status !== 'success') {
        showFormError(lookup.message || 'ไม่พบผู้ใช้งานนี้');
      } else {
        pendingTransfer = { target: lookup.data, token, cookie, getoken };
        showConfirmStep();
      }
    } catch (e) {
      showFormError('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้งในภายหลัง');
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-magnifying-glass"></i> ตรวจสอบข้อมูล';
  }

  function showConfirmStep() {
    const { target, token, cookie, getoken } = pendingTransfer;
    document.getElementById('cf-avatar').src = resolveDriveImage(target.profile_img);
    document.getElementById('cf-name').textContent = target.name || target.username;
    document.getElementById('cf-sub').textContent = `@${target.username} · ${(target.role || '').toUpperCase()}`;

    const items = [];
    if (token > 0) items.push(`<div class="item">+ ${Number(token).toLocaleString()} Token</div>`);
    if (cookie > 0) items.push(`<div class="item">+ ${Number(cookie).toLocaleString()} Cookie</div>`);
    if (getoken > 0) items.push(`<div class="item">+ ${Number(getoken).toLocaleString()} GEToken</div>`);
    document.getElementById('cf-transfer-items').innerHTML = items.join('');

    // ตารางยอดก่อน -> หลังโอน (เฉพาะสกุลที่โอน) ของผู้รับ และของแอดมินผู้โอน
    const f = v => Number(v || 0).toLocaleString();
    const cur = [['Token', token, target.token, myBalance && myBalance.token], ['Cookie', cookie, target.cookie, myBalance && myBalance.cookie], ['GEToken', getoken, target.geToken, myBalance && myBalance.geToken]].filter(r => r[1] > 0);
    document.getElementById('cf-after').innerHTML = `
      <tr><th></th><th>ผู้รับ: ก่อน → หลัง</th><th>คุณ: ก่อน → หลัง</th></tr>
      ${cur.map(([label, amt, theirs, mine]) => `<tr>
        <td>${label}</td>
        <td>${f(theirs)} → <span class="plus">${f(Number(theirs || 0) + amt)}</span></td>
        <td>${mine == null ? '-' : `${f(mine)} → <span class="minus">${f(mine - amt)}</span>`}</td>
      </tr>`).join('')}`;

    document.getElementById('confirm-msg').textContent = '';
    document.getElementById('confirm-msg').classList.remove('error');
    document.getElementById('form-step').style.display = 'none';
    document.getElementById('confirm-step').classList.add('show');
  }

  // หน้ายืนยันนี้คือการยืนยันแล้ว กดปุ่มเดียวโอนเลย (ไม่ซ้อนป๊อปอัปยืนยันอีกชั้น)
  async function confirmTransfer() {
    if (!pendingTransfer) return;
    const { target, token, cookie, getoken } = pendingTransfer;
    const btn = document.getElementById('confirm-btn');
    const msg = document.getElementById('confirm-msg');
    const fail = (t) => { msg.textContent = t; msg.classList.add('error'); };
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังโอน...';
    try {
      const res = await blm48AdminTransferWallet(user.username, target.username, token, cookie, getoken);
      if (res.status === 'success') {
        if (res.adminBalance) { myBalance = { token: Number(res.adminBalance.token) || 0, cookie: Number(res.adminBalance.cookie) || 0, geToken: Number(res.adminBalance.geToken) || 0 }; renderMyBalance(); }
        await generateTransferSlip({ admin: user.username, adminName: user.name || user.username, adminAvatar: user.profile_img, target: res.data, token, cookie, getoken, refNo: res.refNo, createdAt: res.createdAt });
        document.getElementById('tr-username').value = '';
        document.getElementById('tr-token').value = 0;
        document.getElementById('tr-cookie').value = 0;
        document.getElementById('tr-getoken').value = 0;
        resetTransferForm();
      } else {
        fail(res.message || 'ไม่สามารถโอนได้');
      }
    } catch (e) {
      fail('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง');
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check"></i> ยืนยันการโอน';
  }

  // ปุ่มเติมจำนวนเร็ว: กดแล้วบวกเพิ่มจากที่กรอกอยู่
  const QUICK = { 'tr-token': [1, 5, 10, 50], 'tr-cookie': [10, 100, 500, 1000], 'tr-getoken': [1, 5, 10, 50] };
  function setupQuick() {
    document.querySelectorAll('.quick').forEach(box => {
      const id = box.dataset.for;
      box.innerHTML = QUICK[id].map(n => `<button type="button" data-n="${n}">+${n.toLocaleString()}</button>`).join('') + '<button type="button" data-n="0">ล้าง</button>';
      box.addEventListener('click', e => {
        const b = e.target.closest('button');
        if (!b) return;
        const inp = document.getElementById(id);
        inp.value = b.dataset.n === '0' ? 0 : (parseFloat(inp.value) || 0) + Number(b.dataset.n);
      });
    });
    // กด Enter ในฟอร์ม = ตรวจสอบข้อมูล
    document.getElementById('form-step').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); lookupTransferTarget(); } });
  }

  window.addEventListener('DOMContentLoaded', () => {
    user = getUserSession();
    if (!user) {
      window.location.href = 'login';
      return;
    }
    if (!(user.is_admin === true || (user.role && user.role.toLowerCase() === 'admin'))) {
      document.getElementById('access-denied').style.display = 'block';
      return;
    }
    document.getElementById('page-content').style.display = 'block';
    setupQuick();
    loadMyBalance();
  });
</script>
</body>
</html>
