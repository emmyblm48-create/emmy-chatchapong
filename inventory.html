<!DOCTYPE html>
<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>BLM48 Membership | Inventory</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffc0cb">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s192">
    <meta name="apple-mobile-web-app-title" content="BLM48">   
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <style>
        :root {
            --primary-pink: #ff85a2;
            --soft-bg: #fffbfd;
            --card-border: #ffeef2;
            --text-dark: #444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* 🤍 พื้นขาวล้วน ทับพื้นหลังไล่สีของ glass-mesh-bg ให้เข้าชุดกับหน้า Major Vote / Kami */
        body.glass-mesh-bg { background-color: #ffffff; background-image: none; }

        /* 📡 แถบบนสีขาว: ปุ่มย้อนกลับซ้าย + ชื่อหน้าตรงกลาง (แบบเดียวกับหน้า Kami) */
        .top-navigation-bar {
            position: sticky; top: 0; z-index: 100;
            height: 56px; display: flex; align-items: center; justify-content: center;
            background: #ffffff; border-bottom: 1px solid #e8e8e8;
            padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
        }
        .nav-back-btn {
            position: absolute; left: 6px; bottom: 6px;
            width: 44px; height: 44px; background: none; border: none;
            color: #222; font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .top-bar-page-title { font-size: 18px; font-weight: 600; color: #222; }

        .app-wrapper { width: 100%; max-width: 900px; margin: 0 auto; padding: 0 0 40px; }

        /* 📊 สรุปกระเป๋า: การ์ดขาวเงานุ่ม 2 ช่อง */
        .inv-summary-card {
            display: grid; grid-template-columns: 1fr 1fr;
            margin: 18px 20px 0; background: #fafafa; border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08); padding: 18px 0;
        }
        .inv-summary-box { display: flex; align-items: center; justify-content: center; gap: 12px; min-width: 0; }
        .inv-summary-box + .inv-summary-box { border-left: 1px solid #ececec; }
        .inv-summary-icon {
            width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333;
        }
        .inv-summary-value { font-size: 22px; font-weight: 700; color: #111; line-height: 1.1; }
        .inv-summary-label { font-size: 12px; color: #888; font-weight: 500; }

        /* 📦 ลิงก์พรีออเดอร์: แถวรายการพร้อมไอคอนวงกลมพาสเทล */
        .preorder-link-card {
            display: flex; align-items: center; gap: 14px;
            margin: 14px 20px 0; padding: 14px 0;
            border-bottom: 1px solid #eeeeee;
            text-decoration: none; color: inherit;
        }
        .preorder-link-icon {
            width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
            background: #fdf1bf; color: #333;
            display: flex; align-items: center; justify-content: center; font-size: 17px;
        }
        .preorder-link-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .preorder-link-title { font-weight: 600; color: #222; font-size: 15px; }
        .preorder-link-sub { font-size: 12.5px; color: #888; }
        .preorder-link-chevron { color: #aaa; font-size: 13px; flex-shrink: 0; }

        /* 🔍 ค้นหา + ตัวกรอง */
        .filter-section-container { display: flex; flex-direction: column; gap: 12px; margin: 18px 0 4px; }
        .inv-search-wrap { position: relative; display: flex; align-items: center; margin: 0 20px; }
        .inv-search-icon { position: absolute; left: 14px; color: #999; font-size: 14px; pointer-events: none; }
        .inv-search-input {
            width: 100%; background: #f2f2f5; border: 1px solid transparent; border-radius: 12px;
            padding: 11px 38px; font-family: 'Quicksand', 'Kanit', sans-serif;
            font-size: 14px; color: #222; outline: none; transition: border-color 0.2s ease, background 0.2s ease;
        }
        .inv-search-input::placeholder { color: #9a9a9a; }
        .inv-search-input:focus { background: #fff; border-color: var(--primary-pink); }
        .inv-search-clear {
            position: absolute; right: 6px; width: 32px; height: 32px;
            background: none; border: none; color: #999; font-size: 14px; cursor: pointer;
        }

        /* ชิปหมวดหมู่ เลื่อนซ้าย-ขวา (เดิมเป็น action sheet ต้องกดเปิดก่อน) */
        .chip-row {
            display: flex; gap: 8px; overflow-x: auto; white-space: nowrap;
            padding: 2px 20px; scrollbar-width: none;
        }
        .chip-row::-webkit-scrollbar { display: none; }
        .filter-chip {
            flex-shrink: 0; border: 1px solid #e5e5e5; background: #fff; color: #444;
            padding: 7px 16px; border-radius: 20px; cursor: pointer;
            font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 13.5px; font-weight: 500;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .filter-chip.active { background: var(--primary-pink); border-color: var(--primary-pink); color: #fff; font-weight: 600; }
        .filter-chip:active { transform: scale(0.96); }

        .sub-filter-row { display: flex; align-items: center; gap: 8px; margin: 0 20px; font-size: 13px; color: #888; }
        .sort-btn {
            border: none; background: #f2f2f5; border-radius: 20px; padding: 6px 14px;
            font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 13.5px; font-weight: 600; color: #222;
            cursor: pointer; display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
        }
        .sort-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sort-btn .chev { font-size: 11px; color: #888; }

        /* 🗂️ หัวข้อคอลเลกชัน: ตัวหนาซ้าย + จำนวนขวา (แบบหัวข้อหน้า Major Vote) */
        .collection-section { margin-top: 22px; }
        .collection-title {
            display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
            margin: 0 20px 12px; font-size: 17px; font-weight: 700; color: #222;
        }
        .collection-title > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .collection-count-badge { flex-shrink: 0; font-size: 13px; font-weight: 500; color: #888; }

        .item-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
            gap: 14px 12px; padding: 0 20px;
        }

        /* 🃏 การ์ดไอเทม: รูปในกรอบมน + จำนวนมุมขวาล่าง + ชื่อใต้รูป */
        .item-card {
            --tier-color: var(--primary-pink);
            position: relative; cursor: pointer; min-width: 0;
            -webkit-tap-highlight-color: transparent; transition: transform 0.15s;
        }
        .item-card:active { transform: scale(0.96); }
        .item-img-wrap {
            position: relative; aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden;
            background: #f6f6f8; border: 1.5px solid #eeeeee;
            display: flex; align-items: center; justify-content: center;
        }
        /* ⭐ ไอเทมที่ชื่อมีคำว่า SSR ให้มีกรอบทองเด่นตลอดเวลา */
        .item-card-ssr .item-img-wrap {
            border-color: #e0b953;
            box-shadow: 0 0 0 1px rgba(224, 185, 83, 0.45), 0 4px 12px rgba(224, 185, 83, 0.25);
        }
        .item-img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 6px; }
        .item-qty {
            position: absolute; right: 6px; bottom: 6px; z-index: 2;
            background: rgba(0, 0, 0, 0.6); color: #fff;
            font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
        }
        .item-book-badge {
            position: absolute; left: 6px; top: 6px; z-index: 2;
            width: 24px; height: 24px; border-radius: 50%;
            background: var(--tier-color); color: #fff; font-size: 11px;
            display: flex; align-items: center; justify-content: center;
        }
        .item-name {
            display: flex; align-items: center; gap: 5px;
            font-size: 12.5px; font-weight: 500; color: #333; margin-top: 7px;
        }
        .item-name > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* จุดสีประจำหมวดหมู่หน้าชื่อไอเทม */
        .item-name::before {
            content: ''; width: 7px; height: 7px; border-radius: 50%;
            background: var(--tier-color); flex-shrink: 0;
        }

        .inv-state-box {
            text-align: center; color: #aaa; font-size: 13.5px; padding: 50px 20px;
        }
        .inv-state-box i { font-size: 30px; color: #d5d5d5; display: block; margin-bottom: 12px; }
        .inv-state-box.is-error i { color: #ffb3c1; }

        /* 🖼️ หน้าต่างดูไอเทม */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 1000;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-body-content {
            background: #ffffff; padding: 20px; border-radius: 22px;
            max-width: 380px; width: 100%; text-align: center; position: relative;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
            animation: zoomInSubtle 0.2s ease-out;
        }
        @keyframes zoomInSubtle {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-body-content img {
            width: 100%; max-height: 320px; object-fit: contain;
            border-radius: 14px; background: #f6f6f8; margin-bottom: 14px;
        }
        .modal-item-name { font-size: 17px; font-weight: 700; color: #222; margin-bottom: 8px; line-height: 1.3; }
        .modal-item-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 18px; }
        .modal-meta-tag {
            font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 10px;
            color: #fff; background: var(--tier-color, var(--primary-pink));
        }
        .modal-meta-tag.is-sub { background: #f2f2f5; color: #666; }
        .modal-meta-tag.is-qty { background: #fff0f3; color: var(--primary-pink); }

        .inv-delete-zone { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; }
        .inv-qty-stepper { display: flex; align-items: center; gap: 10px; background: #f2f2f5; border-radius: 999px; padding: 5px 6px; }
        .inv-qty-btn {
            width: 28px; height: 28px; border-radius: 50%; border: none; background: #fff;
            color: #222; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08);
        }
        .inv-qty-btn:active { transform: scale(0.92); }
        .inv-qty-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .inv-qty-value { min-width: 20px; text-align: center; font-weight: 700; color: #222; font-size: 14px; }
        .btn-delete-item {
            background: #fff0f0; color: #e0435c; border: none; padding: 9px 16px; border-radius: 20px;
            font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 13px; font-weight: 600;
            display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
        }

        .modal-action-buttons { display: flex; gap: 10px; justify-content: center; }
        .modal-action-buttons > * { flex: 1; justify-content: center; }
        .btn-close-modal {
            background: #f2f2f5; color: #333; border: none; padding: 12px 18px; border-radius: 14px;
            font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .btn-save-image {
            background: var(--primary-pink); color: #fff; text-decoration: none;
            padding: 12px 18px; border-radius: 14px; border: none; cursor: pointer;
            font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 14px; font-weight: 600;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-close-modal:active, .btn-save-image:active { transform: scale(0.97); }

        /* --- ตัวอ่าน E-Book (EPUB) สำหรับโฟโต้บุ๊ค --- */
        .epub-reader-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #1c1c1e;
            z-index: 2000;
            flex-direction: column;
        }
        .epub-reader-overlay.active { display: flex; }

        .epub-reader-header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #111;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .epub-reader-title {
            flex: 1;
            min-width: 0;
            color: #fff;
            font-family: 'Quicksand', 'Kanit', sans-serif;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .epub-close-btn {
            flex: 0 0 auto;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .epub-close-btn:hover { background: var(--primary-pink); }

        .epub-viewer {
            flex: 1;
            min-height: 0;
            background: #fff;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        /* --- StPageFlip (โหมด Canvas: loadFromImages) ---
           #flipbookRoot ได้ class .stf__parent ติดที่ตัวมันเองจาก PageFlip
           (ไม่ใช่ลูกหลาน) จึงต้องใช้ compound selector ไม่ใช่ descendant */
        #flipbookRoot.stf__parent {
            position: relative;
            display: block;
            box-sizing: border-box;
            transform: translateZ(0);
            touch-action: pan-y;
            box-shadow: 0 4px 24px rgba(0,0,0,0.35);
        }
        #flipbookRoot .stf__wrapper {
            position: relative;
            width: 100%;
            box-sizing: border-box;
        }
        #flipbookRoot canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
        }

        .epub-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #999;
            font-family: 'Quicksand', 'Kanit', sans-serif;
            font-size: 13px;
            text-align: center;
            padding: 30px;
        }
        .epub-loading i {
            font-size: 26px;
            color: var(--primary-pink);
        }

        .epub-reader-nav {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            background: #111;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .epub-nav-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--primary-pink);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .epub-page-indicator {
            color: #ccc;
            font-size: 12px;
            font-family: 'Quicksand', 'Kanit', sans-serif;
            min-width: 60px;
            text-align: center;
        }
        /* 🍎 Filter แบบ iOS action sheet (เหมือนหน้า Campaign) */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 3000; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
        .sheet-overlay.open { opacity: 1; pointer-events: auto; }
        .sheet { width: 100%; max-width: 640px; max-height: 85vh; display: flex; flex-direction: column; padding: 0 10px calc(10px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s ease; }
        .sheet-overlay.open .sheet { transform: translateY(0); }
        .sheet-group { background: rgba(245,245,247,.92); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 14px; overflow-y: auto; }
        .sheet-option { display: block; width: 100%; border: none; background: none; font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 20px; color: #111; padding: 17px 12px; cursor: pointer; text-align: center; }
        .sheet-option + .sheet-option { border-top: 0.5px solid rgba(60,60,67,.29); }
        .sheet-option:active { background: rgba(0,0,0,.06); }
        .sheet-cancel { display: block; width: 100%; flex-shrink: 0; margin-top: 8px; border: none; background: #fff; border-radius: 14px; font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 20px; font-weight: 700; color: #111; padding: 17px 12px; cursor: pointer; }
        .sheet-cancel:active { background: #f0f0f0; }
    </style>
</head>
<body class="glass-mesh-bg force-white-bg">

    <div class="top-navigation-bar">
        <button type="button" class="nav-back-btn" onclick="goBackFromInventory()" aria-label="ย้อนกลับ">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="top-bar-page-title">Inventory</div>
    </div>

    <div class="app-wrapper">
        <div class="inv-summary-card">
            <div class="inv-summary-box">
                <div class="inv-summary-icon" style="background:#fde9ec;"><i class="fa-solid fa-layer-group"></i></div>
                <div>
                    <div class="inv-summary-value" id="stat-total-items">0</div>
                    <div class="inv-summary-label">Total Items</div>
                </div>
            </div>
            <div class="inv-summary-box">
                <div class="inv-summary-icon" style="background:#e0edfb;"><i class="fa-solid fa-boxes-stacked"></i></div>
                <div>
                    <div class="inv-summary-value" id="stat-total-collections">0</div>
                    <div class="inv-summary-label">Collections</div>
                </div>
            </div>
        </div>

        <a href="orders" class="preorder-link-card">
            <div class="preorder-link-icon"><i class="fa-solid fa-box"></i></div>
            <div class="preorder-link-text">
                <span class="preorder-link-title">My Order</span>
                <span class="preorder-link-sub">ดูคำสั่งซื้อ สถานะจัดส่ง และกด Redeem รับของ</span>
            </div>
            <i class="fa-solid fa-chevron-right preorder-link-chevron"></i>
        </a>

        <div class="filter-section-container">
            <div class="inv-search-wrap">
                <i class="fa-solid fa-magnifying-glass inv-search-icon"></i>
                <input type="text" id="inventory-search-input" class="inv-search-input" placeholder="ค้นหาไอเทมด้วยชื่อ..." oninput="onInventorySearchInput(this.value)">
                <button type="button" id="inventory-search-clear" class="inv-search-clear hidden" onclick="clearInventorySearch()" aria-label="ล้างคำค้นหา"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="chip-row" id="filter-chips"></div>
            <div id="coaster-sub-panel" class="sub-filter-row hidden">
                <span>Collection</span>
                <button type="button" class="sort-btn" onclick="openSubFilterSheet()"><span id="sub-filter-current">All</span><i class="fa-solid fa-chevron-down chev"></i></button>
            </div>
        </div>

        <div id="inventory-container">
            <div class="inv-state-box"><i class="fa-solid fa-spinner fa-spin"></i>กำลังหาคอลเลกชันของคุณ...</div>
        </div>
    </div>

    <div id="filter-sheet" class="sheet-overlay" onclick="if (event.target === this) closeFilterSheet()">
        <div class="sheet">
            <div class="sheet-group" id="filter-options"></div>
            <button type="button" class="sheet-cancel" onclick="closeFilterSheet()">Cancel</button>
        </div>
    </div>

    <div id="previewModal" class="modal-overlay" onclick="closePreview()">
        <div class="modal-body-content" onclick="event.stopPropagation()">
            <img id="previewImg" src="" alt="Item Preview">
            <div class="modal-item-name" id="previewName"></div>
            <div class="modal-item-meta" id="previewMeta"></div>
            <div class="inv-delete-zone hidden" id="deleteZone">
                <div class="inv-qty-stepper">
                    <button type="button" class="inv-qty-btn" id="deleteQtyMinus">−</button>
                    <span class="inv-qty-value" id="deleteQtyValue">1</span>
                    <button type="button" class="inv-qty-btn" id="deleteQtyPlus">+</button>
                </div>
                <button type="button" class="btn-delete-item" onclick="confirmDeleteInventoryItem()">
                    <i class="fa-solid fa-trash-can"></i> ลบไอเทม
                </button>
            </div>
            <div class="modal-action-buttons">
                <button type="button" class="btn-close-modal" onclick="closePreview()">Close</button>
                <button type="button" id="viewPhotoBookBtn" class="btn-save-image" style="display:none;" onclick="openEpubReaderFromPreview()">
                    <i class="fa-solid fa-book-open"></i> Read
                </button>
                <a id="saveImgBtn" href="" target="_blank" download="blm48_reward.png" class="btn-save-image">
                    <i class="fa-solid fa-download"></i> Save
                </a>
            </div>
        </div>
    </div>

    <div id="epubReaderModal" class="epub-reader-overlay">
        <div class="epub-reader-header">
            <div class="epub-reader-title" id="epubReaderTitle"></div>
            <button type="button" class="epub-close-btn" onclick="closeEpubReader()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="epubViewer" class="epub-viewer"></div>
        <div class="epub-reader-nav">
            <button type="button" class="epub-nav-btn" onclick="epubPrev()"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="epubPageIndicator" class="epub-page-indicator"></span>
            <button type="button" class="epub-nav-btn" onclick="epubNext()"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>


<script>
    let user = getUserSession();
    let currentUsername = user ? user.username : "";
    
    // 🗂️ ตัวแปรสำหรับระบบตัวกรองอัจฉริยะ (แบบยืดหยุ่นรองรับอนาคต)
    let globalInventoryData = null; 
    let currentPrimaryTab = 'all';  // 'all', 'cafe', 'coaster', 'thankyou', 'photoset', 'photobook', 'others'
    let currentSubTab = 'all';      // 'all' หรือชื่องานย่อยเฉพาะ เช่น 'BLM48 Tanabata 2026'
    // หมวดหลักทั้งหมด (แสดงเฉพาะหมวดที่ผู้ใช้มีไอเทมจริง ยกเว้น All)
    const PRIMARY_FILTERS = [
        { value: 'all',       label: 'All',             cats: null },
        { value: 'ssr',       label: 'SSR',             cats: ['BLM48 SSR Photo', 'SSR_card'] },
        { value: 'preorder',  label: 'Pre-order',       cats: ['Pre-order'] },
        { value: 'photobook', label: 'BLM48 Photobook', cats: ['BLM48 Photobook'] },
        { value: 'photocard', label: 'BLM48 PhotoCard', cats: ['BLM48 PhotoCard'] },
        { value: 'photoset',  label: 'BLM48 PhotoSet',  cats: ['BLM48 PhotoSet'] },
        { value: 'thankyou',  label: 'Thank You Card',  cats: ['Thank You Card'] },
        { value: 'cafe',      label: 'BLM48 Cafe',      cats: ['BLM48 Cafe'] },
        { value: 'coaster',   label: 'Coaster',         cats: ['Coaster'] },
        { value: 'others',    label: 'Other',           cats: ['หมวดหมู่อื่นๆ'] },
    ];

    let currentSearchQuery = '';    // คำค้นหาชื่อไอเทม (lowercase แล้ว)

    function onInventorySearchInput(value) {
        currentSearchQuery = (value || '').trim().toLowerCase();
        document.getElementById('inventory-search-clear').classList.toggle('hidden', currentSearchQuery === '');
        renderInventoryData();
    }

    function clearInventorySearch() {
        currentSearchQuery = '';
        document.getElementById('inventory-search-input').value = '';
        document.getElementById('inventory-search-clear').classList.add('hidden');
        renderInventoryData();
    }

    window.onload = async () => {
        if (!user || !currentUsername) {
            Swal.fire('กรุณาเข้าสู่ระบบ', 'ไม่พบสิทธิ์การใช้งานกระเป๋า กรุณาล็อกอินก่อนนะงับ', 'error').then(() => {
                window.location.href = 'index';
            });
            return;
        }
        
        await loadMyInventory();
    };

    function goBackFromInventory() {
        if (document.referrer && window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = 'majorvote';
        }
    }

    // โหลดข้อมูลแบบ Anti-Cache เพื่อให้ได้ของในกระเป๋าล่าสุดแบบเรียลไทม์
    async function loadMyInventory() {
        const container = document.getElementById('inventory-container');
        container.innerHTML = `<div class="inv-state-box"><i class="fa-solid fa-spinner fa-spin"></i>กำลังเปิดค้นหากระเป๋าสะสมดิจิทัลล่าสุด...</div>`;

        try {
            // ทุกไอเทม (กาชา, BLM48 Cafe, ตั๋วคอนเสิร์ต, การ์ดขอบคุณจากโหวต/ของขวัญ) อยู่ใน Supabase แล้วทั้งหมด
            const supabaseInventory = await blm48GetInventory(currentUsername).catch(() => []);

            if (Array.isArray(supabaseInventory)) {
                const merged = {};
                const addAll = (list) => {
                    (list || []).forEach(item => {
                        const key = item.category + '||' + item.name;
                        if (!merged[key]) {
                            merged[key] = { ...item, qty: 0 };
                        }
                        merged[key].qty += Number(item.qty) || 0;
                    });
                };
                addAll(supabaseInventory);

                globalInventoryData = Object.values(merged);
                updateInventoryStats();
                renderFilters();
                renderInventoryData();
            } else {
                container.innerHTML = `<div class="inv-state-box is-error"><i class="fa-solid fa-triangle-exclamation"></i>ดึงข้อมูลล้มเหลว: ระบุกระเป๋าไม่ถูกต้อง</div>`;
            }
        } catch (err) {
            console.error(err);
            container.innerHTML = `<div class="inv-state-box is-error"><i class="fa-solid fa-triangle-exclamation"></i>โหลดข้อมูลกระเป๋าขัดข้อง กรุณาลองใหม่อีกครั้งนะงับ</div>`;
        }
    }

    // 📊 คำนวณสถิติภาพรวมของกระเป๋า (จำนวนไอเทมทั้งหมด / จำนวนคอลเลกชัน) แสดงบน Hero Card
    function updateInventoryStats() {
        const totalItemsEl = document.getElementById('stat-total-items');
        const totalCollectionsEl = document.getElementById('stat-total-collections');
        if (!globalInventoryData) return;

        const totalItems = globalInventoryData.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
        const totalCollections = new Set(globalInventoryData.map(item => item.subCollection).filter(Boolean)).size;

        if (totalItemsEl) totalItemsEl.textContent = totalItems.toLocaleString();
        if (totalCollectionsEl) totalCollectionsEl.textContent = totalCollections.toLocaleString();
    }

    // ⭐ เช็กจากชื่อไอเทมตรงๆ ว่ามีคำว่า "SSR" อยู่ไหม (ไม่ใช่แค่เช็กจาก category)
    // เพื่อให้ของหายากที่ได้จากกาชาคอลเลกชันอื่นๆ (ไม่ใช่แค่หมวด SSR Photo โดยตรง) ก็ได้กรอบทองด้วย
    function isSsrByName(name) {
        return /ssr/i.test(name || '');
    }

    // 🎨 กำหนดสีประจำหมวดหมู่ ให้แต่ละไอเทมมีโทนสีต่างกันตามระดับ/ประเภท เหมือนการ์ดสะสม
    function getTierColor(category) {
        switch (category) {
            case 'BLM48 SSR Photo':
            case 'SSR_card':
                return '#e0b953'; // ทอง
            case 'Pre-order':
                return '#c9932c'; // ทองเข้ม เหมือนป้าย [Pre-order] ในหน้า shop
            case 'BLM48 Cafe':
                return '#4caf82'; // เขียวมิ้นต์
            case 'Coaster':
                return '#4dabf7'; // ฟ้า
            case 'Thank You Card':
                return 'var(--primary-pink)'; // ชมพู
            case 'BLM48 PhotoSet':
                return '#9775fa'; // ม่วง
            case 'BLM48 Photobook':
                return '#ff922b'; // ส้ม
            case 'BLM48 PhotoCard':
                return '#20c997'; // เขียวมิ้นต์เข้ม
            default:
                return '#a0a0a0'; // เทา สำหรับหมวดหมู่อื่นๆ
        }
    }

    // ฟังก์ชันช่วยเช็คว่ามีไอเทมในกลุ่มหลักนี้หรือไม่
    function hasCategory(catName) {
        if (!globalInventoryData) return false;
        return globalInventoryData.some(item => item.category === catName);
    }


    // ดึงรายชื่องานย่อย (Sub Collections) ทั้งหมดภายใต้กลุ่มหลัก
    function getSubCollections(catName) {
        if (!globalInventoryData) return [];
        const subs = new Set();
        globalInventoryData.forEach(item => {
            if (item.category === catName && item.subCollection) {
                subs.add(item.subCollection);
            }
        });
        return Array.from(subs).sort((a, b) => a.localeCompare(b, 'th'));
    }

    function availablePrimaryFilters() {
        return PRIMARY_FILTERS.filter(f => !f.cats || f.cats.some(c => hasCategory(c)));
    }

    // หมวดที่มีตัวกรองย่อยตามชื่องาน/คอลเลกชัน
    const SUB_FILTER_CATEGORY = {
        coaster: 'Coaster',
        thankyou: 'Thank You Card',
        photoset: 'BLM48 PhotoSet',
        photobook: 'BLM48 Photobook',
        photocard: 'BLM48 PhotoCard',
    };

    // ชื่อคอลเลกชันสำหรับแสดงผล: ตัด prefix ภายใน (votemajor_ / gacha_) แล้วขึ้นต้นตัวพิมพ์ใหญ่
    function formatCollectionName(name) {
        const label = String(name || '').replace('votemajor_', '').replace('gacha_', '');
        return label.charAt(0).toUpperCase() + label.slice(1);
    }

    function subFilterOptions() {
        const cat = SUB_FILTER_CATEGORY[currentPrimaryTab];
        if (!cat) return [];
        const subs = getSubCollections(cat).map(name => ({ value: name, label: formatCollectionName(name) }));
        return [{ value: 'all', label: 'All' }, ...subs];
    }

    // 🍎 action sheet ใช้ร่วมกันทั้งตัวกรองหลักและตัวกรองย่อย (เลือกด้วย index กันชื่อที่มี ' หรือ ")
    let sheetOptions = [];
    let sheetOnPick = null;
    function openSheet(options, currentValue, onPick) {
        sheetOptions = options;
        sheetOnPick = onPick;
        document.getElementById('filter-options').innerHTML = options.map((o, i) =>
            `<button type="button" class="sheet-option" onclick="pickSheetOption(${i})">${o.value === currentValue ? '✔ ' : ''}${escapeHtml(o.label)}</button>`
        ).join('');
        document.getElementById('filter-sheet').classList.add('open');
    }
    function pickSheetOption(i) {
        closeFilterSheet();
        if (sheetOnPick && sheetOptions[i]) sheetOnPick(sheetOptions[i].value);
    }
    function closeFilterSheet() {
        document.getElementById('filter-sheet').classList.remove('open');
    }
    function openSubFilterSheet() {
        openSheet(subFilterOptions(), currentSubTab, selectSubTab);
    }

   function renderFilters() {
    // ชิปหมวดหลัก (โชว์เฉพาะหมวดที่ผู้ใช้มีไอเทมจริง)
    const chips = document.getElementById('filter-chips');
    if (chips) {
        chips.innerHTML = availablePrimaryFilters().map(f =>
            `<button type="button" class="filter-chip${f.value === currentPrimaryTab ? ' active' : ''}" onclick="selectPrimaryTab('${f.value}')">${escapeHtml(f.label)}</button>`
        ).join('');
    }

    // --- 🔘 ตัวกรองย่อย: แสดงเฉพาะหมวดที่มีชื่องานย่อย ---
    const subPanel = document.getElementById('coaster-sub-panel');
    const subLabel = document.getElementById('sub-filter-current');
    const subOpts = subFilterOptions();
    if (!subPanel) return;
    if (subOpts.length > 1) {
        subPanel.classList.remove('hidden');
        const sub = subOpts.find(o => o.value === currentSubTab) || subOpts[0];
        if (subLabel) subLabel.textContent = sub.label;
    } else {
        subPanel.classList.add('hidden');
    }
}

    function selectPrimaryTab(tabName) {
        currentPrimaryTab = tabName;
        currentSubTab = 'all'; // รีเซ็ตตัวกรองย่อยเสมอเวลาเปลี่ยนหมวดใหญ่
        renderFilters();
        renderInventoryData();
    }

    function selectSubTab(subTabName) {
        currentSubTab = subTabName;
        renderFilters();
        renderInventoryData();
    }

   // ฟังก์ชันวาดการ์ดไอเทมสะสมลงหน้าจอตามฟิลเตอร์
function renderInventoryData() {
    const container = document.getElementById('inventory-container');
    container.innerHTML = "";
    
    if (!globalInventoryData || globalInventoryData.length === 0) {
        container.innerHTML = `<div class="inv-state-box"><i class="fa-solid fa-box-open"></i>กระเป๋ายังว่างเปล่าอยู่เลยงับ</div>`;
        return;
    }

    // คัดกรองไอเทมตามเงื่อนไขที่เลือก
    let filteredItems = globalInventoryData.filter(item => {
        if (currentPrimaryTab === 'cafe' && item.category !== 'BLM48 Cafe') return false;
        if (currentPrimaryTab === 'coaster' && item.category !== 'Coaster') return false;
        if (currentPrimaryTab === 'thankyou' && item.category !== 'Thank You Card') return false;
        
        // ⭐ เพิ่มเงื่อนไขเช็กสำหรับแท็บ SSR (เช็กเผื่อไว้ให้ทั้ง Name และ ID)
        if (currentPrimaryTab === 'ssr' && item.category !== 'BLM48 SSR Photo' && item.category !== 'SSR_card') return false;

        if (currentPrimaryTab === 'preorder' && item.category !== 'Pre-order') return false;

        if (currentPrimaryTab === 'photoset' && item.category !== 'BLM48 PhotoSet') return false;
        if (currentPrimaryTab === 'photobook' && item.category !== 'BLM48 Photobook') return false;
        if (currentPrimaryTab === 'photocard' && item.category !== 'BLM48 PhotoCard') return false;

        if (currentPrimaryTab === 'others' && item.category !== 'หมวดหมู่อื่นๆ') return false;

        // ตัวกรองย่อย
        if (currentSubTab !== 'all' && item.subCollection !== currentSubTab) return false;

        // ค้นหาด้วยชื่อไอเทม
        if (currentSearchQuery && !item.name.toLowerCase().includes(currentSearchQuery)) return false;

        return true;
    });

    if (filteredItems.length === 0) {
        const stateBox = document.createElement('div');
        stateBox.className = 'inv-state-box';
        if (currentSearchQuery) {
            stateBox.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i>ไม่พบไอเทมที่ตรงกับ "`;
            stateBox.appendChild(document.createTextNode(currentSearchQuery));
            stateBox.appendChild(document.createTextNode('"'));
        } else {
            stateBox.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i>ไม่พบไอเทมในหมวดหมู่นี้งับ`;
        }
        container.appendChild(stateBox);
        return;
    }

    // จัดกลุ่มไอเทมแยกตามชื่องานย่อยเพื่อทำกล่อง Section หัวข้อ
    const grouped = {};
    filteredItems.forEach(item => {
        if (!grouped[item.subCollection]) grouped[item.subCollection] = [];
        grouped[item.subCollection].push(item);
    });

    // เรียงกลุ่มหัวข้อตามตัวอักษรไทย ก-ฮ
    const sortedGroupKeys = Object.keys(grouped).sort((a, b) => a.localeCompare(b, 'th'));

    sortedGroupKeys.forEach(subName => {
        // ของที่ชื่อมีคำว่า SSR ให้ขึ้นก่อนเสมอในคอลเลกชันนั้นๆ ที่เหลือเรียง ก-ฮ ตามเดิม
        const items = grouped[subName].sort((a, b) => {
            const aSsr = isSsrByName(a.name);
            const bSsr = isSsrByName(b.name);
            if (aSsr !== bSsr) return aSsr ? -1 : 1;
            return a.name.localeCompare(b.name, 'th');
        });

        const section = document.createElement('div');
        section.className = 'collection-section';
        
        const title = document.createElement('div');
        title.className = 'collection-title';
        title.innerHTML = `
            <span>${escapeHtml(formatCollectionName(subName))}</span>
            <span class="collection-count-badge">${items.length} รายการ</span>
        `;
        section.appendChild(title);
        
        const grid = document.createElement('div');
        grid.className = 'item-grid';
        
        items.forEach(item => {
            const isSSR = isSsrByName(item.name);
            const card = document.createElement('div');
            card.className = 'item-card' + (isSSR ? ' item-card-ssr' : '');
            card.style.setProperty('--tier-color', isSSR ? '#e0b953' : getTierColor(item.category));
            card.onclick = () => openPreview(item);

            card.innerHTML = `
                <div class="item-img-wrap">
                    ${item.fileUrl ? '<span class="item-book-badge"><i class="fa-solid fa-book-open"></i></span>' : ''}
                    <img class="item-img" src="${escapeAttr(item.img)}" alt="${escapeAttr(item.name)}" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/140x140/f6f6f8/ff85a2?text=BLM48';">
                    <span class="item-qty">x${item.qty}</span>
                </div>
                <div class="item-name" title="${escapeAttr(item.name)}"><span>${escapeHtml(item.name)}</span></div>
            `;
            grid.appendChild(card);
        });
        
        section.appendChild(grid);
        container.appendChild(section);
    });
}

    let currentPreviewItem = null;

    // หมวดหมู่ที่ห้ามลบ เพราะหายาก/มีค่า ป้องกันผู้ใช้กดลบพลาดของสำคัญ
    const PROTECTED_DELETE_CATEGORIES = ['BLM48 SSR Photo', 'SSR_card', 'BLM48 Photobook', 'Pre-order'];
    let deleteQty = 1;

    function openPreview(item) {
        currentPreviewItem = item;
        document.getElementById('previewImg').src = item.img;
        document.getElementById('saveImgBtn').href = item.img;
        document.getElementById('previewName').textContent = item.name;

        const viewPhotoBookBtn = document.getElementById('viewPhotoBookBtn');
        viewPhotoBookBtn.style.display = item.fileUrl ? 'inline-flex' : 'none';

        const meta = document.getElementById('previewMeta');
        meta.style.setProperty('--tier-color', isSsrByName(item.name) ? '#e0b953' : getTierColor(item.category));
        meta.innerHTML = `
            <span class="modal-meta-tag">${item.category}</span>
            ${item.subCollection && item.subCollection !== item.category ? `<span class="modal-meta-tag is-sub">${item.subCollection}</span>` : ''}
            <span class="modal-meta-tag is-qty">มีอยู่ x${item.qty}</span>
        `;

        deleteQty = 1;
        document.getElementById('deleteQtyValue').textContent = deleteQty;
        const deleteZone = document.getElementById('deleteZone');
        const canDelete = !PROTECTED_DELETE_CATEGORIES.includes(item.category);
        deleteZone.classList.toggle('hidden', !canDelete);
        if (canDelete) {
            document.getElementById('deleteQtyMinus').disabled = deleteQty <= 1;
            document.getElementById('deleteQtyPlus').disabled = deleteQty >= (Number(item.qty) || 1);
        }

        document.getElementById('previewModal').style.display = 'flex';
        blm48LockBodyScroll();
    }

    function closePreview() {
        document.getElementById('previewModal').style.display = 'none';
        blm48UnlockBodyScroll();
    }

    function changeDeleteQty(delta) {
        if (!currentPreviewItem) return;
        const maxQty = Number(currentPreviewItem.qty) || 1;
        deleteQty = Math.min(maxQty, Math.max(1, deleteQty + delta));
        document.getElementById('deleteQtyValue').textContent = deleteQty;
        document.getElementById('deleteQtyMinus').disabled = deleteQty <= 1;
        document.getElementById('deleteQtyPlus').disabled = deleteQty >= maxQty;
    }

    // กดค้างปุ่ม +/- ให้เพิ่ม/ลดจำนวนรัวๆ โดยไม่ต้องกดซ้ำหลายรอบ (กดครั้งเดียวขยับ 1 ก่อน
    // แล้วค่อยเริ่มรัวหลังจากค้างไว้สักครู่ กันการเผลอกดครั้งเดียวแล้วขยับเกิน)
    function bindHoldToRepeat(button, onStep) {
        const HOLD_DELAY_MS = 400;
        const REPEAT_INTERVAL_MS = 90;
        let holdTimeout = null;
        let repeatInterval = null;

        function stepIfEnabled() {
            if (button.disabled) { stopHolding(); return; }
            onStep();
        }

        function stopHolding() {
            clearTimeout(holdTimeout);
            clearInterval(repeatInterval);
            holdTimeout = null;
            repeatInterval = null;
        }

        button.addEventListener('pointerdown', (e) => {
            if (button.disabled) return;
            e.preventDefault();
            stepIfEnabled();
            holdTimeout = setTimeout(() => {
                repeatInterval = setInterval(stepIfEnabled, REPEAT_INTERVAL_MS);
            }, HOLD_DELAY_MS);
        });

        ['pointerup', 'pointerleave', 'pointercancel'].forEach(evt => {
            button.addEventListener(evt, stopHolding);
        });
    }

    bindHoldToRepeat(document.getElementById('deleteQtyMinus'), () => changeDeleteQty(-1));
    bindHoldToRepeat(document.getElementById('deleteQtyPlus'), () => changeDeleteQty(1));

    async function confirmDeleteInventoryItem() {
        if (!currentPreviewItem) return;
        const item = currentPreviewItem;
        const qtyToDelete = deleteQty;

        const result = await Swal.fire({
            title: 'ลบไอเทมนี้?',
            html: `ต้องการลบ <b>${escapeHtml(item.name)}</b> จำนวน <b>${qtyToDelete}</b> ชิ้น ออกจากกระเป๋าใช่ไหม?<br><span style="color:#999;font-size:12px;">การลบไม่สามารถย้อนกลับได้นะงับ</span>`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'ลบเลย',
            cancelButtonText: 'ยกเลิก',
            confirmButtonColor: '#e0435c'
        });
        if (!result.isConfirmed) return;

        const res = await blm48DeleteInventoryItems(currentUsername, item.category, item.subCollection, item.name, qtyToDelete);
        if (res && res.status === 'success') {
            closePreview();
            await Swal.fire({ icon: 'success', title: 'ลบไอเทมเรียบร้อยแล้ว', timer: 1500, showConfirmButton: false });
            await loadMyInventory();
        } else {
            Swal.fire('ลบไม่สำเร็จ', (res && res.message) || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้งนะงับ', 'error');
        }
    }

    // =========================================================================
    // 📖 ตัวอ่านโฟโต้บุ๊คแบบพลิกหน้าเหมือนกระดาษจริง (StPageFlip, โหมด Canvas)
    // แต่ละเล่มเก็บเป็น "โฟลเดอร์รูปภาพ" ใน Supabase Storage (bucket app-assets)
    // ไฟล์ชื่อ page_001.jpg, page_002.jpg, ... โดย item.fileUrl เก็บแค่ path
    // โฟลเดอร์ เช่น "photobooks/NOEL" — โหลดลิสต์ไฟล์แล้วป้อน URL ตรงๆ ให้ PageFlip
    // (ไม่ต้องแกะ zip/HTML/font เองอีกต่อไป เบากว่าและเสถียรกว่าบน Safari มาก)
    // =========================================================================
    const PHOTOBOOK_BUCKET = 'app-assets';
    let currentFlipBook = null;

    function openEpubReaderFromPreview() {
        if (!currentPreviewItem || !currentPreviewItem.fileUrl) return;
        closePreview();
        openEpubReader(currentPreviewItem.fileUrl, currentPreviewItem.name);
    }

    function showFlipbookError(viewerEl) {
        viewerEl.innerHTML = `
            <div class="epub-loading">
                <i class="fa-solid fa-triangle-exclamation"></i>
                เปิดไฟล์ไม่สำเร็จ กรุณาลองใหม่ หรือดาวน์โหลดไฟล์แทน
            </div>
        `;
    }

    async function openEpubReader(folderPath, title) {
        const overlay = document.getElementById('epubReaderModal');
        const viewerEl = document.getElementById('epubViewer');
        document.getElementById('epubReaderTitle').textContent = title || '';
        document.getElementById('epubPageIndicator').textContent = '';
        viewerEl.innerHTML = `<div class="epub-loading"><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดโฟโต้บุ๊ค...</div>`;
        overlay.classList.add('active');
        blm48LockBodyScroll();

        try {
            const { data: files, error } = await blm48Supabase.storage
                .from(PHOTOBOOK_BUCKET)
                .list(folderPath, { sortBy: { column: 'name', order: 'asc' } });
            if (error) throw error;

            const imageFiles = (files || []).filter(f => /\.(jpe?g|png|webp)$/i.test(f.name));
            if (!imageFiles.length) throw new Error('ไม่พบไฟล์รูปในโฟลเดอร์โฟโต้บุ๊ค: ' + folderPath);

            const imageUrls = imageFiles.map(f =>
                blm48Supabase.storage.from(PHOTOBOOK_BUCKET).getPublicUrl(folderPath + '/' + f.name).data.publicUrl);

            await buildFlipbookFromImages(imageUrls, viewerEl);
        } catch (err) {
            console.error('flipbook load error:', err);
            showFlipbookError(viewerEl);
        }
    }

    async function buildFlipbookFromImages(imageUrls, viewerEl) {
        // วัดสัดส่วนจากรูปหน้าแรก แล้วคำนวณขนาดหนังสือให้พอดีพื้นที่แสดงผล
        const naturalSize = await new Promise((resolve, reject) => {
            const probe = new Image();
            probe.onload = () => resolve({ w: probe.naturalWidth, h: probe.naturalHeight });
            probe.onerror = () => reject(new Error('โหลดรูปหน้าแรกไม่สำเร็จ'));
            probe.src = imageUrls[0];
        });

        // จอมือถือ (แคบกว่า 768px) แสดงหน้าเดียว ส่วนไอแพด/คอม (768px ขึ้นไป) แสดงกางกาง 2 หน้า
        const isSpreadMode = window.innerWidth >= 768;

        const availW = Math.max(viewerEl.clientWidth - 24, 200);
        const availH = Math.max(viewerEl.clientHeight - 24, 200);
        // โหมดกางกาง 2 หน้า: คำนวณ scale จากความกว้างของ "คู่หน้า" (natural.w * 2)
        const scale = Math.min(availW / (naturalSize.w * (isSpreadMode ? 2 : 1)), availH / naturalSize.h, 1) || 1;
        const displayW = Math.round(naturalSize.w * scale); // ขนาด 1 หน้าบนจอ
        const displayH = Math.round(naturalSize.h * scale);
        const sizerWidthMultiplier = isSpreadMode ? 2 : 1;

        // StPageFlip เซ็ตขนาด canvas ภายในเท่ากับขนาด CSS พอดี (ไม่คูณ devicePixelRatio)
        // บนจอ Retina/มือถือความละเอียดสูงเลยเบลอเพราะจอ upscale canvas ให้ใหญ่ขึ้นอีกที
        // แก้โดยสั่งให้ PageFlip เรนเดอร์ที่ความละเอียดสูงกว่าจริง (คูณ dpr) แล้วห่อด้วย
        // container ขนาดจริงบนจอ + transform:scale ย่อกลับ ให้ตำแหน่งคลิก/ทัชยังตรงเหมือนเดิม
        const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
        const renderW = Math.round(displayW * dpr);
        const renderH = Math.round(displayH * dpr);

        viewerEl.innerHTML = '';
        const sizer = document.createElement('div');
        // sizer กว้าง 1 เท่า (มือถือ) หรือ 2 เท่า (ไอแพด/คอม) ของ 1 หน้า ตาม isSpreadMode
        sizer.style.cssText = `width:${displayW * sizerWidthMultiplier}px; height:${displayH}px; position:relative; overflow:hidden;`;
        viewerEl.appendChild(sizer);

        const flipRoot = document.createElement('div');
        flipRoot.id = 'flipbookRoot';
        flipRoot.style.cssText = `position:absolute; top:0; left:0; transform: scale(${1 / dpr}); transform-origin: top left;`;
        sizer.appendChild(flipRoot);

        if (currentFlipBook) { currentFlipBook.destroy(); currentFlipBook = null; }

        currentFlipBook = new St.PageFlip(flipRoot, {
            width: renderW,
            height: renderH,
            size: 'fixed',
            showCover: false,
            maxShadowOpacity: 0.5,
            usePortrait: !isSpreadMode,
            mobileScrollSupport: false
        });
        currentFlipBook.loadFromImages(imageUrls);

        document.getElementById('epubPageIndicator').textContent = `1 / ${imageUrls.length}`;
        currentFlipBook.on('flip', (e) => {
            document.getElementById('epubPageIndicator').textContent = `${e.data + 1} / ${imageUrls.length}`;
        });
    }

    function closeEpubReader() {
        document.getElementById('epubReaderModal').classList.remove('active');
        blm48UnlockBodyScroll();
        if (currentFlipBook) { currentFlipBook.destroy(); currentFlipBook = null; }
        document.getElementById('epubViewer').innerHTML = '';
    }

    function epubNext() { if (currentFlipBook) currentFlipBook.flipNext(); }
    function epubPrev() { if (currentFlipBook) currentFlipBook.flipPrev(); }

    document.addEventListener('keydown', (e) => {
        if (!document.getElementById('epubReaderModal').classList.contains('active')) return;
        if (e.key === 'ArrowRight') epubNext();
        if (e.key === 'ArrowLeft') epubPrev();
        if (e.key === 'Escape') closeEpubReader();
    });
</script>
</body>
</html>
