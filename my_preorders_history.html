<!DOCTYPE html>
<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>BLM48 Membership | รายการที่จัดส่งแล้ว</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffc0cb">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s192">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>

    <style>
        :root {
            --primary-pink: #ff85a2;
            --text-dark: #444;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Quicksand', 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: var(--text-dark);
            background: #ffffff;
        }
        .top-navigation-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(var(--glass-blur-lg));
            backdrop-filter: blur(var(--glass-blur-lg));
            padding: 14px 16px;
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--glass-shadow-sm);
        }
        .back-circle-btn {
            flex: 0 0 auto;
            background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(var(--glass-blur-sm));
            backdrop-filter: blur(var(--glass-blur-sm));
            border: 1px solid var(--glass-border);
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary-pink); cursor: pointer; transition: 0.2s;
        }
        .back-circle-btn:hover { background: var(--primary-pink); color: white; transform: scale(1.05); }
        .top-bar-title { font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 16px; color: #333; }

        .page-wrapper { max-width: 640px; margin: 0 auto; padding: 18px 16px 50px; }
        @media (min-width: 768px) { .page-wrapper { max-width: 760px; padding: 24px 24px 60px; } }
        @media (min-width: 1024px) { .page-wrapper { max-width: 900px; padding: 32px 32px 70px; } }

        .header-title-zone { text-align: center; margin-bottom: 20px; }
        .header-title-zone h1 {
            color: var(--primary-pink);
            font-family: 'Kanit', sans-serif;
            font-size: 22px;
            margin: 0 0 6px 0;
            font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .header-title-zone p { color: #999; font-size: 13px; margin: 0; }

        .order-history-list { display: flex; flex-direction: column; gap: 14px; }
        .order-history-card {
            background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(var(--glass-blur));
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 16px 16px;
            box-shadow: var(--glass-shadow-sm);
        }
        .order-history-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px dashed #f2dbe0;
        }
        .order-history-shop {
            display: flex; align-items: center; gap: 8px;
            font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 13.5px; color: #333;
        }
        .order-history-shop i { color: var(--primary-pink); }
        .order-history-status {
            font-size: 11.5px;
            font-weight: 700;
            color: #2e9e5b;
            display: flex; align-items: center; gap: 5px;
            flex-shrink: 0;
        }

        .order-history-item-row {
            display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
        }
        .order-history-item-row:last-of-type { margin-bottom: 12px; }
        .order-history-thumb {
            width: 56px; height: 56px; border-radius: 12px; object-fit: cover;
            background: #fdf7f8; flex-shrink: 0;
        }
        .order-history-item-icon {
            width: 56px; height: 56px; border-radius: 12px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: #ffe4e1; color: var(--primary-pink); font-size: 20px;
        }
        .order-history-item-info { flex: 1; min-width: 0; }
        .order-history-item-name {
            font-size: 13.5px; color: #333; font-weight: 600;
            overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .order-history-item-qty { font-size: 12px; color: #999; margin-top: 2px; }

        .order-history-summary {
            display: flex; align-items: center; justify-content: flex-end; gap: 6px;
            font-size: 12.5px; color: #777;
            padding-top: 10px; border-top: 1px dashed #f2dbe0;
        }
        .order-history-summary b { color: var(--primary-pink); font-size: 14.5px; }

        .order-history-meta { font-size: 11.5px; color: #bbb; margin-top: 8px; text-align: right; }

        .history-back-link-row { display: flex; justify-content: center; margin: -8px 0 18px; }
        .history-back-link-btn {
            display: flex; align-items: center; gap: 6px;
            font-size: 12.5px; font-weight: 600; color: var(--primary-pink);
            background: #fff0f4; border: 1px solid #ffd7e1; border-radius: 999px;
            padding: 7px 16px; text-decoration: none; transition: 0.2s;
        }
        .history-back-link-btn:hover { background: var(--primary-pink); color: #fff; }

        .empty-state { text-align: center; color: #bbb; font-family: 'Kanit', sans-serif; font-size: 13px; padding: 60px 20px; }
        .empty-state i { font-size: 30px; color: #ffd7e1; display: block; margin-bottom: 10px; }
        .loading-state { text-align: center; color: #bbb; font-size: 13px; padding: 40px 20px; }
    </style>
</head>
<body>

<div class="top-navigation-bar">
    <button type="button" class="back-circle-btn" onclick="goBack()" aria-label="ย้อนกลับ">
        <i class="fa-solid fa-chevron-left"></i>
    </button>
    <div class="top-bar-title">Order History</div>
</div>

<div class="page-wrapper">
    <div class="header-title-zone">
        <h1><i class="fa-solid fa-clipboard-check"></i> รายการที่จัดส่งแล้ว</h1>
        <p>พรีออเดอร์ทั้งหมดที่ได้รับสินค้าเรียบร้อยแล้ว</p>
    </div>

    <div class="history-back-link-row">
        <a href="my_preorders" class="history-back-link-btn"><i class="fa-solid fa-hourglass-half"></i> รายการที่รอจัดส่ง</a>
    </div>

    <div id="orders-list">
        <div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> Loading data...</div>
    </div>
</div>

<script>
  let user = null;

  function goBack() {
    if (document.referrer && window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = 'my_preorders';
    }
  }

  function renderOrders(orders) {
    const list = document.getElementById('orders-list');
    const shippedOrders = (orders || []).filter(o => o.status === 'shipped');

    if (shippedOrders.length === 0) {
      list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-box-open"></i>ยังไม่มีรายการที่จัดส่งแล้วค่ะ</div>`;
      return;
    }

    list.innerHTML = shippedOrders.map(o => {
      const dt = o.createdAt ? new Date(o.createdAt).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
      const shippedDt = o.shippedAt ? new Date(o.shippedAt).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
      const itemCount = (o.items || []).length;

      const itemsHTML = (o.items || []).map(it => {
        if (it.kind === 'ge_token') {
          return `
            <div class="order-history-item-row">
                <div class="order-history-item-icon"><i class="fas fa-gem"></i></div>
                <div class="order-history-item-info">
                    <div class="order-history-item-name">${escapeHtml(it.label)}</div>
                    <div class="order-history-item-qty">+${Number(it.amount).toLocaleString()}</div>
                </div>
            </div>`;
        }
        const thumb = it.imageUrl
          ? `<img class="order-history-thumb" src="${it.imageUrl}" onerror="this.outerHTML='<div class=\\'order-history-item-icon\\'><i class=\\'fas fa-image\\'></i></div>'">`
          : `<div class="order-history-item-icon"><i class="fas fa-image"></i></div>`;
        return `
            <div class="order-history-item-row">
                ${thumb}
                <div class="order-history-item-info">
                    <div class="order-history-item-name">${escapeHtml(it.label)}</div>
                    <div class="order-history-item-qty">x1</div>
                </div>
            </div>`;
      }).join('');

      return `
        <div class="order-history-card">
            <div class="order-history-head">
                <div class="order-history-shop"><i class="fa-solid fa-box"></i> ${escapeHtml(o.productName)} x${o.quantity}</div>
                <div class="order-history-status"><i class="fa-solid fa-circle-check"></i> สำเร็จ</div>
            </div>
            ${itemsHTML}
            <div class="order-history-summary">สินค้ารวม ${itemCount} รายการ: <b>${Number(o.totalCostTokens).toLocaleString()} Tokens</b></div>
            <div class="order-history-meta">สั่งซื้อ ${dt} · จัดส่งแล้ว ${shippedDt}</div>
        </div>`;
    }).join('');
  }

  async function loadOrders() {
    const list = document.getElementById('orders-list');
    try {
      const res = await blm48GetMyPreorderOrders(user.username);
      if (res.status !== 'success') {
        list.innerHTML = `<div class="empty-state">โหลดข้อมูลไม่สำเร็จค่ะ</div>`;
        return;
      }
      renderOrders(res.data || []);
    } catch (e) {
      list.innerHTML = `<div class="empty-state">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</div>`;
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    user = getUserSession();
    if (!user) {
      window.location.href = 'login';
      return;
    }
    loadOrders();
  });
</script>
</body>
</html>
