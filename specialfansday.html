<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLM48 Membership | Special Fans Day</title>
    <link class="brand-favicon" rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffc0cb">

    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s192">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>

    <style>
        :root {
            --blm-pink: #ff85a2;
            --blm-light-pink: #fff0f5;
            --blm-yellow: #ffc107;
            --text-dark: #4a4a4a;
            --text-muted: #9e9e9e;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Quicksand', 'Kanit', sans-serif;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        /* 📡 Top Navbar (เหมือน champ.html) */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(var(--glass-blur-lg));
            -webkit-backdrop-filter: blur(var(--glass-blur-lg));
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 2px 10px rgba(255, 133, 162, 0.06);
            z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
        }
        .nav-back-btn {
            color: var(--blm-pink); font-size: 1.1rem; text-decoration: none;
            width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: var(--blm-light-pink);
        }
        .nav-title { font-weight: 600; font-size: 1.2rem; color: var(--blm-pink); letter-spacing: 0.5px; }
        .nav-spacer { width: 35px; }

        .main-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 78px 12px 40px 12px;
        }

        .sfd-timeline { margin: 4px 0 20px; }

        /* 👑 ปุ่ม Champ of the Month -> champ.html */
        .champ-month-btn {
            display: flex; align-items: center; gap: 14px;
            background: #fff;
            border: 1px solid #f1f1f1;
            border-radius: 18px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            text-decoration: none;
            color: var(--text-dark);
            margin-bottom: 16px;
        }
        .champ-month-icon {
            width: 84px; height: 64px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #ffe9a8, #fff6d6);
            border-radius: 0 40px 40px 0;
            color: #f5a623; font-size: 28px;
        }
        .champ-month-text { flex: 1; font-size: 17px; font-weight: 700; }
        .champ-month-btn .fa-chevron-right { color: #555; margin-right: 18px; }

        /* 🥇 การ์ดอันดับ 1 */
        .top1-card {
            position: relative;
            background: #fff;
            border: 1px solid #f1f1f1;
            border-radius: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            padding: 26px 16px 22px;
            text-align: center;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .top1-decor { position: absolute; inset: 0; pointer-events: none; }
        .top1-decor i { position: absolute; opacity: 0.85; }
        .top1-avatar-wrap { position: relative; width: 104px; height: 104px; margin: 0 auto; }
        .top1-avatar {
            width: 104px; height: 104px; border-radius: 50%; object-fit: cover;
            border: 3px solid #ffde5b; background: #fff;
        }
        .top1-crown {
            position: absolute; right: -2px; bottom: 2px;
            width: 30px; height: 30px; border-radius: 50%;
            background: #fff; display: flex; align-items: center; justify-content: center;
            color: #f5a623; font-size: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        .top1-name { margin-top: 12px; font-size: 20px; font-weight: 600; position: relative; }
        .top1-cookie { margin-top: 4px; font-size: 22px; font-weight: 700; color: #666; position: relative; }
        .top1-card .send-cookie-btn { margin-top: 14px; padding: 9px 34px; font-size: 15px; position: relative; }

        /* 📋 อันดับ 2 เป็นต้นไป */
        .rank-row {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 6px;
        }
        .rank-col { width: 34px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .rank-num {
            width: 26px; height: 26px; border-radius: 50%;
            border: 1.5px solid #444; color: #333;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
        }
        .rank-medal { font-size: 18px; }
        .rank-change { font-size: 12px; }
        .rank-avatar {
            width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
            border: 2px solid #ffde5b; background: #fff;
        }
        .rank-info { flex: 1; min-width: 0; }
        .rank-name { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rank-cookie { font-size: 16px; font-weight: 700; color: #777; margin-top: 2px; }
        .rank-cookie i, .top1-cookie i { color: #d2691e; margin-right: 4px; }

        .send-cookie-btn {
            flex-shrink: 0;
            background: var(--blm-yellow);
            color: #3a2a00;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .send-cookie-btn:active { transform: scale(0.95); }

        .state-msg { text-align: center; color: #999; padding: 30px 0; font-size: 14px; }
    </style>
</head>
<body class="glass-mesh-bg force-white-bg">

    <div class="top-navbar">
        <a href="index" class="nav-back-btn"><i class="fas fa-chevron-left"></i></a>
        <div class="nav-title">Special Fans Day</div>
        <div class="nav-spacer"></div>
    </div>

    <div class="main-container">
        <div class="sfd-timeline" id="sfd-timeline"></div>

        <a href="champ" class="champ-month-btn">
            <div class="champ-month-icon"><i class="fa-solid fa-trophy"></i></div>
            <div class="champ-month-text">Champ of the Month</div>
            <i class="fas fa-chevron-right"></i>
        </a>

        <div id="sfd-ranking"><div class="state-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div></div>
    </div>

    <script>
        const DEFAULT_AVATAR = 'https://lh3.googleusercontent.com/d/1rebp2F8vyP0nyvsEOFD9Nw2mPcRtVqtG=s1000';

        function getImg(url) {
            if (!url) return DEFAULT_AVATAR;
            if (url.includes('drive.google.com')) {
                const match = url.match(/[-\w]{25,}/);
                return match ? `https://lh3.googleusercontent.com/u/0/d/${match[0]}` : url;
            }
            return url;
        }

        // ลูกศรขึ้น/ลงอันดับ: อ่านค่าที่หน้า Home คำนวณไว้ล่าสุด (ไม่เขียนทับ ไม่งั้นหน้า Home จะเทียบอันดับเพี้ยน)
        function loadIndicatorMap() {
            try { return JSON.parse(localStorage.getItem('bnl_ranking_sticky_indicator') || '{}'); } catch (e) { return {}; }
        }

        // ส่งคุกกี้ = ไปหน้าเมมเบอร์คนนั้น (ปุ่มปาคุกกี้อยู่ที่นั่น)
        function sendCookieTo(name) {
            window.location.href = `member?name=${encodeURIComponent(name)}`;
        }

        function renderRanking(data) {
            const box = document.getElementById('sfd-ranking');
            const members = (Array.isArray(data) ? data : []).filter(m => {
                const name = m.name ? String(m.name).trim() : '';
                const status = m.status ? String(m.status).trim().toLowerCase() : '';
                return name && status !== 'graduated';
            });
            if (members.length === 0) {
                box.innerHTML = '<div class="state-msg">ยังไม่มีข้อมูลอันดับเดือนนี้</div>';
                return;
            }

            const indicators = loadIndicatorMap();
            const changeIcon = (name) => {
                const ind = indicators[name] || { icon: 'fa-equals', color: '#bbb' };
                return `<i class="fas ${ind.icon}" style="color: ${ind.color};"></i>`;
            };
            const cookies = (m) => Number(m.monthly_cookies || 0).toLocaleString();
            const nameJs = (m) => escapeHtml(JSON.stringify(String(m.name)));

            const top = members[0];
            const decor = [
                ['fa-crown', 8, 14, 22, '#ffd56b'], ['fa-crown', 78, 8, 20, '#ffd56b'], ['fa-crown', 20, 62, 24, '#ffd56b'],
                ['fa-crown', 84, 66, 22, '#ffd56b'], ['fa-heart', 30, 10, 12, '#ffb3c1'], ['fa-heart', 70, 40, 12, '#c9a7e8'],
                ['fa-star', 12, 40, 12, '#ffd56b'], ['fa-star', 90, 30, 11, '#ffb3c1'], ['fa-star', 60, 12, 10, '#c9a7e8']
            ].map(([ic, x, y, s, c]) => `<i class="fa-solid ${ic}" style="left:${x}%;top:${y}%;font-size:${s}px;color:${c};"></i>`).join('');

            let html = `
                <div class="top1-card">
                    <div class="top1-decor">${decor}</div>
                    <div class="top1-avatar-wrap"${memberLinkAttr(top.name)}>
                        <img class="top1-avatar" src="${getImg(top.profile_img)}" onerror="this.src='${DEFAULT_AVATAR}'" alt="${escapeHtml(top.name)}">
                        <div class="top1-crown"><i class="fas fa-crown"></i></div>
                    </div>
                    <div class="top1-name"${memberLinkAttr(top.name)}>${escapeHtml(top.name)}</div>
                    <div class="top1-cookie">${changeIcon(top.name)} <i class="fas fa-cookie-bite"></i>${cookies(top)}</div>
                    <button class="send-cookie-btn" onclick="sendCookieTo(${nameJs(top)})">Send Cookie</button>
                </div>
            `;

            members.slice(1).forEach((m, idx) => {
                const rank = idx + 2;
                const badge = rank === 2 ? '<i class="fas fa-crown rank-medal" style="color:#c0c0c0;"></i>'
                            : rank === 3 ? '<i class="fas fa-crown rank-medal" style="color:#cd7f32;"></i>'
                            : `<div class="rank-num">${rank}</div>`;
                html += `
                    <div class="rank-row">
                        <div class="rank-col">${badge}<span class="rank-change">${changeIcon(m.name)}</span></div>
                        <img class="rank-avatar"${memberLinkAttr(m.name)} src="${getImg(m.profile_img)}" onerror="this.src='${DEFAULT_AVATAR}'" loading="lazy" alt="${escapeHtml(m.name)}">
                        <div class="rank-info"${memberLinkAttr(m.name)}>
                            <div class="rank-name">${escapeHtml(m.name)}</div>
                            <div class="rank-cookie"><i class="fas fa-cookie-bite"></i>${cookies(m)}</div>
                        </div>
                        <button class="send-cookie-btn" onclick="sendCookieTo(${nameJs(m)})">Send Cookie</button>
                    </div>
                `;
            });
            box.innerHTML = html;
        }

        async function loadRanking() {
            try {
                const data = await blm48GetRankingFull(); // เดือนปัจจุบัน (Asia/Bangkok) เหมือน Member Ranking หน้า Home
                if (Array.isArray(data)) {
                    localStorage.setItem('bnl_ranking_cache', JSON.stringify(data));
                    renderRanking(data);
                }
            } catch (e) {
                console.error('Special Fans Day ranking error:', e);
                if (!document.querySelector('.top1-card')) {
                    document.getElementById('sfd-ranking').innerHTML = '<div class="state-msg">โหลดอันดับไม่สำเร็จ ลองใหม่อีกครั้งนะคะ</div>';
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('sfd-timeline').innerHTML = buildSpecialFansDaysHtml();

            // โชว์จากแคชของหน้า Home ก่อนทันที แล้วค่อยดึงสด
            try {
                const cached = JSON.parse(localStorage.getItem('bnl_ranking_cache') || '[]');
                if (Array.isArray(cached) && cached.length) renderRanking(cached);
            } catch (e) {}
            loadRanking();

            // 🔴 Realtime: มีคนปาคุกกี้ -> อัปเดตอันดับทันที
            if (typeof blm48SubscribeRanking === 'function') blm48SubscribeRanking(loadRanking);
        });
    </script>
</body>
</html>
