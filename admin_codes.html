<!DOCTYPE html>
<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
        <script src="assets/js/back-nav.js"></script>
<title>BLM48 Membership | จัดการโค้ด Redeem</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffc0cb">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s192">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>

    <style>
        :root {
            --primary-pink: #ff85a2;
            --soft-pink: #ffe4e1;
            --card-border: #ffeef2;
            --text-dark: #444;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Quicksand', 'Kanit', sans-serif; margin: 0; padding: 0; min-height: 100vh; color: var(--text-dark); background: #ffffff; }

        .top-navigation-bar {
            display: flex; align-items: center; gap: 12px;
            background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(var(--glass-blur-lg));
            backdrop-filter: blur(var(--glass-blur-lg));
            padding: 14px 16px; border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100; box-shadow: var(--glass-shadow-sm);
        }
        .back-circle-btn {
            flex: 0 0 auto; background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(var(--glass-blur-sm));
            backdrop-filter: blur(var(--glass-blur-sm));
            border: 1px solid var(--glass-border);
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary-pink); cursor: pointer; transition: 0.2s;
        }
        .back-circle-btn:hover { background: var(--primary-pink); color: white; transform: scale(1.05); }
        .top-bar-title { font-family: 'Quicksand', 'Kanit', sans-serif; font-weight: 600; font-size: 16px; color: #333; }

        .page-wrapper { max-width: 640px; margin: 0 auto; padding: 18px 12px 50px; }
        @media (min-width: 768px) { .page-wrapper { max-width: 760px; padding: 24px 24px 60px; } }

        .header-title-zone { text-align: center; margin-bottom: 20px; }
        .header-title-zone h1 { color: var(--primary-pink); font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 24px; margin: 0 0 6px 0; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header-title-zone p { color: #767676; font-size: 13px; margin: 0; }

        .btn-toggle-create {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; border: none; border-radius: 20px; padding: 12px;
            background: var(--soft-pink); color: var(--primary-pink); font-weight: 700; font-size: 13.5px;
            font-family: 'Quicksand', 'Kanit', sans-serif; cursor: pointer; margin-bottom: 16px;
        }

        .form-card {
            display: none;
            background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(var(--glass-blur));
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 18px 16px; box-shadow: var(--glass-shadow-sm);
            margin-bottom: 18px;
        }
        .form-card.show { display: block; }
        .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .form-field label { font-size: 13px; color: #666; font-weight: 600; }
        .form-field input, .form-field select {
            border: 1px solid var(--glass-border); border-radius: 12px;
            padding: 11px 14px; font-size: 14px; font-family: 'Quicksand', 'Kanit', sans-serif;
            color: var(--text-dark); background: rgba(255, 255, 255, 0.7);
        }
        .form-field input:focus, .form-field select:focus { outline: none; border-color: var(--primary-pink); }
        .form-msg { border-radius: 12px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 14px; display: none; }
        .form-msg.error { background: #ffeef0; color: #c43d58; display: block; }

        .reward-card { border: 1px solid var(--glass-border); border-radius: 14px; padding: 10px; margin-bottom: 10px; background: rgba(255,255,255,0.5); }
        .reward-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
        .reward-row select { flex: 1 1 100%; margin: 0; }
        .reward-row input { width: 100px; flex: 0 0 auto; margin: 0; }
        .reward-row button { background: none; border: none; color: #ff5c7a; font-size: 17px; cursor: pointer; flex: 0 0 auto; margin-left: auto; }
        .reward-role-toggle-label { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #767676; flex: 0 0 auto; white-space: nowrap; }
        .reward-amount-both input { width: 100%; }
        .reward-amount-split { display: none; gap: 8px; }
        .reward-amount-split.show { display: flex; }
        .reward-amount-both.hide { display: none; }
        .reward-amount-split-item { flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .reward-amount-split-item span { font-size: 10.5px; color: #767676; font-weight: 600; }
        .reward-amount-split-item input { width: 100%; margin: 0; }
        .btn-add-reward {
            background: none; border: 1px dashed var(--primary-pink); color: var(--primary-pink);
            border-radius: 20px; padding: 8px 16px; cursor: pointer; font-size: 13px; font-family: 'Quicksand', 'Kanit', sans-serif;
            margin-bottom: 4px;
        }

        .btn-primary {
            width: 100%; border: none; border-radius: 20px; padding: 13px; margin-top: 6px;
            background: var(--primary-pink); color: #fff; font-weight: 700; font-size: 14px;
            font-family: 'Quicksand', 'Kanit', sans-serif; cursor: pointer;
        }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .code-list { display: flex; flex-direction: column; gap: 10px; }
        .code-row {
            display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
            background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(var(--glass-blur));
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 12px 14px;
            box-shadow: var(--glass-shadow-sm);
        }
        .code-row .c-name { font-weight: 700; font-size: 14px; color: #333; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .code-row.dim .c-name, .code-row.dim .c-rewards { opacity: .55; }
        .code-main { flex: 1; min-width: 0; }
        .c-status { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
        .c-status.on { background: #e6f9ee; color: #1f7a45; }
        .c-status.exp { background: #f1f1f1; color: #666; }
        .c-status.full { background: #fff3c4; color: #7a5a00; }
        .c-bar { height: 5px; border-radius: 4px; background: #f1f1f1; margin-top: 6px; overflow: hidden; max-width: 260px; }
        .c-bar span { display: block; height: 100%; background: #ffc107; }
        .c-btns { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-copy { flex: 0 0 auto; border: 1px solid #eee; border-radius: 20px; font-size: 12px; font-weight: 600; padding: 7px 12px; cursor: pointer; background: #fff; color: #444; font-family: inherit; }
        .del-box { width: 100%; margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: #fff4f6; color: #c43d58; font-size: 12.5px; }
        .del-box .row { display: flex; gap: 8px; margin-top: 8px; }
        .del-box button { border: none; border-radius: 20px; padding: 7px 14px; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
        .del-box .go { background: #d63355; color: #fff; }
        .del-box .no { background: #fff; color: #555; border: 1px solid #ddd; }
        .code-input-row { display: flex; gap: 8px; }
        .code-input-row input { flex: 1; min-width: 0; }
        .btn-side { flex-shrink: 0; border: 1px solid #eee; background: #fff; border-radius: 12px; padding: 0 12px; font-family: inherit; font-size: 12.5px; font-weight: 700; color: #555; cursor: pointer; white-space: nowrap; }
        .toast-msg { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #222; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; z-index: 300; display: none; max-width: 90vw; }
        .code-row .c-rewards { font-size: 12px; color: #666; margin-top: 2px; }
        .code-row .c-meta { font-size: 11px; color: #767676; margin-top: 4px; }
        .btn-pill { flex: 0 0 auto; border: none; border-radius: 20px; font-size: 12px; font-weight: 600; padding: 8px 14px; cursor: pointer; background: #ffeef0; color: #c43d58; }

        .empty-state { text-align: center; color: #767676; font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 13px; padding: 40px 20px; }
        .empty-state i { font-size: 28px; color: #ffd7e1; display: block; margin-bottom: 10px; }
        .loading-state { text-align: center; color: #767676; font-size: 13px; padding: 30px 20px; }

        #access-denied { display: none; text-align: center; padding: 80px 20px; color: #767676; }
        #access-denied i { font-size: 40px; color: #ffd7e1; display: block; margin-bottom: 14px; }
        #page-content { display: none; }
    </style>
    <link rel="stylesheet" href="assets/css/admin-theme.css">
</head>
<body>

<div class="top-navigation-bar">
    <button type="button" class="back-circle-btn" onclick="goBack()" aria-label="ย้อนกลับ">
        <i class="fa-solid fa-chevron-left"></i>
    </button>
    <div class="top-bar-title">จัดการโค้ด Redeem</div>
</div>

<div class="page-wrapper">
    <div id="access-denied">
        <i class="fa-solid fa-lock"></i>
        หน้านี้สำหรับ Role Admin เท่านั้นค่ะ
    </div>

    <div id="page-content">
        <div class="header-title-zone">
            <h1><i class="fa-solid fa-ticket"></i> จัดการโค้ด Redeem</h1>
            <p>สร้างและจัดการโค้ดสำหรับแลกรางวัลในระบบ</p>
        </div>

        <button class="btn-toggle-create" id="toggle-create-btn" onclick="toggleCreateForm()">
            <i class="fas fa-plus"></i> สร้างโค้ดใหม่
        </button>

        <div class="form-card" id="create-form">
            <div id="form-msg" class="form-msg"></div>

            <div class="form-field">
                <label>รหัสโค้ด (Code)</label>
                <div class="code-input-row">
                    <input id="code-code" type="text" style="text-transform:uppercase;" placeholder="เช่น WELCOME2026" autocomplete="off">
                    <button type="button" class="btn-side" onclick="randomCode()"><i class="fa-solid fa-shuffle"></i> สุ่ม</button>
                </div>
            </div>
            <div class="form-field">
                <label>วันหมดอายุ (เว้นว่าง = ไม่มีวันหมดอายุ)</label>
                <input id="code-expiry" type="datetime-local">
            </div>
            <div class="form-field">
                <label>จำนวนสิทธิ์ใช้ได้สูงสุด (เว้นว่าง = ไม่จำกัด)</label>
                <input id="code-maxlimit" type="number" min="1" placeholder="999999">
            </div>
            <div class="form-field">
                <label>รางวัลที่จะได้รับ (เพิ่มได้หลายชนิด)</label>
                <div id="code-rewards"></div>
                <button type="button" class="btn-add-reward" onclick="addRewardRow()"><i class="fas fa-plus"></i> เพิ่มรางวัล</button>
            </div>

            <button class="btn-primary" id="create-code-btn" onclick="submitCreateCode()">
                <i class="fas fa-check"></i> สร้างโค้ด
            </button>
        </div>

        <input id="search" class="adm-search" type="search" placeholder="ค้นหาโค้ด..." oninput="renderCodeList()" style="margin-top:14px">
        <div class="adm-chips" id="chips"></div>
        <div class="code-list" id="code-list">
            <div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดข้อมูล...</div>
        </div>
    </div>
</div>

<script>
  let user = null;
  let codeCache = [];
  const REWARD_LABELS = { token: 'Token', cookie: 'Cookie', getoken: 'GE Token', legacy: 'Legacy (ที่ระลึก)' };

  function goBack() {
    blm48Back('admin');
  }

  function showFormError(msg) {
    const el = document.getElementById('form-msg');
    el.textContent = msg;
    el.classList.add('error');
  }
  function clearFormError() {
    const el = document.getElementById('form-msg');
    el.textContent = '';
    el.classList.remove('error');
  }

  function toggleCreateForm(forceOpen) {
    const form = document.getElementById('create-form');
    const shouldShow = forceOpen !== undefined ? forceOpen : !form.classList.contains('show');
    form.classList.toggle('show', shouldShow);
    if (shouldShow && document.getElementById('code-rewards').children.length === 0) {
      addRewardRow('token', 0);
    }
  }

  function addRewardRow(type, amount, roleSplit, userAmount, memberAmount) {
    const container = document.getElementById('code-rewards');
    const card = document.createElement('div');
    card.className = 'reward-card';
    card.innerHTML = `
      <div class="reward-row">
        <select class="reward-type">
          <option value="token">Token</option>
          <option value="cookie">Cookie</option>
          <option value="getoken">GE Token</option>
          <option value="legacy">Legacy (ที่ระลึก ไม่แจกกระเป๋าเงิน)</option>
        </select>
        <label class="reward-role-toggle-label">
          <input type="checkbox" class="reward-role-toggle" onchange="toggleRewardRoleMode(this)"> แยกค่าตาม Role
        </label>
        <button type="button" onclick="this.closest('.reward-card').remove()"><i class="fas fa-trash"></i></button>
      </div>
      <div class="reward-amount-both">
        <input type="number" class="reward-amount" min="0" value="0" placeholder="จำนวน (User และ Member เท่ากัน)">
      </div>
      <div class="reward-amount-split">
        <div class="reward-amount-split-item">
          <span>User ได้รับ</span>
          <input type="number" class="reward-amount-user" min="0" value="0">
        </div>
        <div class="reward-amount-split-item">
          <span>Member ได้รับ</span>
          <input type="number" class="reward-amount-member" min="0" value="0">
        </div>
      </div>
    `;
    container.appendChild(card);
    if (type) card.querySelector('.reward-type').value = type;
    if (amount !== undefined) card.querySelector('.reward-amount').value = amount;
    if (roleSplit) {
      card.querySelector('.reward-role-toggle').checked = true;
      if (userAmount !== undefined) card.querySelector('.reward-amount-user').value = userAmount;
      if (memberAmount !== undefined) card.querySelector('.reward-amount-member').value = memberAmount;
      toggleRewardRoleMode(card.querySelector('.reward-role-toggle'));
    }
  }

  function toggleRewardRoleMode(checkbox) {
    const card = checkbox.closest('.reward-card');
    const isSplit = checkbox.checked;
    card.querySelector('.reward-amount-both').classList.toggle('hide', isSplit);
    card.querySelector('.reward-amount-split').classList.toggle('show', isSplit);
  }

  async function submitCreateCode() {
    clearFormError();
    const code = document.getElementById('code-code').value.trim().toUpperCase();
    const expiryRaw = document.getElementById('code-expiry').value;
    const maxLimitRaw = document.getElementById('code-maxlimit').value;

    if (!code) { showFormError('กรุณากรอกรหัสโค้ด'); return; }

    const cards = document.querySelectorAll('#code-rewards .reward-card');
    if (cards.length === 0) { showFormError('กรุณาเพิ่มรางวัลอย่างน้อย 1 รายการ'); return; }
    const rewards = [];
    const seenTypes = new Set();
    for (const card of cards) {
      const type = card.querySelector('.reward-type').value;
      if (seenTypes.has(type)) { showFormError('เลือกรางวัลชนิดเดียวกันซ้ำกันไม่ได้ค่ะ'); return; }
      seenTypes.add(type);

      const isSplit = card.querySelector('.reward-role-toggle').checked;
      if (isSplit) {
        const userAmount = parseFloat(card.querySelector('.reward-amount-user').value) || 0;
        const memberAmount = parseFloat(card.querySelector('.reward-amount-member').value) || 0;
        if (type !== 'legacy' && userAmount <= 0 && memberAmount <= 0) { showFormError('กรุณากรอกจำนวนรางวัลอย่างน้อย 1 Role ให้มากกว่า 0'); return; }
        rewards.push({ type, amount: userAmount, role: 'user' });
        rewards.push({ type, amount: memberAmount, role: 'member' });
      } else {
        const amount = parseFloat(card.querySelector('.reward-amount').value) || 0;
        if (type !== 'legacy' && amount <= 0) { showFormError('กรุณากรอกจำนวนรางวัลให้มากกว่า 0'); return; }
        rewards.push({ type, amount });
      }
    }

    const expiryTime = expiryRaw ? new Date(expiryRaw).toISOString() : null;
    const maxLimit = maxLimitRaw ? parseInt(maxLimitRaw, 10) : null;

    const btn = document.getElementById('create-code-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังสร้างโค้ด...';
    try {
      const res = await blm48AdminCreateCode(user.username, code, expiryTime, maxLimit, rewards);
      if (res.status === 'success') {
        toast(`สร้างโค้ด ${code} แล้ว`);
        document.getElementById('code-code').value = '';
        document.getElementById('code-expiry').value = '';
        document.getElementById('code-maxlimit').value = '';
        document.getElementById('code-rewards').innerHTML = '';
        addRewardRow('token', 0);
        toggleCreateForm(false);
        loadCodeList();
      } else {
        showFormError(res.message || 'ไม่สามารถสร้างโค้ดได้');
      }
    } catch (e) {
      showFormError('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่อีกครั้งในภายหลัง');
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check"></i> สร้างโค้ด';
  }

  async function loadCodeList() {
    const list = document.getElementById('code-list');
    try {
      const res = await blm48AdminListCodes(user.username);
      if (res.status !== 'success') { list.innerHTML = `<div class="empty-state">โหลดข้อมูลไม่สำเร็จ</div>`; return; }
      codeCache = res.data || [];
      renderCodeList();
    } catch (e) {
      list.innerHTML = `<div class="empty-state">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</div>`;
    }
  }

  function toast(msg) {
    let t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast-msg'; document.body.appendChild(t); }
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 2400);
  }

  // สุ่มโค้ด 8 ตัว (ไม่มี 0/O/1/I ที่อ่านสับสน)
  function randomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const buf = new Uint32Array(8);
    crypto.getRandomValues(buf);
    document.getElementById('code-code').value = Array.from(buf, n => chars[n % chars.length]).join('');
  }

  // สถานะโค้ด: ใช้ได้ / หมดอายุ / สิทธิ์เต็ม
  const UNLIMITED = 999999;
  function codeStatus(c) {
    if (c.expiryTime && new Date(c.expiryTime) < new Date()) return 'exp';
    const max = Number(c.maxLimit) || UNLIMITED;
    if (max < UNLIMITED && (c.usedCount || 0) >= max) return 'full';
    return 'on';
  }
  const FILTERS = [['all', 'ทั้งหมด'], ['on', 'ใช้ได้'], ['exp', 'หมดอายุ'], ['full', 'สิทธิ์เต็ม']];
  let filterKey = 'all';
  try { filterKey = sessionStorage.getItem('adminCodesFilter') || 'all'; } catch (e) {}
  if (!FILTERS.some(([k]) => k === filterKey)) filterKey = 'all';
  let deleteAsk = null; // โค้ดที่กำลังถามยืนยันลบ

  function setFilter(k) {
    filterKey = k;
    try { sessionStorage.setItem('adminCodesFilter', k); } catch (e) {}
    renderCodeList();
  }

  function renderCodeList() {
    const list = document.getElementById('code-list');
    if (codeCache.length === 0) {
      document.getElementById('chips').innerHTML = '';
      list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-ticket"></i>ยังไม่มีโค้ดในระบบ</div>`;
      return;
    }
    const q = document.getElementById('search').value.trim().toUpperCase();
    const found = codeCache.filter(c => !q || String(c.code).toUpperCase().includes(q));
    document.getElementById('chips').innerHTML = FILTERS.map(([k, label]) =>
      `<button type="button" class="adm-chip ${k === filterKey ? 'active' : ''}" onclick="setFilter('${k}')">${label}<span class="n">${found.filter(c => k === 'all' || codeStatus(c) === k).length}</span></button>`).join('');
    const rows = found.filter(c => filterKey === 'all' || codeStatus(c) === filterKey);
    if (!rows.length) { list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-magnifying-glass"></i>ไม่พบโค้ด</div>`; return; }
    list.innerHTML = rows.map(c => {
      const st = codeStatus(c);
      const expiryText = c.expiryTime ? 'หมดอายุ ' + new Date(c.expiryTime).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' }) : 'ไม่มีวันหมดอายุ';
      const rewardsText = (c.rewards || []).map(r => {
        const label = `${Number(r.amount).toLocaleString()} ${REWARD_LABELS[r.type] || r.type}`;
        if (!r.role) return label;
        return `${label} (${r.role === 'user' ? 'User' : 'Member'})`;
      }).join(' + ') || '-';
      const used = c.usedCount || 0;
      const max = Number(c.maxLimit) || UNLIMITED;
      const limited = max < UNLIMITED;
      const canDelete = used === 0;
      const code = escapeAttr(c.code);
      return `
        <div class="code-row ${st === 'on' ? '' : 'dim'}" style="flex-wrap:wrap">
          <div class="code-main">
            <div class="c-name">${escapeHtml(c.code)} <span class="c-status ${st}">${st === 'on' ? 'ใช้ได้' : st === 'exp' ? 'หมดอายุ' : 'สิทธิ์เต็ม'}</span></div>
            <div class="c-rewards">${escapeHtml(rewardsText)}</div>
            <div class="c-meta">ใช้ไปแล้ว ${used.toLocaleString()}${limited ? ` / ${max.toLocaleString()}` : ' (ไม่จำกัดสิทธิ์)'} · ${escapeHtml(expiryText)}</div>
            ${limited ? `<div class="c-bar"><span style="width:${Math.min(100, used / max * 100)}%"></span></div>` : ''}
          </div>
          <div class="c-btns">
            <button class="btn-copy" onclick="copyCode('${code}', this)"><i class="fa-regular fa-copy"></i></button>
            ${canDelete && deleteAsk !== c.code ? `<button class="btn-pill" onclick="askDelete('${code}')" aria-label="ลบ"><i class="fas fa-trash"></i></button>` : ''}
          </div>
          ${deleteAsk === c.code ? `
            <div class="del-box">ลบโค้ด <b>${escapeHtml(c.code)}</b> ออกจากระบบถาวร?
              <div class="row">
                <button class="go" id="del-go" onclick="deleteCode('${code}')"><i class="fas fa-trash"></i> ยืนยันลบ</button>
                <button class="no" onclick="askDelete(null)">ยกเลิก</button>
              </div>
            </div>` : ''}
        </div>
      `;
    }).join('');
  }

  async function copyCode(code, btn) {
    try { await navigator.clipboard.writeText(code); btn.innerHTML = '<i class="fa-solid fa-check"></i>'; }
    catch (e) { btn.innerHTML = '<i class="fa-solid fa-xmark"></i>'; }
    setTimeout(() => { btn.innerHTML = '<i class="fa-regular fa-copy"></i>'; }, 1500);
  }

  function askDelete(code) { deleteAsk = code; renderCodeList(); }

  async function deleteCode(code) {
    const btn = document.getElementById('del-go');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังลบ...'; }
    try {
      const res = await blm48AdminDeleteCode(user.username, code);
      toast(res.status === 'success' ? `ลบโค้ด ${code} แล้ว` : (res.message || 'ไม่สามารถลบได้'));
    } catch (e) {
      toast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง');
    }
    deleteAsk = null;
    loadCodeList();
  }

  window.addEventListener('DOMContentLoaded', () => {
    user = getUserSession();
    if (!user) {
      window.location.href = 'login';
      return;
    }
    if (!(user.is_admin === true || (user.role && user.role.toLowerCase() === 'admin'))) {
      document.getElementById('access-denied').style.display = 'block';
      return;
    }
    document.getElementById('page-content').style.display = 'block';
    loadCodeList();
  });
</script>
</body>
</html>
