<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
        <script src="assets/js/back-nav.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLM48 Membership | View special thanks</title>
    <link class="brand-favicon" rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffc0cb">
    
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s192">
    <meta name="apple-mobile-web-app-title" content="BLM48">   
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>

    <style>
        :root {
            --blm-pink: #ff85a2;
            --blm-light-pink: #fff0f5;
            --text-dark: #4a4a4a;
            --text-muted: #9e9e9e;
            --glass-card: rgba(255, 255, 255, 0.9);
            --color-graduated: #a8a8a8; /* สีเทา Minimalist สำหรับสถานะพิเศษ */
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Quicksand', 'Kanit', sans-serif;
            background-attachment: fixed;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        /* 📡 Top Navbar — พื้นขาวทึบ ตัวหนังสือ/ลูกศรสีเข้ม เส้นบางด้านล่าง (สไตล์ iAM48 History) */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            border-bottom: 1px solid #ececec;
        }

        .nav-back-btn {
            color: #222222;
            font-size: 1.25rem;
            text-decoration: none;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .nav-title {
            font-weight: 700;
            font-size: 1.15rem;
            color: #222222;
            letter-spacing: 0.3px;
        }

        .nav-spacer { width: 35px; }

        .main-container {
            width: 100%;
            padding: 85px 12px 40px 12px;
        }

        .champ-list-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }
      
        /* ✨ การ์ดแชมป์สไตล์ iAM48 History:
           บน = แถบสีวงโค้งด้านซ้าย (รูป+มงกุฎ) + ข้อความด้านขวา (ช่วงวันที่ / ชื่อ / คะแนนตัวใหญ่ / ปุ่มขอบดำ View special thanks)
           ล่าง = แถบ View Ranking เต็มความกว้าง */
        .champ-row-box {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: fadeInRow 0.4s ease-out backwards;
            transition: transform 0.2s ease;
        }

        .champ-row-box:active {
            transform: scale(0.99);
        }

        .box-main-content {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 16px 18px 0;
            position: relative;
            /* สีแถบโค้งซ้ายตามวง (ตั้งต่อการ์ดใน JS): BLM48 เหลือง / NPT48 ฟ้า */
            --panel: #fbe3a0;
            --panel-soft: #fdf0c8;
        }
        /* แถบสีซ้าย: ชั้นหลัง = สีอ่อนกว้างกว่า, ชั้นหน้า = สีเข้มขึ้น ขอบขวาโค้ง */
        .box-main-content::before,
        .box-main-content::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            border-radius: 0 50% 50% 0 / 0 60% 60% 0;
            z-index: 0;
        }
        .box-main-content::before { width: 128px; background: var(--panel-soft); }
        .box-main-content::after  { width: 116px; background: var(--panel); }

        .avatar-cell {
            width: 112px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .avatar-frame {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            padding: 3px;           /* วงสีวง (ตั้งใน JS) */
            flex-shrink: 0;
            position: relative;
        }

        .member-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #fff;
            border: 2px solid #ffffff;
            box-sizing: border-box;
        }

        /* 👑 มงกุฎในวงกลมขาวมุมล่างขวา */
        .crown-mini {
            position: absolute;
            bottom: -4px;
            right: -6px;
            color: #f5b301;
            font-size: 0.85rem;
            background-color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        }

        .member-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            position: relative;
            z-index: 2;
        }

        .period-text {
            font-size: 0.85rem;
            color: #8e8e8e;
            font-weight: 600;
        }

        .member-name {
            margin: 4px 0 0;
            font-size: 0.92rem;
            font-weight: 500;
            color: #333333;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .cookie-amount {
            font-size: 1.35rem;
            color: #222222;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            line-height: 1.2;
        }

        .cookie-amount i {
            color: #444444;
            font-size: 1rem;
        }

        /* ปุ่มขอบดำทรงแคปซูล */
        .view-thanks-btn {
            align-self: flex-start;
            margin-top: 6px;
            padding: 6px 14px;
            border: 1.5px solid #222222;
            border-radius: 999px;
            color: #222222;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            background: #ffffff;
            white-space: nowrap;
            transition: background 0.2s ease;
        }
        .view-thanks-btn:active { background: #f2f2f2; }

        /* แถบ View Ranking เต็มความกว้างด้านล่าง */
        .view-ranking-bottom-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 8px;
            border-top: 1px solid #ececec;
            color: #333333;
            font-size: 0.98rem;
            font-weight: 500;
            text-decoration: none;
            background: #ffffff;
            transition: background 0.2s ease;
        }
        .view-ranking-bottom-btn:active { background: #f7f7f7; }
        .view-ranking-bottom-btn i {
            font-size: 1.1rem;
            color: #333333;
        }

        @media (min-width: 768px) {
            .avatar-frame { width: 80px; height: 80px; }
            .cookie-amount { font-size: 1.5rem; }
        }

        .coming-soon-btn {
            color: var(--text-muted);
            cursor: default;
            pointer-events: none;
        }

        .coming-soon-btn i {
            color: var(--text-muted);
        }

        /* 💫 Skeleton Row */
        .skeleton-row {
            background: var(--glass-bg-strong);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .skeleton-anim {
            background: linear-gradient(90deg, #f3f3f3 25%, #eaeaea 37%, #f3f3f3 63%);
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
        }

        @keyframes skeleton-loading {
            0% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInRow {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
      
        /* 🎓 ป้ายสถานะแบบสีเทา */
        .grad-badge {
            font-size: 0.7rem;
            color: #ffffff;
            background-color: var(--color-graduated);
            padding: 1px 6px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* 🎓 ไอคอนหมวกปริญญามุมบนซ้ายของรูปโปรไฟล์ */
        .grad-icon-profile {
            position: absolute;
            top: -5px;
            left: -5px;
            background-color: var(--color-graduated);
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            border: 2px solid white;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
      /* 🎁 ปุ่มของขวัญใน Navbar */
.nav-gift-btn {
    color: #222222; /* ให้เข้ากับ navbar ขาว ตัวหนังสือเข้ม */
    font-size: 1.3rem;
    text-decoration: none;
    width: 35px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, color 0.2s ease;
}

.nav-gift-btn:hover {
    transform: scale(1.1);
}

.nav-gift-btn:active {
    transform: scale(0.9);
}
    </style>
  <!-- 🎉 ธีมเทศกาล (เปิด/ปิดเองตามวันที่ ดูรายการเทศกาลใน assets/js/festivals.js) -->
  <link rel="stylesheet" href="assets/css/festivals.css">
  <script src="assets/js/festivals.js"></script>
</head>
<body class="glass-mesh-bg force-white-bg">

    <div class="top-navbar">
        <a href="index" class="nav-back-btn">
            <i class="fas fa-chevron-left"></i>
        </a>
        <div class="nav-title">Champ of the Month</div>
        <a href="chamgift" class="nav-gift-btn">
          <i class="fa-solid fa-gift"></i>
      </a>
    </div>

    <div class="main-container">
        <div class="champ-list-container" id="champ-list-wrapper">
            
            <!-- Skeleton Loading แก้ไขให้สอดคล้องกับโครงสร้างใหม่ -->
            <div class="skeleton-row">
                <div style="display:flex; align-items:center; gap:16px; padding:16px;">
                    <div class="skeleton-anim" style="width:70px; height:70px; border-radius:50%; flex-shrink:0;"></div>
                    <div style="display:flex; flex-direction:column; gap:6px; flex:1;">
                        <div class="skeleton-anim" style="width:40%; height:12px; border-radius:4px;"></div>
                        <div class="skeleton-anim" style="width:60%; height:16px; border-radius:4px;"></div>
                        <div class="skeleton-anim" style="width:30%; height:12px; border-radius:4px;"></div>
                    </div>
                </div>
                <div class="skeleton-anim" style="width:100%; height:43px;"></div>
            </div>

        </div>
    </div>

    <script>
        let globalChampData = [];

        async function loadChampHistoryData() {
            const cachedData = sessionStorage.getItem('blm_champ_history');
            if (cachedData) {
                globalChampData = JSON.parse(cachedData);
                renderChampRows(globalChampData); 
            }

            try {
                const result = await blm48GetChampOfTheMonth();

                if (result.status === "success") {
                    if (JSON.stringify(globalChampData) !== JSON.stringify(result.data)) {
                        globalChampData = result.data;
                        sessionStorage.setItem('blm_champ_history', JSON.stringify(globalChampData));
                        renderChampRows(globalChampData);
                    }
                } else {
                    if (!cachedData) {
                        document.getElementById('champ-list-wrapper').innerHTML = `<div class="empty-state">โหลดข้อมูลล้มเหลว: ${result.message}</div>`;
                    }
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                if (!cachedData) {
                    document.getElementById('champ-list-wrapper').innerHTML = `<div class="empty-state">ระบบขัดข้อง กรุณาลองใหม่อีกครั้งงับ</div>`;
                }
            }
        }

        function renderChampRows(champArray) {
            const container = document.getElementById('champ-list-wrapper');
            container.innerHTML = ''; 

            if (!champArray || champArray.length === 0) {
                container.innerHTML = `<div class="empty-state">ยังไม่มีประวัติทำเนียบแชมป์ในขณะนี้ค่ะ 🌟</div>`;
                return;
            }

            const fragment = document.createDocumentFragment();

            champArray.forEach((champ, index) => {
                const row = document.createElement('div');
                row.className = 'champ-row-box';
                row.style.animationDelay = `${index * 0.05}s`;

                const formatCookieCount = Number(champ.totalCookie).toLocaleString();
                
                const memberName = champ.name ? champ.name : 'Unknown Member';
                const avatarImg = champ.profileImage ? champ.profileImage : 'https://lh3.googleusercontent.com/d/1rebp2F8vyP0nyvsEOFD9Nw2mPcRtVqtG=s400';

                // 🎨 แยกสีตามวง: กรอบรูป BLM48 = #ffde5b, NPT48 = #66cbff + แถบโค้งซ้ายสีอ่อนของวง
                const isNPT48 = (champ.groupName || 'BLM48').toString().trim().toUpperCase() === 'NPT48';
                const avatarFrameBg = isNPT48 ? '#66cbff' : '#ffde5b';
                const panelVars = isNPT48
                    ? '--panel: #bfe7fd; --panel-soft: #def3fe;'
                    : '--panel: #fbe3a0; --panel-soft: #fdf0c8;';

                // 1. ตรวจสอบสถานะ Graduated
                const isGraduated = champ.status === 'Graduated';
                
                // 2. ตรวจสอบสถานะ ไม่มีรายชื่อในระบบ
                const hasNoProfileImage = !champ.profileImage || champ.profileImage.toString().trim() === '';
                const isNotInSystem = champ.status === 'Not in System' || (hasNoProfileImage && !isGraduated);

                let statusBadge = '';
                let statusProfileIcon = '';

                if (isGraduated) {
                    statusBadge = `<span class="grad-badge"><i class="fa-solid fa-graduation-cap"></i> GRADUATED</span>`;
                    statusProfileIcon = `<div class="grad-icon-profile"><i class="fa-solid fa-graduation-cap"></i></div>`;
                } else if (isNotInSystem) {
                    statusBadge = `<span class="grad-badge"><i class="fa-solid fa-graduation-cap"></i> GRADUATED</span>`;
                    statusProfileIcon = `<div class="grad-icon-profile"><i class="fa-solid fa-graduation-cap"></i></div>`;
                }

                // ปรับเปลี่ยนโครงสร้างภายใน: แยกเป็นส่วนเนื้อหาด้านบน (box-main-content) และปุ่มบาร์ยาวด้านล่าง (view-thanks-bottom-btn)
                row.innerHTML = `
                    <div class="box-main-content" style="${panelVars}">
                        <div class="avatar-cell">
                            <div class="avatar-frame" style="background: ${avatarFrameBg};">
                                ${statusProfileIcon}
                                <img class="member-avatar"${memberLinkAttr(memberName)} loading="lazy" src="${avatarImg}" alt="${escapeHtml(memberName)}" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=150'">
                                <i class="fa-solid fa-crown crown-mini"></i>
                            </div>
                        </div>
                        <div class="member-details">
                            <span class="period-text">The Winner&nbsp; ${escapeHtml(champ.monthYear || 'ไม่ระบุช่วงเวลา')}</span>
                            <h2 class="member-name">${escapeHtml(memberName)} ${statusBadge}</h2>
                            <span class="cookie-amount"><i class="fa-solid fa-cookie-bite"></i> ${formatCookieCount}</span>
                            <a href="${champ.postId ? `postdetail?id=${encodeURIComponent(champ.postId)}` : `specialthanks?index=${index}`}" class="view-thanks-btn">View special thanks</a>
                        </div>
                    </div>
                    <a href="champranking?index=${index}" class="view-ranking-bottom-btn">
                        <i class="fa-solid fa-ranking-star"></i> View Ranking
                    </a>
                `;
                fragment.appendChild(row);
            });
            
            container.appendChild(fragment);
        }

        window.addEventListener('DOMContentLoaded', loadChampHistoryData);
    </script>
</body>
</html>
