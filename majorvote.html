<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLM48 | Major Vote</title>
    <meta name="theme-color" content="#ffc0cb">
    
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/0">
    <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1">
    
    <meta name="apple-mobile-web-app-title" content="BLM48">   
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>
    <style>
        :root {
            --primary-pink: #ff85a2;
            --blm-pink: var(--primary-pink);
            --blm-light-pink: #fff0f5;
            --text-dark: #4a4a4a;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Quicksand', 'Kanit', sans-serif;
            color: var(--text-dark);
            margin: 0; padding: 0; padding-top: 70px;
            padding-bottom: 30px;
        }

        /* 📡 Top Navbar */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(var(--glass-blur-lg)); -webkit-backdrop-filter: blur(var(--glass-blur-lg));
            display: flex; align-items: center; justify-content: center;
            padding: 0 20px; box-shadow: 0 2px 10px rgba(255, 133, 162, 0.06);
            z-index: 1000;
        }
        .nav-left-actions {
            position: absolute; left: 15px; display: flex; align-items: center; gap: 8px;
        }
        .nav-btn {
            color: var(--blm-pink); font-size: 1rem; text-decoration: none;
            width: 35px; height: 35px; display: flex;
            align-items: center; justify-content: center;
            border-radius: 50%; background: var(--blm-light-pink);
            border: none; cursor: pointer; transition: transform 0.2s;
        }
        .nav-btn:active { transform: scale(0.9); }
        .nav-title { font-weight: 600; font-size: 1.2rem; color: var(--text-dark); }

        /* กระเป๋าเงิน */
        .profile-wallet-card {
            background: var(--glass-bg-strong); border-radius: 20px; padding: 16px;
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            box-shadow: var(--glass-shadow); border: 1px solid var(--glass-border); margin: 15px 20px;
        }
        .wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .wallet-box { display: flex; align-items: center; gap: 10px; background: #fcf8f9; padding: 10px 12px; border-radius: 14px; }
        .wallet-icon-wrapper { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #ffffff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03); overflow: hidden; }
        .wallet-token-img { width: 100%; height: 100%; object-fit: contain; padding: 2px; }
        .wallet-info { display: flex; flex-direction: column; }
        .wallet-title { font-size: 11px; color: #888888; font-weight: 500; }
        .wallet-value { font-size: 15px; color: #333333; font-weight: 600; font-family: 'Kanit', sans-serif; }

        /* แคมเปญโหวต */
        .section-title { font-family: 'Kanit', sans-serif; font-weight: 600; color: #444; margin: 30px 0 15px 20px; font-size: 18px; border-left: 5px solid var(--primary-pink); padding-left: 12px; }
        .ranking-wrapper {
            position: relative;
            background-color: var(--glass-bg); /* โทนขาวโปร่งแสง */
            backdrop-filter: blur(var(--glass-blur));                  /* เอฟเฟกต์กระจกฝ้าละมุนๆ */
            -webkit-backdrop-filter: blur(var(--glass-blur));
            padding: 15px;
            border-radius: 20px;
            border: 1px solid var(--glass-border); /* ขอบขาวบางช่วยตัดเส้นขอบกระจกให้ดูมีมิติ */
            box-shadow: none !important;                 /* 🙅‍♂️ ลบเงาออกเรียบร้อยแล้วงับ */
            overflow: hidden;
            margin: 0 20px;
        }
        .major-vote-scroll { display: flex; gap: 16px; overflow-x: auto; padding: 5px 5px 15px; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .major-vote-scroll::-webkit-scrollbar { display: none; }
        
        .major-vote-card {
            min-width: 280px; max-width: 280px; background: var(--glass-bg-strong); border-radius: 20px;
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            box-shadow: var(--glass-shadow); scroll-snap-align: start; overflow: hidden;
            text-decoration: none; color: inherit; display: block; border: 1px solid var(--glass-border); transition: transform 0.2s, box-shadow 0.2s; position: relative;
        }
        .major-vote-card:active { transform: scale(0.97); }
        
        .card-image-wrapper {
            position: relative; width: 100%; height: 155px; overflow: hidden;
            background-color: #ffeef2; display: flex; align-items: center; justify-content: center;
        }
        .major-vote-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; position: relative; z-index: 2; }
        
        /* 🎨 สร้าง CSS เปล่าเป็นภาพสำรอง 100% ไม่ยิงลิงก์นอกเว็บเมื่อรูปจริงเสีย */
        .image-fallback-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ffeef2 0%, #ffd1dc 100%);
            display: flex; align-items: center; justify-content: center; z-index: 1;
        }
        .image-fallback-bg i { color: var(--primary-pink); font-size: 2.5rem; opacity: 0.5; }
        
        .status-badge-overlay { position: absolute; top: 12px; right: 12px; z-index: 5; }
        .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .status-open { background: #e6f9ed; color: #2e7d32; border: 1px solid rgba(46, 125, 50, 0.2); }
        .status-closed { background: #ffebee; color: #c62828; border: 1px solid rgba(198, 40, 40, 0.2); }

        .major-vote-info { padding: 16px; background: transparent; position: relative; z-index: 3; }
        .major-vote-title { font-weight: 600; font-size: 16px; margin: 0 0 6px 0; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .vote-method-badges { display: flex; gap: 5px; flex-wrap: wrap; }
        .method-badge { font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 10px; letter-spacing: 0.3px; }
        .method-badge.mb-token { background: #fff0f5; color: var(--primary-pink); }
        .method-badge.mb-getoken { background: #e8f6fd; color: #2980b9; }
        .method-badge.mb-gift { background: #fff8e6; color: #b8860b; }
        .card-footer-action { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #f5f5f5; font-size: 12px; color: #888; }
        .go-vote-btn { color: var(--blm-pink); font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .loading-text { text-align: center; width: 100%; color: #999; padding: 40px 20px; font-size: 14px; }
      
      /* 🧁 โครงสร้างโซนปุ่ม Action วงกลมใต้กระเป๋าเงิน */
.wallet-actions-container {
    display: flex;
    justify-content: center;
    gap: 32px; /* ระยะห่างระหว่าง 2 ปุ่ม */
    margin-top: 20px;
    margin-bottom: 15px;
}

.circle-action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: none;
    border: none;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    -webkit-tap-highlight-color: transparent;
}

.circle-action-btn:active {
    transform: scale(0.92); /* เอฟเฟกต์ตอนกดแล้วยุบตัวนิด ๆ */
}

.circle-action-btn .circle-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%; /* บังคับวงกลมแท้ 100% */
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    color: #ffffff;
    transition: all 0.2s ease;
}

/* 🎟️ ปุ่ม Redeem Code (โทนสีชมพูพาสเทลหวาน ๆ เข้ากับธีมหลัก) */
.btn-redeem-code .circle-icon {
    background-color: #e6fcf5 !important; /* เขียวมิ้นท์อ่อนโปร่งแสง */
    color: #20c997 !important;            /* ไอคอนสีมิ้นท์สดใส เข้มพอให้เห็นชัด */
    box-shadow: 0 4px 12px rgba(32, 201, 151, 0.2);
}

/* 🎒 ปุ่ม Inventory (โทนสีฟ้าพาสเทลสดชื่น) */
.btn-inventory .circle-icon {
    background-color: #e7f5ff !important; /* ฟ้าอ่อนโปร่งแสง */
    color: #4dabf7 !important;            /* ไอคอนสีฟ้าสด */
    box-shadow: 0 4px 12px rgba(77, 171, 247, 0.2);
}

/* 📜 ปุ่ม History (โทนสีม่วงพาสเทลลาเวนเดอร์น่ารัก) */
.btn-history-log .circle-icon {
    background-color: #f3f0ff !important; /* ม่วงอ่อนโปร่งแสง */
    color: #9775fa !important;            /* ไอคอนสีม่วงสด */
    box-shadow: 0 4px 12px rgba(151, 117, 250, 0.2);
}

.circle-action-btn .circle-label {
    font-size: 12px;
    font-weight: 500;
    color: #3a3a3a;
    margin-top: 8px;
    font-family: 'Quicksand', 'Kanit', sans-serif;
}
    /* 📥 ปุ่ม Receive (โทนสีเหลืองพาสเทล) */
    .btn-receive .circle-icon {
        background-color: #fff8d6 !important; /* เหลืองอ่อนโปร่งแสง */
        color: #f5b041 !important;            /* ไอคอนสีเหลืองอมส้ม */
        box-shadow: 0 4px 12px rgba(245, 176, 65, 0.2);
    }
      
    </style>
</head>
<body class="glass-mesh-bg">

<div class="top-navbar">
    <div class="nav-left-actions">
        <button class="nav-btn" title="กลับ" onclick="history.back()" style="background: none; border: none; padding: 0; cursor: pointer;">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button class="nav-btn" id="refresh-btn" onclick="handleManualRefresh()" title="รีเฟรชข้อมูล">
            <i class="fas fa-arrows-rotate"></i>
        </button>
    </div>
</div>

    <div class="profile-wallet-card">
        <div class="wallet-grid">
            <div class="wallet-box">
                <div class="wallet-icon-wrapper">
                    <img src="https://lh3.googleusercontent.com/d/1LxHGOclJIl4Xqxi0dI5_Y235t6lfAiCZ=s1000" class="wallet-token-img" alt="Token" onerror="this.src='https://placehold.co/40?text=TK'">
                </div>
                <div class="wallet-info">
                    <span class="wallet-title">Token</span>
                    <span class="wallet-value" id="token-balance">-</span>
                </div>
            </div>
            <div class="wallet-box">
                <div class="wallet-icon-wrapper">
                    <img src="https://lh3.googleusercontent.com/d/1Fiw60kJvy6QmIhzrkgzEjMj85POwcoiZ=s1000" class="wallet-token-img" alt="GE Token" onerror="this.src='https://placehold.co/40?text=GE'">
                </div>
                <div class="wallet-info">
                    <span class="wallet-title">GE Token</span>
                    <span class="wallet-value" id="getoken-balance">-</span>
                </div>
            </div>
        </div>
    </div>
  
<div class="wallet-actions-container">
    <button onclick="showReceiveCode()" class="circle-action-btn btn-receive" type="button">

    <button onclick="redeemCode()" class="circle-action-btn btn-redeem-code" type="button">
        <div class="circle-icon"><i class="fas fa-ticket-alt"></i></div>

    <a href="inventory.html" class="circle-action-btn btn-inventory">
        <div class="circle-icon"><i class="fas fa-briefcase"></i></div>

    </a>
    
    <a href="history.html" class="circle-action-btn btn-history-log">

</div>

    <div class="section-title"> Major Vote</div>
    <div class="ranking-wrapper">
        <div class="major-vote-scroll" id="vote-container">
            <div class="loading-text">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading...
            </div>
        </div>
    </div>
<script>
    const APP_VERSION = '1.0.5';

    // อ่านจากคอลัมน์ TokenType ของแคมเปญ (H): เว้นว่าง = เปิดรับทั้ง Token และ GE Token, ใส่ "Gift" = แคมเปญนี้ใช้ Gift ล้วนๆ ไม่มีโหวตด้วยเหรียญเลย
    // และคอลัมน์ EnableGift (I) ที่ backend แปลงเป็น boolean ให้แล้ว
    function getCampaignMethodBadges(camp) {
        const tokenType = camp.TokenType ? camp.TokenType.toString().trim().toLowerCase() : '';
        const badges = [];
        if (tokenType === 'gift') {
            // แคมเปญ Gift ล้วนๆ ไม่ต้องโชว์ badge Token/GE Token เลย
        } else if (tokenType === 'getoken') {
            badges.push({ label: 'GE Token', cls: 'mb-getoken' });
        } else if (tokenType === 'token') {
            badges.push({ label: 'Token', cls: 'mb-token' });
        } else {
            badges.push({ label: 'Token', cls: 'mb-token' });
            badges.push({ label: 'GE Token', cls: 'mb-getoken' });
        }
        if (camp.EnableGift === true || camp.EnableGift === 'TRUE') {
            badges.push({ label: 'Gift', cls: 'mb-gift' });
        }
        return badges;
    }

    function buildMethodBadgesHtml(badges) {
        return badges.map(b => `<span class="method-badge ${b.cls}">${b.label}</span>`).join('');
    }

    function checkAppVersion() {
        const savedVersion = localStorage.getItem('bnl_app_version');
        if (savedVersion !== APP_VERSION) {
            localStorage.removeItem('blm48_major_votes_cache');
            localStorage.removeItem('bnl_vote_wallet_cache'); 
            localStorage.setItem('bnl_app_version', APP_VERSION);
        }
    }

    // 🌟 ตัวแปรหลักที่ใช้เก็บชื่อผู้ใช้ของหน้านี้คือ username
    const username = getUsernameFromSession(); 

    async function initPage() {
        if (!username) {
            alert("กรุณาเข้าสู่ระบบก่อนใช้งาน");
            window.location.href = "login.html";
            return;
        }
        checkAppVersion();
        
        loadWalletFromCache();
        
        await Promise.all([loadUserBalancesRealTime(), loadVoteCampaigns()]);
    }

    function loadWalletFromCache() {
        try {
            const cachedUserData = localStorage.getItem('bnl_vote_wallet_cache');
            if (cachedUserData) {
                const user = JSON.parse(cachedUserData);
                const tokenVal = user.Token !== undefined ? user.Token : (user.token || 0);
                const geTokenVal = user.GEToken !== undefined ? user.GEToken : (user.geToken || 0);
                document.getElementById("token-balance").textContent = Number(tokenVal).toLocaleString();
                document.getElementById("getoken-balance").textContent = Number(geTokenVal).toLocaleString();
            } else {
                const primaryCache = localStorage.getItem('bnl_user_data_cache');
                if (primaryCache) {
                    const user = JSON.parse(primaryCache);
                    const tokenVal = user.Token !== undefined ? user.Token : (user.token || 0);
                    const geTokenVal = user.GEToken !== undefined ? user.GEToken : (user.geToken || 0);
                    document.getElementById("token-balance").textContent = Number(tokenVal).toLocaleString();
                    document.getElementById("getoken-balance").textContent = Number(geTokenVal).toLocaleString();
                }
            }
        } catch (e) { console.error(e); }
    }

    async function loadUserBalancesRealTime() {
        try {
            // token/cookie/geToken ตอนนี้ Supabase เป็นเจ้าของค่าจริง ดึงจากตรงนั้นแทนชีต
            const wallet = await blm48GetWallet(username);
            if (wallet && wallet.token !== undefined) {
                document.getElementById("token-balance").textContent = Number(wallet.token).toLocaleString();
                document.getElementById("getoken-balance").textContent = Number(wallet.geToken).toLocaleString();

                localStorage.setItem('bnl_vote_wallet_cache', JSON.stringify(wallet));
            }
        } catch (error) {
            console.error("โหลดยอดเงินเรียลไทม์ขัดข้อง:", error);
        }
    }

    async function loadVoteCampaigns() {
        const container = document.getElementById("vote-container");
        const cachedVotes = localStorage.getItem('blm48_major_votes_cache');
        if (cachedVotes) {
            try {
                const localData = JSON.parse(cachedVotes);
                if (localData && localData.length > 0) renderCampaignCards(localData);
            } catch (e) { console.error(e); }
        }
        try {
            // ตารางแคมเปญโหวต (majorVoteCollections) ตอนนี้ sync เข้า Supabase แบบเรียลไทม์แล้ว อ่านจากตรงนั้นแทน Apps Script
            const data = await blm48GetVoteCollections();
            if (Array.isArray(data) && data.length > 0) {
                const mapped = data.map(c => ({
                    VoteCollectionID: c.voteCollectionId,
                    Title: c.title,
                    Description: c.description,
                    CoverImage: c.coverImage,
                    StartTime: c.startTime,
                    EndTime: c.endTime,
                    Status: c.status,
                    TokenType: c.tokenType,
                    EnableGift: c.enableGift
                }));
                localStorage.setItem('blm48_major_votes_cache', JSON.stringify(mapped));
                renderCampaignCards(mapped);
            } else if (!cachedVotes) {
                container.innerHTML = `<div class="loading-text">ไม่มีการกิจกรรมโหวตในขณะนี้</div>`;
            }
        } catch (error) {
            if (!cachedVotes) container.innerHTML = `<div class="loading-text">⚠️ ไม่สามารถเชื่อมต่อข้อมูลได้</div>`;
        }
    }

    function renderCampaignCards(campaignsList) {
        const container = document.getElementById("vote-container");
        container.innerHTML = ""; 
        
        const now = new Date().getTime();

        campaignsList.forEach(camp => {
            const status = (camp.Status || "Closed").trim().toUpperCase();
            const isOpen = status === "OPEN"; 
            
            if (camp.StartTime) {
                const startTimeParsed = new Date(camp.StartTime).getTime();
                if (!isNaN(startTimeParsed) && startTimeParsed > now) return; 
            }
            if (camp.EndTime) {
                const endTimeParsed = new Date(camp.EndTime).getTime();
                if (!isNaN(endTimeParsed) && endTimeParsed < now) return; 
            }

            let coverImgUrl = camp.CoverImage || camp["รูปจากไดร์ฟ"] || "";
            
            if (coverImgUrl && coverImgUrl.includes("http")) {
                const words = coverImgUrl.split(" ");
                words.forEach(w => {
                    if (w.startsWith("http")) coverImgUrl = w;
                });
            }

            const hasValidImage = coverImgUrl && coverImgUrl.trim() !== "" && !coverImgUrl.includes("placeholder");
            const imageSrc = hasValidImage ? coverImgUrl : "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
            const methodBadges = getCampaignMethodBadges(camp);

            const cardHtml = `
                <a href="majorvote_detail.html?id=${encodeURIComponent(camp.VoteCollectionID)}&status=${encodeURIComponent(status.toLowerCase())}" class="major-vote-card">
                    <div class="card-image-wrapper">
                        <div class="image-fallback-bg">
                            <i class="fa-solid fa-star"></i>
                        </div>
                        <div class="status-badge-overlay">
                            <span class="status-badge ${isOpen ? 'status-open' : 'status-closed'}">
                            ${isOpen ? 'OPEN' : 'CLOSED'}
                            </span>
                        </div>
                        <img src="${imageSrc}" alt="Vote" style="${hasValidImage ? 'display:block;' : 'display:none;'}" onerror="this.style.display='none';">
                    </div>
                    <div class="major-vote-info">
                        <h4 class="major-vote-title">${escapeHtml(camp.Title || 'Coming Soon')}</h4>
                        <div class="vote-method-badges">${buildMethodBadgesHtml(methodBadges)}</div>
                        <div class="card-footer-action">
                            <span>${isOpen ? 'Voting Now' : 'สิ้นสุดกิจกรรมโหวตแล้ว'}</span>
                            <span class="go-vote-btn">
                                ${isOpen ? 'Vote' : 'Ranking'} <i class="fa-solid fa-chevron-right"></i>
                            </span>
                        </div>
                    </div>
                </a>
            `;
            container.insertAdjacentHTML('beforeend', cardHtml);
        });

        if (container.children.length === 0) {
            container.innerHTML = `<div class="loading-text">ไม่มีการกิจกรรมโหวตในขณะนี้</div>`;
        }
    }
  
    // 🎟️ ฟังก์ชัน Redeem Code ที่แก้ไขตัวแปรเรียบร้อยแล้วค่ะ
    async function redeemCode() {
        if (!username) { // ✨ แก้ไขจาก !user เป็น !username
            Swal.fire('ไม่พบเซสชัน', 'กรุณาเข้าสู่ระบบใหม่อีกครั้ง', 'error');
            return;
        }

        const { value: code } = await Swal.fire({
            title: 'กรอกรหัสแลกรับสิทธิ์',
            input: 'text', 
            inputPlaceholder: 'กรอกรหัสโค้ดที่นี่...', 
            showCancelButton: true,
            confirmButtonColor: 'var(--primary-pink)',
            cancelButtonText: 'ยกเลิก',
            confirmButtonText: 'ยืนยัน'
        });

        if (code) {
            Swal.fire({ title: 'กำลังตรวจสอบโค้ด...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
            try {
                const res = await blm48RedeemCode(username, code);

                if (res.status === "success") {
                    Swal.fire('ทำรายการสำเร็จ', res.message, 'success').then(() => {
                        // ⚡ เรียกฟังก์ชันนี้เพื่อดึงยอดเงินล่าสุดมาแสดงทันทีโดยไม่ต้อง Refresh หน้าเว็บให้สะดุด
                        loadUserBalancesRealTime();
                    });
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', res.message, 'error');
                }
            } catch (e) {
                console.error(e);
                Swal.fire('การเชื่อมต่อขัดข้อง', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้งในภายหลัง', 'error');
            }
        }
    }

    async function handleManualRefresh() {
        const refreshBtn = document.getElementById("refresh-btn");
        const icon = refreshBtn.querySelector("i");
        icon.classList.add("fa-spin");
        refreshBtn.disabled = true;
        document.getElementById("vote-container").innerHTML = `
            <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
        `;
        await Promise.all([loadUserBalancesRealTime(), loadVoteCampaigns()]);
        setTimeout(() => {
            icon.classList.remove("fa-spin");
            refreshBtn.disabled = false;
        }, 400);
    }

    window.addEventListener("pageshow", function(event) {
        initPage();
    });
  
  // 📥 ฟังก์ชันสร้างและแสดง Wallet Code (Receive)
  function showReceiveCode() {
      if (!username) {
          Swal.fire({
              title: 'เกิดข้อผิดพลาด',
              text: 'ไม่พบข้อมูลการเข้าสู่ระบบ กรุณาเข้าสู่ระบบก่อนทำรายการ',
              icon: 'error',
              confirmButtonColor: 'var(--primary-pink)',
              confirmButtonText: 'ตกลง'
          });
          return;
      }

      // 1. จำลอง SUBSTITUTE(A3, "-", "")
      let cleanUsername = username.replace(/-/g, "");

      // 2. จำลอง VALUE(...)
      let numValue = Number(cleanUsername);

      // ดักจับกรณีที่ username มีตัวอักษรผสมอยู่และกลายเป็น NaN (Not-a-Number)
      if (isNaN(numValue)) {
          Swal.fire({
              title: 'เกิดข้อผิดพลาด',
              text: 'รูปแบบบัญชีผู้ใช้งานไม่ถูกต้อง ไม่สามารถดำเนินการสร้างรหัสได้',
              icon: 'error',
              confirmButtonColor: 'var(--primary-pink)',
              confirmButtonText: 'ตกลง'
          });
          return;
      }

      // 3. คูณ 84729
      let multipliedValue = numValue * 84729;

      // 4. จำลอง DEC2HEX(..., 6) และ UPPER()
      // ใช้ .toString(16) แปลงเป็นฐาน 16, .toUpperCase() ทำตัวพิมพ์ใหญ่, และ .padStart(6, '0') เพื่อให้ครบ 6 หลัก
      let hexCode = multipliedValue.toString(16).toUpperCase().padStart(6, '0');

      // 5. ต่อ String ด้วย "BLM-"
      let finalWalletCode = "BLM-" + hexCode;

      // แสดงผลผ่าน SweetAlert2 แบบเป็นทางการ พร้อมฟังก์ชัน Copy
      Swal.fire({
          title: 'รหัสกระเป๋าเงินของท่าน',
          html: `
              <div style="display: flex; align-items: center; justify-content: center; gap: 12px; padding: 20px; background: #fff0f5; border-radius: 12px; margin-top: 10px;">
                  <span style="font-size: 24px; font-weight: 700; color: var(--primary-pink); letter-spacing: 2px;">
                      ${finalWalletCode}
                  </span>
                  <button id="copy-code-btn" style="background: none; border: none; color: var(--primary-pink); cursor: pointer; font-size: 22px; transition: 0.2s;" title="Copy to clipboard">
                      <i class="fas fa-copy"></i>
                  </button>
              </div>
              <p id="copy-status-text" style="font-size: 13px; color: #20c997; margin-top: 8px; font-weight: 600; height: 15px; visibility: hidden;">
                  Copied successfully!
              </p>
              <p style="font-size: 14px; color: #888; margin-top: 5px;">
                  Use this address to receive BLM tokens from BLM48 Membership
              </p>
          `,
          icon: 'info',
          confirmButtonColor: 'var(--primary-pink)',
          confirmButtonText: 'Close',
          didOpen: () => {
              // ดักจับเหตุการณ์การกดปุ่ม Copy เมื่อ Popup เปิดขึ้นมาแล้ว
              const copyBtn = document.getElementById('copy-code-btn');
              const statusText = document.getElementById('copy-status-text');

              copyBtn.addEventListener('click', () => {
                  // คำสั่งคัดลอกข้อความลง Clipboard
                  navigator.clipboard.writeText(finalWalletCode).then(() => {
                      // เปลี่ยนไอคอนเป็นเครื่องหมายถูกสีเขียว
                      copyBtn.innerHTML = '<i class="fas fa-check-circle" style="color: #20c997;"></i>';
                      statusText.style.visibility = 'visible'; // แสดงข้อความสำเร็จ

                      // คืนค่ากลับเป็นไอคอนเดิมหลังจากผ่านไป 2 วินาที
                      setTimeout(() => {
                          copyBtn.innerHTML = '<i class="fas fa-copy"></i>';
                          statusText.style.visibility = 'hidden';
                      }, 2000);
                  }).catch(err => {
                      console.error('Failed to copy: ', err);
                  });
              });
          }
      });
  }
</script>
