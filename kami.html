<!DOCTYPE html>
<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>BLM48 Membership | My Kami-Oshi Members</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffc0cb">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s192">
    <meta name="apple-mobile-web-app-title" content="BLM48">   
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>
    <style>
        :root {
            --primary-pink: #ff85a2;
            --soft-bg: #fffbfd;
            --card-border: #ffeef2;
            --kami-gold: #ffd700;
            --oshi-blue: #7dd3fc;
            --danger-red: #ff6b6b;
            --text-dark: #444;
            --graduated-gray: #9ca3af;
        }
        
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* 🤍 หน้านี้ขอพื้นหลังขาวล้วน แทนพื้นหลังไล่สีทอง-ครีมเริ่มต้นของ glass-mesh-bg (ทับด้วย
           source order เพราะ style block นี้โหลดทีหลัง assets/css/glassmorphism.css) */
        body.glass-mesh-bg {
            background-color: #ffffff;
            background-image: none;
        }

        /* 📡 แถบบนสีขาว: ปุ่มย้อนกลับซ้าย + ชื่อหน้าตรงกลาง */
        .top-navigation-bar {
            position: sticky; top: 0; z-index: 100;
            height: 56px; display: flex; align-items: center; justify-content: center;
            background: #ffffff; border-bottom: 1px solid #e8e8e8;
            padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
        }
        .nav-back-btn {
            position: absolute; left: 6px; bottom: 6px;
            width: 44px; height: 44px; background: none; border: none;
            color: #222; font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .top-bar-page-title { font-size: 18px; font-weight: 600; color: #222; }

        .page-content { width: 100%; max-width: 720px; margin: 0 auto; padding-bottom: 40px; }

        .list-section-title {
            font-size: 16px; font-weight: 600; color: #222;
            margin: 18px 12px 10px;
        }

        /* 👑 Kami-Oshi: รูปวงกลมใหญ่ตรงกลาง + ป้ายจำนวนวันซ้อนขอบล่างของรูป */
        .kami-container {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; position: relative; padding: 0 12px 6px;
        }
        .member-profile-link {
            text-decoration: none; color: inherit; cursor: pointer;
            display: inline-flex; flex-direction: column; align-items: center;
        }
        /* กรอบรูปใช้สีประจำวงของเมมเบอร์ (BLM48 = เหลือง, NPT48 = ฟ้า) เหมือนหน้า search / member */
        .kami-avatar-frame { position: relative; width: 104px; height: 104px; }
        .kami-img {
            width: 104px; height: 104px; border-radius: 50%; object-fit: cover; display: block;
            border: 3px solid var(--group-color, #ffde5b); background: #fdfdfd;
        }
        /* ป้ายสีเดียวกับ .my-kami-days (search.html) / .kami-days-badge (member.html) */
        .kami-days-badge {
            position: relative; margin-top: -14px; z-index: 3;
            display: inline-flex; align-items: center; gap: 5px;
            background: linear-gradient(135deg, #ffe08a, #ffc107);
            color: #6b4a00; font-size: 11px; font-weight: bold; letter-spacing: 0.3px;
            padding: 4px 14px; border-radius: 20px; white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }
        .kami-grad-cap {
            position: absolute; bottom: 14px; right: 4px; z-index: 4;
            background: #555; color: #fff; width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; border: 2px solid #fff;
        }
        .kami-title-name { font-size: 17px; font-weight: 600; color: #222; margin-top: 10px; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        .kami-fullname { font-size: 15px; color: #222; margin-top: 4px; }

        /* ❌ ปุ่มลบ (ไอคอน X) ใช้ทั้ง Kami-Oshi และ Oshi */
        .btn-remove-x {
            background: none; border: none; color: #b0b0b0; flex-shrink: 0;
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 16px; transition: 0.2s;
        }
        .btn-remove-x:active { background: #f3f3f3; color: var(--danger-red); }
        .kami-container .btn-remove-x { position: absolute; top: -34px; right: 8px; }

        /* 🏷️ ป้าย GRADUATED สีเทาทึบ */
        .badge-graduated {
            background-color: #8e8e8e; color: #fff;
            font-size: 9.5px; font-weight: 500; letter-spacing: 0.5px;
            padding: 2px 7px; border-radius: 10px; text-transform: uppercase;
            display: inline-flex; align-items: center;
        }

        /* ❤️ รายการ Oshi แบบแถว คั่นด้วยเส้นบางๆ */
        .oshi-grid { width: 100%; padding: 0 12px; }
        .oshi-box-card {
            display: flex; align-items: center; gap: 6px;
            padding: 14px 0; border-bottom: 1px solid #eeeeee;
        }
        .oshi-card-link {
            display: flex; align-items: center; text-decoration: none; color: inherit;
            flex: 1; min-width: 0; cursor: pointer;
        }
        .oshi-pic-wrapper { position: relative; width: 54px; height: 54px; flex-shrink: 0; }
        .oshi-pic {
            width: 54px; height: 54px; border-radius: 50%; object-fit: cover; display: block;
            background: #fdfdfd; border: 2px solid var(--group-color, #ffde5b);
            box-shadow: 0 0 0 2px #fffdf0;
        }
        .oshi-grad-cap {
            position: absolute; bottom: -2px; right: -4px; z-index: 2;
            background: #555; color: #fff; width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 8.5px; border: 1.5px solid #fff;
        }
        .oshi-info-center { flex: 1; min-width: 0; padding-left: 6px; }
        .oshi-name-wrapper { display: flex; align-items: center; gap: 8px; }
        .oshi-display-name { font-size: 15px; font-weight: 500; color: #222; }
        .oshi-fullname {
            font-size: 14.5px; color: #222; margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .badge-oshi {
            flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px;
            border: 1.5px solid #666; color: #555; background: #fff;
            font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
        }

        .empty-heart-state {
            text-align: center; color: #aaa; font-size: 13px; padding: 30px 12px;
        }

        /* ✨ เอฟเฟกต์ Skeleton Loading */
        .skeleton-card { animation: softPulse 1.4s infinite ease-in-out; }
        .skeleton-circle { background: #f2f2f2 !important; border-color: #f2f2f2 !important; border-radius: 50%; }
        .skeleton-text { background: #f2f2f2; height: 14px; border-radius: 6px; margin-top: 5px; }

        @keyframes softPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body class="glass-mesh-bg">

    <div class="top-navigation-bar">
        <button type="button" class="nav-back-btn" onclick="goBackFromKami()" aria-label="ย้อนกลับ">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="top-bar-page-title">My Kami-Oshi</div>
    </div>

    <div class="page-content">
        <div class="list-section-title">Recent Kami-Oshi</div>
        <div id="kami-content-area"></div>

        <div class="list-section-title" style="margin-top: 28px;">My Oshi Members</div>
        <div id="oshi-content-area" class="oshi-grid">
            <p style="text-align:center; color:#ccc; font-size:13px;">กำลังเรียกข้อมูลโอชิ...</p>
        </div>
    </div>
    
<script>
        function getImg(url) {
            if (!url || url === "") return 'https://via.placeholder.com/150';
            if (url.includes('drive.google.com')) {
                const id = url.match(/[-\w]{25,}/);
                return id ? `https://lh3.googleusercontent.com/d/${id[0]}=w300` : url;
            }
            return url; 
        }

        function goBackFromKami() {
            if (document.referrer && window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'profile';
            }
        }

        let user = getUserSession();
        let currentUsername = user ? user.username : "";
        let memberImageMap = {};
        let memberStatusMap = {}; 
        let memberFullDataMap = {}; // 🌟 เพิ่มกล่องเก็บตัวเลขสถิติจริง (Kami, Oshi, Total Cookie)
        let rawOshiBoardData = null; 
        let memberFullNameMap = {}; // ชื่อจริงภาษาอังกฤษของเมมเบอร์ (บรรทัดที่สองใต้ชื่อ)
        let memberGroupMap = {};    // วงของเมมเบอร์ (BLM48 / NPT48) ใช้เลือกสีกรอบรูป

        // 🎨 สีกรอบรูปประจำวง - ใช้ groupFrameColor() กลางใน common.js (BLM48 #ffde5b, NPT48 #66cbff)
        function getGroupColor(memberKey) {
            return groupFrameColor(memberGroupMap[memberKey]);
        }

        window.onload = async () => {
            if (!user || !currentUsername) {
                Swal.fire('กรุณาเข้าสู่ระบบ', 'ไม่พบสิทธิ์การเข้าใช้งานบัญชีของคุณงับ', 'error').then(() => { 
                    window.location.href = 'index'; 
                });
                return;
            }
            
            fetchAndRenderUserOshiBoard();
            fetchMembersFullNames();
            await fetchMembersImageDB();
        };
      
        function openMemberProfile(name, fallbackImg, fallbackStatus) {
            localStorage.removeItem('current_member_stats');
            localStorage.removeItem('current_member_fans');

            const key = name.toString().trim().toLowerCase();
            // 🌟 ดึงข้อมูลตัวเลขจริงที่แมปไว้จากฐานข้อมูลหลังบ้านมาใส่แคชทันที
            const stats = memberFullDataMap[key] || { total_kami: 0, total_oshi: 0, all_time_total: 0 };

            const statsToCache = {
              name: name,
              status: memberStatusMap[key] === 'graduated' ? "Graduated" : (fallbackStatus || "Active"),
              profile_img: memberImageMap[key] || fallbackImg || "",
              total_kami: stats.total_kami,         // 🚀 ตัวเลขจริงส่งตรงถึงหน้า member.html ไม่ขึ้น ... แล้ว!
              total_oshi: stats.total_oshi,         // 🚀 ตัวเลขจริงส่งตรงถึงหน้า member.html ไม่ขึ้น ... แล้ว!
              all_time_total: stats.all_time_total  // 🚀 ตัวเลขจริงส่งตรงถึงหน้า member.html ไม่ขึ้น ... แล้ว!
            };

            localStorage.setItem('current_member_stats', JSON.stringify(statsToCache));
            window.location.href = `member?name=${encodeURIComponent(name)}`;
        }

        async function fetchMembersImageDB() {
            const cacheKey = 'blm48_members_images_cache';
            const cacheStatusKey = 'blm48_members_status_cache'; 
            const cacheFullKey = 'blm48_members_stats_full_cache'; // 🌟 คีย์แคชใหม่สำหรับเก็บสถิติ
            const cacheTimeKey = 'blm48_members_images_time';
            const tenMinutes = 10 * 60 * 1000; 
            
            const cachedData = localStorage.getItem(cacheKey);
            const cachedStatus = localStorage.getItem(cacheStatusKey);
            const cachedFull = localStorage.getItem(cacheFullKey);
            const cachedTime = localStorage.getItem(cacheTimeKey);
            const now = new Date().getTime();
            
            if (cachedData && cachedStatus && cachedFull && cachedTime && (now - cachedTime < tenMinutes)) {
                memberImageMap = JSON.parse(cachedData);
                memberStatusMap = JSON.parse(cachedStatus);
                memberFullDataMap = JSON.parse(cachedFull); // 🌟 ดึงสถิติจริงจากแคช
                console.log("🚀 ดึงรูปและสถานะเมมเบอร์จาก Cache สำเร็จ");
                if(rawOshiBoardData) renderContent(rawOshiBoardData);
                return;
            }

            try {
                const members = await blm48GetRankingFull();

                let tempMap = {};
                let tempStatusMap = {};
                let tempFullMap = {}; // 🌟
                members.forEach(m => {
                    if (m.name) {
                        const key = m.name.toString().trim().toLowerCase();
                        tempMap[key] = m.profile_img || "";
                        const currentStatus = m.status || "";
                        tempStatusMap[key] = currentStatus.toString().trim().toLowerCase() === "graduated" ? "graduated" : "active";
                        
                        // 🌟 บันทึกสถิติตัวเลขจากหลังบ้านลงกล่องความจำชั่วคราว
                        tempFullMap[key] = {
                            total_kami: Number(m.total_kami) || 0,
                            total_oshi: Number(m.total_oshi) || 0,
                            all_time_total: Number(m.all_time_total) || 0
                        };
                    }
                });
                
                memberImageMap = tempMap;
                memberStatusMap = tempStatusMap;
                memberFullDataMap = tempFullMap; // 🌟
                
                localStorage.setItem(cacheKey, JSON.stringify(tempMap));
                localStorage.setItem(cacheStatusKey, JSON.stringify(tempStatusMap));
                localStorage.setItem(cacheFullKey, JSON.stringify(tempFullMap)); // 🌟 เซฟตัวเลขลงเบราว์เซอร์
                localStorage.setItem(cacheTimeKey, now.toString());
                
                if(rawOshiBoardData) renderContent(rawOshiBoardData);
                
            } catch (err) {
                console.error("เรียกฐานข้อมูลรูปภาพไม่สำเร็จ", err);
            }
        }

        // 📇 ดึงชื่อจริง (Full Name EN) ของเมมเบอร์ทุกคน - โชว์จากแคชก่อนแล้วค่อยอัปเดตเงียบๆ
        async function fetchMembersFullNames() {
            const cacheKey = 'blm48_members_fullname_cache';
            const groupCacheKey = 'blm48_members_group_cache';
            try {
                const cached = localStorage.getItem(cacheKey);
                if (cached) memberFullNameMap = JSON.parse(cached);
                const cachedGroup = localStorage.getItem(groupCacheKey);
                if (cachedGroup) memberGroupMap = JSON.parse(cachedGroup);
            } catch (e) {}

            try {
                const res = await blm48GetAllMembers();
                if (res && res.status === "success" && Array.isArray(res.data)) {
                    const tempMap = {};
                    const tempGroupMap = {};
                    res.data.forEach(m => {
                        if (!m.name) return;
                        const key = m.name.toString().trim().toLowerCase();
                        const fullName = m['Full Name(EN)'] || m.full_name || '';
                        if (fullName) tempMap[key] = fullName.toString().trim();
                        tempGroupMap[key] = (m.group_name || 'BLM48').toString().trim().toUpperCase();
                    });
                    memberFullNameMap = tempMap;
                    memberGroupMap = tempGroupMap;
                    localStorage.setItem(cacheKey, JSON.stringify(tempMap));
                    localStorage.setItem(groupCacheKey, JSON.stringify(tempGroupMap));
                    if (rawOshiBoardData) renderContent(rawOshiBoardData);
                }
            } catch (err) {
                console.error("เรียกชื่อจริงเมมเบอร์ไม่สำเร็จ", err);
            }
        }

/**
 * ฟังก์ชันปิดหน้าจอโหลดวงกลมคุกกี้หมุนๆ แบบปลอดภัย
 */
function hideThemeLoadingScreen() {
  const appLoading = document.getElementById('app-loading-screen');
  if (appLoading) appLoading.style.display = 'none';
}

        function renderContent(data) {
            const kamiArea = document.getElementById('kami-content-area');
            const oshiArea = document.getElementById('oshi-content-area');
            if (!kamiArea || !oshiArea) return;

            const clearBrokenImg = "this.onerror=null; this.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';";
            
            if (!memberImageMap || Object.keys(memberImageMap).length === 0) {
                const imgCache = localStorage.getItem('blm48_members_images_cache');
                const statusCache = localStorage.getItem('blm48_members_status_cache');
                const fullCache = localStorage.getItem('blm48_members_stats_full_cache'); // 🌟
                if (imgCache) memberImageMap = JSON.parse(imgCache);
                if (statusCache) memberStatusMap = JSON.parse(statusCache);
                if (fullCache) memberFullDataMap = JSON.parse(fullCache); // 🌟
            }
            if (Object.keys(memberFullNameMap).length === 0) {
                try { memberFullNameMap = JSON.parse(localStorage.getItem('blm48_members_fullname_cache')) || {}; } catch (e) {}
                try { memberGroupMap = JSON.parse(localStorage.getItem('blm48_members_group_cache')) || {}; } catch (e) {}
            }

            // 👑 เรนเดอร์ คามิโอชิหลัก (Kami-Oshi) + เปลี่ยนเป็นเรียก openMemberProfile
            let kamiHTML = "";
            if (data.kamioshi) {
                const kamiName = data.kamioshi.toString().trim();
                const kamiKey = kamiName.toLowerCase();
                const rawImg = memberImageMap[kamiKey] || "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
                const isGraduated = memberStatusMap[kamiKey] === "graduated";
                
                const kamiFullName = memberFullNameMap[kamiKey] || '';

                kamiHTML = `
                    <div class="kami-container">
                        <button type="button" class="btn-remove-x" aria-label="ลบคามิโอชิ" onclick="executeDeleteAction('kami', '${escapeAttr(kamiName)}')">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                        <a href="javascript:void(0);" onclick="openMemberProfile('${escapeAttr(kamiName)}', '${escapeAttr(getImg(rawImg))}', '${isGraduated ? 'Graduated' : 'Active'}')" class="member-profile-link">
                            <div class="kami-avatar-frame">
                                <img src="${getImg(rawImg)}" class="kami-img" style="--group-color: ${getGroupColor(kamiKey)};" alt="${escapeAttr(kamiName)}" loading="lazy" onerror="${clearBrokenImg}">
                                ${isGraduated ? `<div class="kami-grad-cap"><i class="fa-solid fa-graduation-cap"></i></div>` : ''}
                            </div>
                            <span class="kami-days-badge"><i class="fa-solid fa-crown"></i> Kami-Oshi ${Number(data.kamioshiDays) || 1} Days</span>
                            <div class="kami-title-name">${escapeHtml(kamiName)}${isGraduated ? ` <span class="badge-graduated">GRADUATED</span>` : ''}</div>
                            ${kamiFullName ? `<div class="kami-fullname">${escapeHtml(kamiFullName)}</div>` : ''}
                        </a>
                    </div>`;
            } else {
                kamiHTML = `<div class="empty-heart-state">คุณยังไม่ได้เลือกคามิโอชิ</div>`;
            }

            // ❤️ เรนเดอร์ โอชิสมทบ (Oshi) + เปลี่ยนเป็นเรียก openMemberProfile
            let oshiHTML = "";
            // 🔤 เรียงชื่อ Oshi ตามตัวอักษร (ไม่สนตัวพิมพ์เล็ก-ใหญ่) ไม่ใช่ตามลำดับที่กดเลือกไว้เหมือนเดิม
            const processedOshis = [...(data.oshi || [])]
                .filter(o => o.toLowerCase() !== (data.kamioshi || "").toLowerCase())
                .sort((a, b) => a.localeCompare(b, 'th', { sensitivity: 'base' }));

            if (processedOshis.length > 0) {
                processedOshis.forEach(oshiName => {
                    const oshiKey = oshiName.toString().trim().toLowerCase();
                    const rawImg = memberImageMap[oshiKey] || "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
                    const isGraduated = memberStatusMap[oshiKey] === "graduated";
                    
                    const oshiFullName = memberFullNameMap[oshiKey] || '';

                    oshiHTML += `
                        <div class="oshi-box-card">
                            <a href="javascript:void(0);" onclick="openMemberProfile('${escapeAttr(oshiName)}', '${escapeAttr(getImg(rawImg))}', '${isGraduated ? 'Graduated' : 'Active'}')" class="oshi-card-link">
                                <div class="oshi-pic-wrapper">
                                    <img src="${getImg(rawImg)}" class="oshi-pic" style="--group-color: ${getGroupColor(oshiKey)};" alt="${escapeAttr(oshiName)}" loading="lazy" onerror="${clearBrokenImg}">
                                    ${isGraduated ? `<div class="oshi-grad-cap"><i class="fa-solid fa-graduation-cap"></i></div>` : ''}
                                </div>
                                <div class="oshi-info-center">
                                    <div class="oshi-name-wrapper">
                                        <div class="oshi-display-name">${escapeHtml(oshiName)}</div>
                                        ${isGraduated ? `<span class="badge-graduated">GRADUATED</span>` : ''}
                                    </div>
                                    ${oshiFullName ? `<div class="oshi-fullname">${escapeHtml(oshiFullName)}</div>` : ''}
                                </div>
                            </a>
                            <span class="badge-oshi"><i class="fa-solid fa-check"></i> Oshi</span>
                            <button type="button" class="btn-remove-x" aria-label="ลบโอชิ" onclick="executeDeleteAction('oshi', '${escapeAttr(oshiName)}')">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>`;
                });
            } else {
                oshiHTML = `<div class="empty-heart-state">คุณยังไม่ได้เลือกโอชิ</div>`;
            }

            kamiArea.innerHTML = kamiHTML;
            oshiArea.innerHTML = oshiHTML;
        }

        function fetchAndRenderUserOshiBoard() {
            const kamiArea = document.getElementById('kami-content-area');
            const oshiArea = document.getElementById('oshi-content-area');
            
            const currentUsername = user ? user.username : "";
            const cacheKey = `blm48_oshi_board_cache_${currentUsername}`;
            const cachedDataStr = localStorage.getItem(cacheKey);
            let hasCache = false;

            if (cachedDataStr) {
                try {
                    const cachedData = JSON.parse(cachedDataStr);
                    if (cachedData) {
                        rawOshiBoardData = cachedData;
                        renderContent(cachedData);
                        hasCache = true;
                    }
                } catch (e) {
                    console.error("เกิดข้อผิดพลาดในการดึงข้อมูลแคชบอร์ด:", e);
                }
            }

            if (!hasCache) {
                kamiArea.innerHTML = `
                    <div class="kami-container skeleton-card">
                        <div class="kami-avatar-frame skeleton-circle"></div>
                        <div class="skeleton-text" style="width: 100px; margin: 8px auto;"></div>
                    </div>`;
                    
                oshiArea.innerHTML = Array(4).fill(0).map(() => `
                    <div class="oshi-box-card skeleton-card">
                        <div class="skeleton-circle" style="width:54px; height:54px; flex-shrink:0;"></div>
                        <div class="oshi-info-center">
                            <div class="skeleton-text" style="width: 80px; margin-bottom: 6px;"></div>
                            <div class="skeleton-text" style="width: 50px; height: 10px;"></div>
                        </div>
                    </div>`).join('');
            }

            blm48GetUserInfo(currentUsername)
                .then(res => {
                    if (res.status === "success" && res.data) {
                        localStorage.setItem(cacheKey, JSON.stringify(res.data));
                        rawOshiBoardData = res.data;
                        renderContent(res.data);
                    }
                })
                .catch(err => {
                    console.error("Error loading user oshi board from server:", err);
                    if (!hasCache) {
                        kamiArea.innerHTML = `<div class="empty-heart-state" style="color:var(--danger-red);">โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรชอีกครั้ง</div>`;
                        oshiArea.innerHTML = "";
                    }
                });
        }
        
        async function executeDeleteAction(type, memberName) {
            const typeText = type === 'kami' ? 'คามิโอชิหลัก' : 'โอชิ';
            const confirm = await Swal.fire({
                title: 'ยืนยันการลบข้อมูล?',
                text: `คุณต้องการจะลบ ${memberName} ออกจาก ${typeText}?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: 'var(--primary-pink)',
                cancelButtonColor: '#ccc',
                confirmButtonText: 'ใช่, ลบออกเลย',
                cancelButtonText: 'ยกเลิก'
            });

            if (!confirm.isConfirmed) return;

            Swal.fire({ title: 'กำลังอัพเดทข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            try {
                const res = await blm48RemoveOshi(currentUsername, type, memberName);
                if (res.status === "success") {
                    Swal.fire('สำเร็จ!', 'ระบบลบรายชื่อออกจากโอชิเรียบร้อยแล้วค่ะ', 'success');
                    fetchAndRenderUserOshiBoard(); 
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', res.message || 'ไม่สามารถลบข้อมูลได้', 'error');
                }
            } catch (err) {
                Swal.fire('ล้มเหลว!', 'ระบบติดต่อตารางข้อมูลขัดข้อง กรุณาลองอีกครั้งนะงับ', 'error');
            }
        }

</script>
</body>
</html>
