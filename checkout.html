<!DOCTYPE html>
<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>BLM48 Membership | Check Out</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/shop-orders.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>
    <style>
        .order-total-band { background: #fff8ea; padding: 16px 12px; border-bottom: 1px solid var(--order-line); }
        .order-total-band .summary-row { font-size: 15px; color: #666; }
        .order-total-band .summary-value { color: var(--order-accent); font-weight: 700; }
        .checkout-note { padding: 16px 12px; font-size: 14px; color: #777; line-height: 1.6; border-bottom: 1px solid var(--order-line); }

        .pay-option {
            display: flex; align-items: center; gap: 14px; padding: 14px 0; cursor: default;
        }
        .pay-icon {
            width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
            background: #fff4d6; color: #c9932c; display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .pay-info { flex: 1; min-width: 0; }
        .pay-name { font-size: 15.5px; color: #333; }
        .pay-balance { font-size: 13px; color: var(--order-muted); margin-top: 2px; }
        .pay-balance.is-short { color: #d64545; }
        .pay-radio {
            width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--order-accent); flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .pay-radio::after { content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--order-accent); }
        .redeem-hint { font-size: 13px; color: var(--order-muted); text-align: center; padding: 16px 20px; line-height: 1.6; }
    </style>
</head>
<body class="has-bottom-bar">

<div class="top-navigation-bar">
    <button type="button" class="nav-back-btn" onclick="history.back()" aria-label="ย้อนกลับ"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="top-bar-page-title">Check Out</div>
</div>

<div class="page-wrapper">
    <div id="checkout-lines"></div>

    <div class="order-total-band">
        <div class="summary-row"><span>Order Total</span><span class="summary-value" id="order-total">0 Tokens</span></div>
    </div>

    <div class="checkout-note">
        Tokens are deducted as soon as you place the order. Your items wait in <b>My Order</b> until you press <b>Redeem</b> &mdash; pre-order items become redeemable once they ship.
    </div>

    <div class="section">
        <div class="section-heading">Payment Option</div>
        <div class="pay-option">
            <div class="pay-icon"><i class="fas fa-coins"></i></div>
            <div class="pay-info">
                <div class="pay-name">Token Wallet</div>
                <div class="pay-balance" id="pay-balance">Balance: -</div>
            </div>
            <div class="pay-radio" aria-label="เลือกแล้ว"></div>
        </div>
    </div>

    <div class="inline-error" id="checkout-error"></div>
</div>

<div class="bottom-bar">
    <div class="bottom-bar-inner">
        <div class="bottom-total">
            <div class="bottom-total-label">Total</div>
            <div class="bottom-total-value" id="bottom-total">0 Tokens</div>
        </div>
        <button type="button" class="btn-yellow" id="btn-place" onclick="placeOrder()">Place Order</button>
    </div>
</div>

<script>
  let user = null;
  let placing = false;

  function formatTokens(n) {
    return Number(n || 0).toLocaleString() + ' Tokens';
  }

  function showError(msg) {
    const el = document.getElementById('checkout-error');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
    if (msg) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function render() {
    const lines = blm48Cart.get();
    if (lines.length === 0) {
      window.location.replace('cart');
      return;
    }
    const total = blm48Cart.total();
    document.getElementById('checkout-lines').innerHTML = lines.map(l => `
      <div class="order-line">
        <img class="order-line-thumb" src="${escapeHtml(l.image || '')}" alt="" onerror="this.onerror=null;this.src='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='">
        <div class="order-line-body">
          <div class="order-line-name">${escapeHtml(l.name)}</div>
          ${l.label ? `<div class="order-line-label">${escapeHtml(l.label)}</div>` : ''}
          <div class="order-line-bottom">
            <div class="order-line-qty">${Number(l.unitPrice || 0).toLocaleString()} Tokens</div>
            <div class="order-line-qty">X${l.quantity}</div>
          </div>
        </div>
      </div>`).join('');
    document.getElementById('order-total').textContent = formatTokens(total);
    document.getElementById('bottom-total').textContent = formatTokens(total);

    const balance = Number(user.token || 0);
    const balanceEl = document.getElementById('pay-balance');
    const short = balance < total;
    balanceEl.textContent = short
      ? `Balance: ${balance.toLocaleString()} Tokens · not enough`
      : `Balance: ${balance.toLocaleString()} Tokens`;
    balanceEl.classList.toggle('is-short', short);
    document.getElementById('btn-place').disabled = short || placing;
  }

  async function refreshBalance() {
    try {
      const res = await blm48GetUserInfo(user.username);
      if (res && res.status === 'success' && res.data) {
        user = Object.assign(user, res.data);
        saveUserSession(user);
        render();
      }
    } catch (e) { /* keep the cached balance */ }
  }

  async function placeOrder() {
    if (placing) return;
    const lines = blm48Cart.get();
    if (lines.length === 0) return;
    placing = true;
    showError('');
    const btn = document.getElementById('btn-place');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing';

    const items = lines.map(l => ({ kind: l.kind, refId: String(l.refId), variant: l.variant || 1, quantity: l.quantity }));
    const res = await blm48ShopCheckout(user.username, items);

    if (res && res.status === 'success') {
      blm48Cart.clear();
      user.token = res.newToken;
      saveUserSession(user);
      window.location.replace('payment?order=' + encodeURIComponent(res.orderId));
      return;
    }

    placing = false;
    btn.innerHTML = 'Place Order';
    showError((res && res.message) || 'ทำรายการไม่สำเร็จ กรุณาลองใหม่อีกครั้งค่ะ');
    render();
  }

  window.addEventListener('DOMContentLoaded', () => {
    user = getUserSession();
    if (!user) { window.location.href = 'login'; return; }
    render();
    refreshBalance();
  });
</script>
</body>
</html>
