<!DOCTYPE html>
<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
        <script src="assets/js/back-nav.js"></script>
<title>BLM48 Membership | ประวัติการโอน</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffc0cb">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s192">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>

    <style>
        :root {
            --primary-pink: #ff85a2;
            --soft-pink: #ffe4e1;
            --card-border: #ffeef2;
            --text-dark: #444;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Quicksand', 'Kanit', sans-serif; margin: 0; padding: 0; min-height: 100vh; color: var(--text-dark); background: #ffffff; }

        .top-navigation-bar {
            display: flex; align-items: center; gap: 12px;
            background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(var(--glass-blur-lg));
            backdrop-filter: blur(var(--glass-blur-lg));
            padding: 14px 16px; border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100; box-shadow: var(--glass-shadow-sm);
        }
        .back-circle-btn {
            flex: 0 0 auto; background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(var(--glass-blur-sm));
            backdrop-filter: blur(var(--glass-blur-sm));
            border: 1px solid var(--glass-border);
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary-pink); cursor: pointer; transition: 0.2s;
        }
        .back-circle-btn:hover { background: var(--primary-pink); color: white; transform: scale(1.05); }
        .top-bar-title { font-family: 'Quicksand', 'Kanit', sans-serif; font-weight: 600; font-size: 16px; color: #333; }

        .page-wrapper { max-width: 640px; margin: 0 auto; padding: 18px 12px 50px; }
        @media (min-width: 768px) { .page-wrapper { max-width: 760px; padding: 24px 24px 60px; } }

        .header-title-zone { text-align: center; margin-bottom: 20px; }
        .header-title-zone h1 { color: var(--primary-pink); font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 24px; margin: 0 0 6px 0; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header-title-zone p { color: #767676; font-size: 13px; margin: 0; }

        .entry-list { display: flex; flex-direction: column; gap: 10px; }
        .entry-row {
            display: flex; align-items: center; gap: 12px;
            background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(var(--glass-blur));
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 12px 14px;
            box-shadow: var(--glass-shadow-sm);
        }
        .entry-body { flex: 1; min-width: 0; }
        .entry-title { font-weight: 700; font-size: 13.5px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .entry-subtitle { font-size: 11.5px; color: #767676; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .entry-amounts { font-size: 13px; margin-top: 4px; display: flex; gap: 10px; }
        .entry-amounts i { margin-right: 3px; }
        .btn-pill {
            flex: 0 0 auto; border: none; border-radius: 20px; font-size: 12px; font-weight: 600;
            padding: 8px 14px; cursor: pointer; white-space: nowrap;
            background: #fff8e1; color: #8a6d00;
        }

        .empty-state { text-align: center; color: #767676; font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 13px; padding: 40px 20px; }
        .empty-state i { font-size: 28px; color: #ffd7e1; display: block; margin-bottom: 10px; }
        .loading-state { text-align: center; color: #767676; font-size: 13px; padding: 30px 20px; }

        #access-denied { display: none; text-align: center; padding: 80px 20px; color: #767676; }
        #access-denied i { font-size: 40px; color: #ffd7e1; display: block; margin-bottom: 14px; }
        #page-content { display: none; }
    </style>
    <link rel="stylesheet" href="assets/css/admin-theme.css">
</head>
<body>

<div class="top-navigation-bar">
    <button type="button" class="back-circle-btn" onclick="goBack()" aria-label="ย้อนกลับ">
        <i class="fa-solid fa-chevron-left"></i>
    </button>
    <div class="top-bar-title">ประวัติการโอน</div>
</div>

<div class="page-wrapper">
    <div id="access-denied">
        <i class="fa-solid fa-lock"></i>
        หน้านี้สำหรับ Role Admin เท่านั้นค่ะ
    </div>

    <div id="page-content">
        <div class="header-title-zone">
            <h1><i class="fa-solid fa-receipt"></i> ประวัติการโอน</h1>
            <p>ประวัติการโอน Token / Cookie / GEToken ทั้งหมดโดยแอดมิน</p>
        </div>

        <input id="search" class="adm-search" type="search" placeholder="ค้นหาชื่อ, Username, Wallet Code, เลขอ้างอิง หรือแอดมิน..." oninput="renderHistory()">
        <div class="adm-chips" id="chips"></div>
        <div id="summary"></div>
        <div class="entry-list" id="history-list">
            <div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดข้อมูล...</div>
        </div>
    </div>
</div>

<script>
  let user = null;
  let historyCache = [];

  function goBack() {
    blm48Back('admin');
  }

  function resolveDriveImage(url) {
    const fallback = 'https://lh3.googleusercontent.com/d/1rebp2F8vyP0nyvsEOFD9Nw2mPcRtVqtG=s1000';
    if (!url) return fallback;
    if (url.includes('drive.google.com')) {
      const driveMatch = url.match(/[-\w]{25,}/);
      return driveMatch ? `https://lh3.googleusercontent.com/u/0/d/${driveMatch[0]}` : url;
    }
    return url;
  }

  async function loadHistory() {
    const list = document.getElementById('history-list');
    try {
      const res = await blm48AdminGetTransferHistory(user.username);
      if (res.status !== 'success') {
        list.innerHTML = `<div class="empty-state">โหลดข้อมูลไม่สำเร็จ</div>`;
        return;
      }
      historyCache = res.data || [];
      renderHistory();
    } catch (e) {
      list.innerHTML = `<div class="empty-state">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</div>`;
    }
  }

  // ช่วงเวลา (เวลาไทย) - จำไว้ในแท็บนี้
  const RANGES = [['today', 'วันนี้', 0], ['7d', '7 วัน', 7], ['30d', '30 วัน', 30], ['all', 'ทั้งหมด', null]];
  let range = 'all';
  try { range = sessionStorage.getItem('adminTransferRange') || 'all'; } catch (e) {}
  if (!RANGES.some(([k]) => k === range)) range = 'all';
  const thDay = d => new Date(d).toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' }); // YYYY-MM-DD

  function inRange(log, days) {
    if (days == null) return true;
    const today = new Date(thDay(Date.now()) + 'T00:00:00');
    const day = new Date(thDay(log.created_at) + 'T00:00:00');
    return (today - day) / 86400000 <= days;
  }

  function setRange(k) {
    range = k;
    try { sessionStorage.setItem('adminTransferRange', k); } catch (e) {}
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    if (historyCache.length === 0) {
      list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-receipt"></i>ยังไม่มีประวัติการโอน</div>`;
      return;
    }
    const q = document.getElementById('search').value.trim().toLowerCase();
    const match = log => !q || [log.target_name, log.target_username, log.target_wallet_code ? 'blm-' + log.target_wallet_code : '', log.ref_no, log.admin_username]
      .some(v => String(v || '').toLowerCase().includes(q));
    document.getElementById('chips').innerHTML = RANGES.map(([k, label, days]) =>
      `<button type="button" class="adm-chip ${k === range ? 'active' : ''}" onclick="setRange('${k}')">${label}<span class="n">${historyCache.filter(l => match(l) && inRange(l, days)).length}</span></button>`).join('');
    const days = RANGES.find(([k]) => k === range)[2];
    const rows = historyCache.map((log, i) => ({ log, i })).filter(({ log }) => match(log) && inRange(log, days));
    // สรุปยอดรวมของรายการที่เห็น
    const sum = k => rows.reduce((t, { log }) => t + Number(log[k] || 0), 0).toLocaleString();
    document.getElementById('summary').innerHTML = rows.length ? `<div class="adm-summary">
        <span><b>${rows.length.toLocaleString()}</b> รายการ</span>
        <span><i class="fas fa-coins" style="color:#f59f00;"></i><b>${sum('token')}</b></span>
        <span><i class="fas fa-cookie-bite" style="color:#d2691e;"></i><b>${sum('cookie')}</b></span>
        <span><i class="fas fa-gem" style="color:#4dabf7;"></i><b>${sum('ge_token')}</b></span>
      </div>` : '';
    if (!rows.length) { list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-magnifying-glass"></i>ไม่พบรายการ</div>`; return; }
    let lastDay = '';
    list.innerHTML = rows.map(({ log, i }) => {
      // หัววันที่ ทุกครั้งที่ขึ้นวันใหม่
      const day = thDay(log.created_at);
      const head = day !== lastDay ? `<div class="adm-day">${new Date(log.created_at).toLocaleDateString('th-TH', { timeZone: 'Asia/Bangkok', weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}</div>` : '';
      lastDay = day;
      return head + rowHtml(log, i);
    }).join('');
  }

  function rowHtml(log, i) {
      const parts = [];
      if (log.token > 0) parts.push(`<span><i class="fas fa-coins" style="color:#f59f00;"></i>${Number(log.token).toLocaleString()}</span>`);
      if (log.cookie > 0) parts.push(`<span><i class="fas fa-cookie-bite" style="color:#d2691e;"></i>${Number(log.cookie).toLocaleString()}</span>`);
      if (log.ge_token > 0) parts.push(`<span><i class="fas fa-gem" style="color:#4dabf7;"></i>${Number(log.ge_token).toLocaleString()}</span>`);
      const dt = new Date(log.created_at).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
      return `
        <div class="entry-row">
          <img class="entry-avatar" style="width:42px;height:42px;border-radius:50%;object-fit:cover;background:#f3f3f3;flex:0 0 auto;" src="${escapeAttr(resolveDriveImage(log.target_profile_img))}">
          <div class="entry-body">
            <div class="entry-title">${escapeHtml(log.target_name || log.target_username)} <span style="color:#767676; font-weight:400;">@${escapeHtml(log.target_username)}</span></div>
            ${log.target_wallet_code ? `<div class="entry-subtitle"><i class="fas fa-wallet" style="color:#ffc107;"></i> Wallet Code: <b style="color:#555;">BLM-${escapeHtml(log.target_wallet_code)}</b></div>` : ''}
            <div class="entry-subtitle">โดย ${escapeHtml(log.admin_username)} · ${dt}</div>
            <div class="entry-amounts">${parts.join(' ')}</div>
          </div>
          <button class="btn-pill" onclick="reopenSlip(${i})"><i class="fas fa-receipt"></i> ดูสลิป</button>
        </div>
      `;
  }

  function reopenSlip(index) {
    const log = historyCache[index];
    if (!log) return;
    generateTransferSlip({
      admin: log.admin_username,
      adminName: log.admin_username,
      adminAvatar: log.admin_profile_img,
      target: { username: log.target_username, name: log.target_name, role: log.target_role, profile_img: log.target_profile_img },
      token: Number(log.token) || 0,
      cookie: Number(log.cookie) || 0,
      getoken: Number(log.ge_token) || 0,
      refNo: log.ref_no,
      createdAt: log.created_at
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    user = getUserSession();
    if (!user) {
      window.location.href = 'login';
      return;
    }
    if (!(user.is_admin === true || (user.role && user.role.toLowerCase() === 'admin'))) {
      document.getElementById('access-denied').style.display = 'block';
      return;
    }
    document.getElementById('page-content').style.display = 'block';
    loadHistory();
  });
</script>
</body>
</html>
