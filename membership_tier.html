<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
        <script src="assets/js/back-nav.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLM48 | Membership Tier</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Quicksand', 'Kanit', sans-serif;
            color: #222; margin: 0; padding: 0; padding-top: 60px;
        }
        body.glass-mesh-bg { background-color: #ffffff; background-image: none; }

        /* แถบบนขาว: ปุ่มย้อนกลับซ้าย + ชื่อหน้าตรงกลาง */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: #ffffff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .top-navbar .back-btn {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            background: none; border: none; color: #333; font-size: 20px; cursor: pointer;
        }
        .top-navbar h1 { margin: 0; font-size: 17px; font-weight: 600; color: #222; }

        /* 🏅 แบนเนอร์ = รูปบัตร Membership Card ของ Tier ปัจจุบัน (Member ใช้บัตรเมมเบอร์) เต็มความกว้างจอ */
        .tier-hero { width: 100%; background: #f6f6f6; }
        .tier-hero img {
            display: block; width: 100%; max-width: 640px; margin: 0 auto; aspect-ratio: 1000 / 571; object-fit: cover;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; pointer-events: none;
        }

        .score-line { text-align: center; font-size: 14.5px; color: #333; margin: 22px 12px 4px; }
        .score-line b { font-weight: 700; }
        .score-next { text-align: center; font-size: 12.5px; color: #999; margin: 0 12px; min-height: 18px; }

        .benefits-title { text-align: center; font-size: 22px; font-weight: 700; margin: 34px 0 18px; }

        /* แท็บ Copper / Silver / Gold (ขีดเหลืองใต้แท็บที่เลือก) */
        .tier-tabs { display: flex; gap: 6px; border-top: 1px solid #ececec; border-bottom: 1px solid #ececec; padding: 0 12px; }
        .tier-tab {
            background: none; border: none; padding: 16px 18px 14px; font-family: inherit; font-size: 16px; font-weight: 700;
            color: #c4c4c4; cursor: pointer;
        }
        .tier-tab span { position: relative; z-index: 0; }
        .tier-tab.active { color: #222; }
        .tier-tab.active span::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 5px; border-radius: 3px;
            background: #ffd75e; z-index: -1;
        }

        .tier-detail { max-width: 640px; margin: 0 auto; padding: 22px 12px 40px; font-size: 14px; line-height: 1.75; color: #333; }
        .tier-detail h3 { font-size: 15px; font-weight: 700; margin: 0 0 12px; color: #222; }
        .tier-detail h4 { font-size: 14px; font-weight: 700; margin: 18px 0 8px; color: #222; }
        .tier-detail p { margin: 0 0 6px; }
        .tier-detail ul { margin: 0; padding-left: 0; list-style: none; }
        .tier-detail li { margin-bottom: 8px; padding-left: 14px; position: relative; }
        .tier-detail li::before { content: '•'; position: absolute; left: 0; }
        .tier-current-note { display: inline-block; font-size: 11px; font-weight: 600; color: #222; background: #ffd75e; padding: 2px 10px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
        .note { font-size: 12.5px; color: #888; margin-top: 22px; line-height: 1.75; text-align: justify; }
    </style>
</head>
<body class="glass-mesh-bg">

<div class="top-navbar">
    <button class="back-btn" type="button" onclick="goBack()" aria-label="ย้อนกลับ"><i class="fas fa-chevron-left"></i></button>
    <h1>Status</h1>
</div>

<div class="tier-hero">
    <img id="tier-hero-img" alt="" draggable="false" oncontextmenu="return false">
</div>

<div class="score-line" id="score-line">&nbsp;</div>
<div class="score-next" id="score-next"></div>

<div class="benefits-title">Your Benefits</div>
<div class="tier-tabs" id="tier-tabs"></div>
<div class="tier-detail" id="tier-detail"></div>

<script>
    const username = getUsernameFromSession();

    // --- ข้อมูล BLM48 Membership Tier (Copper/Silver/Gold ตาม Fan Score สะสม) ---
    const TIER_INFO_LIST = [
        {
            key: 'copper', label: 'Copper', name: 'Copper Tier', min: 0,
            condition: 'ทุกบัญชีจะได้รับ Copper Tier ตั้งแต่วันที่เปิดใช้งานบัญชี และคงระดับนี้ไว้เมื่อมี Fan Score สะสมต่ำกว่า 5,000',
            benefits: [
                'ได้รับ Copper Membership Card ประจำตัว',
                'รับคุกกี้รายเดือนที่ระดับ Copper 150 Cookies ผ่านปุ่ม "รับคุกกี้รายเดือน" ในหน้าโปรไฟล์'
            ]
        },
        {
            key: 'silver', label: 'Silver', name: 'Silver Tier', min: 5000,
            condition: 'ได้รับสถานะ Silver Tier เมื่อมี Fan Score สะสมตั้งแต่ 5,000 แต่ไม่ถึง 10,000',
            benefits: [
                'ได้รับ Silver Membership Card ประจำตัว',
                'รับคุกกี้รายเดือนที่ระดับ Silver 300 Cookies ผ่านปุ่ม "รับคุกกี้รายเดือน" ในหน้าโปรไฟล์'
            ]
        },
        {
            key: 'gold', label: 'Gold', name: 'Gold Tier', min: 10000,
            condition: 'ได้รับสถานะ Gold Tier เมื่อมี Fan Score สะสมตั้งแต่ 10,000 ขึ้นไป',
            benefits: [
                'ได้รับ Gold Membership Card ประจำตัว',
                'รับคุกกี้รายเดือนที่ระดับ Gold 500 Cookies ผ่านปุ่ม "รับคุกกี้รายเดือน" ในหน้าโปรไฟล์'
            ]
        }
    ];
    const NOTE_TEXT = 'หมายเหตุ: สิทธิพิเศษของแต่ละ Tier ใน BLM48 Membership Tier รวมทั้งเงื่อนไขและอัตราการคำนวณ อาจมีการปรับเปลี่ยนตามความเหมาะสม โดยทีมงาน BLM48 จะประกาศการเปลี่ยนแปลงล่วงหน้าผ่านแอปพลิเคชัน BLM48 Membership ก่อนมีผลบังคับใช้';

    // รูปบัตรชุดเดียวกับหน้า membership_card.html
    const TIER_CARD_IMAGES = {
        member: 'https://lh3.googleusercontent.com/d/1z1rqVAMbE6a0-i-A_9W-PfErg0V8RSqy=s1000',
        copper: 'https://lh3.googleusercontent.com/d/1ZlMrb8p1Du8-KITKpVlYt7E1H1aBGlC8=s1000',
        silver: 'https://lh3.googleusercontent.com/d/1byHhVpGymz84M2MDHE30ewJVNNSFTYcI=s1000',
        gold: 'https://lh3.googleusercontent.com/d/18ag8mAELvjn4IQQvboOxAXfB_PddYO17=s1000'
    };

    let currentTier = null;   // Tier ของบัญชีนี้ (null = Member หรือยังโหลดไม่เสร็จ)
    let activeTab = 'copper';

    function goBack() {
        blm48Back('majorvote');
    }

    function renderHero(key) {
        const img = document.getElementById('tier-hero-img');
        img.src = TIER_CARD_IMAGES[key] || TIER_CARD_IMAGES.copper;
        img.alt = key === 'member' ? 'Member Card' : key.charAt(0).toUpperCase() + key.slice(1) + ' Membership Card';
    }

    function renderTabs() {
        document.getElementById('tier-tabs').innerHTML = TIER_INFO_LIST.map(t =>
            `<button type="button" class="tier-tab ${t.key === activeTab ? 'active' : ''}" onclick="selectTab('${t.key}')"><span>${t.label}</span></button>`
        ).join('');
        const t = TIER_INFO_LIST.find(x => x.key === activeTab);
        document.getElementById('tier-detail').innerHTML = `
            <h3>${t.name}${t.key === currentTier ? '<span class="tier-current-note">Tier ปัจจุบัน</span>' : ''}</h3>
            <p>${t.condition}</p>
            <h4>สิทธิพิเศษ</h4>
            <ul>${t.benefits.map(b => `<li>${b}</li>`).join('')}</ul>
            <p class="note">${NOTE_TEXT}</p>
        `;
    }

    function selectTab(key) { activeTab = key; renderTabs(); }

    // Fan Score + ระยะห่างถึง Tier ถัดไป
    function renderScore(fanScore) {
        const score = Number(fanScore) || 0;
        document.getElementById('score-line').innerHTML = `Your Fan Score <b>${score.toLocaleString()}</b>`;
        const next = TIER_INFO_LIST.find(t => t.min > score);
        document.getElementById('score-next').textContent = next
            ? `อีก ${(next.min - score).toLocaleString()} Fan Score จะได้ ${next.name}`
            : 'คุณอยู่ระดับสูงสุดแล้ว';
    }

    // แบนเนอร์/แท็บเริ่มต้นตาม Tier ปัจจุบัน (Member ไม่มี Copper/Silver/Gold)
    async function loadCurrentTier() {
        const sessionUser = getUserSession();
        if (sessionUser && sessionUser.role && sessionUser.role.toUpperCase().trim() === 'MEMBER') {
            renderHero('member');
            document.getElementById('score-line').textContent = 'บัญชี Member ไม่มีระดับ Tier';
            return;
        }
        try {
            const res = await blm48GetMembershipTier(username);
            if (res && res.status === 'success' && res.tier) {
                currentTier = String(res.tier).toLowerCase();
                activeTab = currentTier;
                renderHero(currentTier);
                renderScore(res.fanScore);
                renderTabs();
                return;
            }
        } catch (e) { /* แสดงข้อมูล Tier โดยไม่มีระดับปัจจุบัน */ }
        renderHero('copper'); // โหลด Tier ไม่ได้: ใช้บัตร Copper (ระดับเริ่มต้น)
    }

    if (!username) {
        alert('กรุณาเข้าสู่ระบบก่อนใช้งาน');
        window.location.href = 'login';
    } else {
        // ยังไม่ใส่รูปบัตรจนกว่าจะรู้ Tier จริง (กัน Gold/Silver เห็นบัตร Copper แวบหนึ่ง)
        renderTabs();
        loadCurrentTier();
    }
</script>
</body>
</html>
