<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>BLM48 Membership | Fan Post</title>

    <meta name="theme-color" content="#ffc0cb">

    <style>
        :root {
            --primary-pink: #ff85a2;
            --text-dark: #444;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Quicksand', 'Kanit', sans-serif; margin: 0; padding-bottom: 110px !important; min-height: 100vh; color: var(--text-dark); }
        body.glass-mesh-bg { background-color: #ffffff; background-image: none; }

        .app-wrapper { width: 100%; min-height: 100vh; padding: 16px; max-width: 560px; margin: 0 auto; }

        .top-navigation-bar {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(var(--glass-blur-lg));
            -webkit-backdrop-filter: blur(var(--glass-blur-lg));
            border-radius: 20px; padding: 12px 18px; margin-bottom: 18px;
            border: 1px solid var(--glass-border);
        }
        .top-bar-page-title { display: flex; align-items: center; gap: 8px; font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 16px; color: var(--primary-pink); }
        .fanpost-add-btn {
            display: none;
            background: none; border: none; color: var(--primary-pink); font-size: 1.6rem; cursor: pointer;
            line-height: 1; padding: 0;
        }
        .fanpost-add-btn.open { transform: rotate(45deg); }

        .fanpost-composer-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
        }
        .fanpost-composer-title { font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 14px; color: var(--primary-pink); }
        .fanpost-composer-close { background: none; border: none; color: #999; font-size: 1.1rem; cursor: pointer; padding: 0; }

        .fanpost-composer {
            display: none;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(var(--glass-blur-lg));
            -webkit-backdrop-filter: blur(var(--glass-blur-lg));
            border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 16px; margin-bottom: 18px;
        }
        .fanpost-composer textarea {
            width: 100%; height: 90px; border: 1px solid #ffccd5; border-radius: 14px; padding: 12px;
            font-family: inherit; font-size: 0.92rem; resize: none; box-sizing: border-box;
            background-color: rgba(255,255,255,0.6);
        }
        .fanpost-composer textarea:focus { outline: none; border-color: var(--primary-pink); }
        .custom-file-upload {
            border: 2px dashed #ffccd5; color: var(--primary-pink); background-color: rgba(255,255,255,0.55);
            padding: 10px; border-radius: 14px; width: 100%; font-weight: 600; font-size: 0.85rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px;
        }
        .custom-file-upload:hover { border-color: var(--primary-pink); background-color: #fff5f7; }
        .hidden-input { display: none; }
        #fanpost-image-preview { display: flex; gap: 10px; overflow-x: auto; margin-top: 10px; padding: 4px 2px; }
        .preview-image-wrapper { position: relative; flex-shrink: 0; width: 76px; height: 76px; border-radius: 12px; border: 1px solid #ffccd5; }
        .preview-image-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 11px; }
        .img-action-overlay {
            position: absolute; top: -6px; right: -6px; background: var(--primary-pink); color: white; border-radius: 50%;
            width: 20px; height: 20px; display: flex; justify-content: center; align-items: center; font-size: 0.7rem; cursor: pointer;
        }
        .btn-submit-full {
            width: 100%; height: 44px; background-color: var(--primary-pink); color: white; border: none; border-radius: 22px;
            font-weight: 700; font-size: 0.95rem; margin-top: 12px; cursor: pointer;
        }
        .fanpost-member-note {
            display: none; text-align: center; color: #999; font-size: 0.82rem; background: #fff5f7; border-radius: 14px;
            padding: 12px; margin-bottom: 18px;
        }

        .icon-wrapper { position: relative; display: inline-flex; align-items: center; justify-content: center; }
        .noti-badge { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background-color: #ff4d6d; border-radius: 50%; border: 1px solid white; z-index: 10; }

        .comment-block-note { text-align: center; color: #bbb; font-size: 0.75rem; padding: 8px 0 2px; }

        .bottom-tab-bar {
            height: calc(110px + env(safe-area-inset-bottom, 0px));
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 999; background: transparent;
            display: flex; justify-content: space-around; align-items: flex-end;
            padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box;
            -webkit-transform: translateZ(0); transform: translateZ(0);
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
        }
        .bottom-tab-bar::before {
            content: ""; position: absolute; top: 60px; left: 0; right: 0; bottom: 0;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(var(--glass-blur-lg));
            -webkit-backdrop-filter: blur(var(--glass-blur-lg));
            border-top: 1px solid var(--glass-border);
            border-radius: 28px 28px 0 0;
            box-shadow: 0 -12px 35px rgba(0, 0, 0, 0.08);
            z-index: 1;
        }
        .tab-item {
            display: flex; justify-content: center; align-items: center; width: 20%; height: 50px;
            position: relative; z-index: 2; text-decoration: none; color: #8e8e93;
            transform: translateY(-30px);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .tab-item:active { transform: translateY(-30px) scale(0.85); opacity: 0.8; }
        .tab-item.active { color: #ffb3c1; transform: translateY(-45px); }
        .tab-item.active:active { transform: translateY(-45px) scale(0.85); }
        .tab-item.active i { font-size: 45px; }
        .tab-item.active img { width: 58px; height: 58px; }
        .tab-item.active #tab-profile-img { width: 50px !important; height: 50px !important; }
        .tab-item i { font-size: 34px; transition: font-size 0.2s ease; }
        .tab-item img { width: 44px; height: 44px; object-fit: contain; transition: width 0.2s ease, height 0.2s ease; }
        #tab-profile-img { width: 38px !important; height: 38px !important; border-radius: 50%; border: 2px solid #ffb3c1; box-sizing: border-box; transition: width 0.2s ease, height 0.2s ease; }

        .post-menu-container { position: absolute; top: 15px; right: 15px; z-index: 100; }
        .post-menu-btn { background: none; border: none; color: #bbb; font-size: 18px; cursor: pointer; padding: 6px 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .post-menu-btn:hover { background: #fff0f3; color: var(--primary-pink); }
        .post-dropdown-menu { display: none; position: absolute; right: 0; top: 32px; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); min-width: 120px; overflow: hidden; }
        .post-dropdown-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border: none; background: none; font-size: 13px; color: #666; cursor: pointer; text-align: left; }
        .post-dropdown-item:hover { background: #fff0f3; color: var(--primary-pink); }
        .post-dropdown-item.delete-item { color: #ff5c7c; }
        .post-dropdown-item.delete-item:hover { background: #fff0f2; color: #ff335c; }

        .empty-feed-state { text-align: center; color: #bbb; font-size: 0.9rem; padding: 60px 20px; }
        .empty-feed-state i { font-size: 32px; color: #ffd7e1; display: block; margin-bottom: 12px; }
    </style>
</head>
<body class="glass-mesh-bg">

<div class="app-wrapper">

        <button type="button" class="fanpost-add-btn" id="fanpost-add-btn" onclick="toggleFanPostComposer()" title="สร้างโพสต์แฟนคลับ" aria-label="สร้างโพสต์แฟนคลับ">

    <div class="fanpost-composer" id="fanpost-composer">

<script>
  let user = null;
  let isMemberRole = false; // role='member' - can like fan posts but not comment/reply on them

  function hasManagementPermission(postAuthorUsername) {
    if (!user) return false;
    const role = (user.role || '').toLowerCase();
    if (role === 'ceo' || role === 'admin') return true;
    return user.username === postAuthorUsername;
  }

  function formatThaiDate(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.trim().split(/[- :]/);
    if (parts.length < 5) return dateStr;
    const year = parseInt(parts[0]);
    const month = parseInt(parts[1]);
    const day = parseInt(parts[2]);
    const hour = parts[3];
    const min = parts[4];
    const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    const thaiYear = year + 543;
    return `${day} ${thaiMonths[month - 1]} ${thaiYear} ${hour}:${min} น.`;
  }

  function buildImagesHtml(displayImage) {
    if (!displayImage) return '';
    const imageUrls = displayImage.split(',').map(url => url.trim()).filter(url => url);
    if (imageUrls.length === 0) return '';

    const visibleImages = imageUrls.slice(0, 4);
    let imagesHtml = '';

    if (imageUrls.length === 1) {
      imagesHtml += `
        <div style="margin-top: 10px; width: 100%;">
          <img src="${imageUrls[0]}" onclick="openImageViewer(0, ['${imageUrls[0]}'])" style="width: 100%; max-height: 450px; object-fit: cover; border-radius: 12px; cursor: pointer; display: block; margin: 0 auto;">
        </div>
      `;
    } else if (imageUrls.length === 3) {
      const allUrlsJs = imageUrls.map(u => `'${u}'`).join(',');
      imagesHtml += `<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px;">`;
      imagesHtml += `<div style="grid-column: 1 / span 2; position: relative; aspect-ratio: 16 / 10;">
        <img src="${imageUrls[0]}" onclick="openImageViewer(0, [${allUrlsJs}])" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px !important; cursor: pointer;">
      </div>`;
      [1, 2].forEach(index => {
        imagesHtml += `<div style="position: relative; aspect-ratio: 1 / 1;">
          <img src="${imageUrls[index]}" onclick="openImageViewer(${index}, [${allUrlsJs}])" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px !important; cursor: pointer;">
        </div>`;
      });
      imagesHtml += `</div>`;
    } else {
      imagesHtml += `<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px;">`;
      visibleImages.forEach((url, index) => {
        imagesHtml += `<div style="position: relative; aspect-ratio: 1 / 1;">`;
        imagesHtml += `<img src="${url}" onclick="openImageViewer(${index}, [${imageUrls.map(u => `'${u}'`).join(',')}])" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px !important; cursor: pointer;">`;
        if (index === 3 && imageUrls.length > 4) {
          imagesHtml += `<div onclick="openImageViewer(${index}, [${imageUrls.map(u => `'${u}'`).join(',')}])" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); border-radius: 12px !important; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 1.5rem; cursor: pointer;">+${imageUrls.length - 4}</div>`;
        }
        imagesHtml += `</div>`;
      });
      imagesHtml += `</div>`;
    }
    return imagesHtml;
  }

  /* ==========================================
     💬 Comments / replies (member role can't comment/reply on fan posts - server-enforced too)
     ========================================== */
  function buildSingleCommentHtml(cmt, postId, isReply, replies) {
    const cmtImg = cmt.profile_img || 'https://lh3.googleusercontent.com/d/1rebp2F8vyP0nyvsEOFD9Nw2mPcRtVqtG=s1000';
    const commentId = cmt.commentId || '';
    const likes = cmt.likes || 0;
    const heartClass = cmt.isLiked ? 'fa-solid' : 'fa-regular';
    const avatarSize = isReply ? 24 : 28;
    const replyList = Array.isArray(replies) ? replies : [];
    const replyCount = replyList.length;
    const repliesHtml = replyList.map(r => buildSingleCommentHtml(r, postId, true)).join('');

    window.__commentTextCache = window.__commentTextCache || {};
    if (commentId) window.__commentTextCache[commentId] = cmt.text || '';
    const sessionUser = getUserSession();
    const isOwnComment = !!(sessionUser && sessionUser.username && cmt.username && sessionUser.username === cmt.username);

    return `
        <div class="comment-item" data-comment-id="${escapeAttr(commentId)}" style="display: flex; align-items: flex-start; margin-bottom: 10px; ${isReply ? 'margin-left: 34px;' : ''} background: #fff5f7; padding: 8px 12px; border-radius: 12px; gap: 8px; text-align: left;">
          <img src="${escapeAttr(cmtImg)}" style="width: ${avatarSize}px; height: ${avatarSize}px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid #ffe3e8;">
          <div style="font-size: 0.88rem; width: 100%;">
            <b style="color: var(--primary-pink);">${escapeHtml(cmt.name)}</b>
            <div id="cmt-text-${commentId}" style="color: #333; word-break: break-word; overflow-wrap: break-word; margin-top: 2px;">${escapeHtml(cmt.text)}</div>
            <div style="display: flex; align-items: center; gap: 14px; margin-top: 4px;">
              <button onclick="toggleCommentLike('${commentId}')" style="background: none; border: none; color: var(--primary-pink); cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; gap: 4px; padding: 0;">
                <i class="${heartClass} fa-heart" id="cmt-heart-${commentId}"></i> <span id="cmt-like-count-${commentId}">${likes}</span>
              </button>
              ${(!isReply && !isMemberRole) ? `<button onclick="toggleReplyBox('${commentId}')" style="background: none; border: none; color: #888; cursor: pointer; font-size: 0.75rem; padding: 0;">Reply</button>` : ''}
              ${isOwnComment ? `<button onclick="startEditComment('${commentId}')" style="background: none; border: none; color: #888; cursor: pointer; font-size: 0.75rem; padding: 0;">Edit</button>` : ''}
            </div>
            ${!isReply ? `
              <button id="replies-toggle-btn-${commentId}" onclick="toggleReplies('${commentId}')" style="background: none; border: none; color: #888; cursor: pointer; font-size: 0.75rem; padding: 0; margin-top: 6px; align-items: center; gap: 5px; display: ${replyCount > 0 ? 'flex' : 'none'};">
                <i class="fa-solid fa-chevron-down" id="replies-chevron-${commentId}"></i> <span id="replies-count-${commentId}">${replyCount}</span> การตอบกลับ
              </button>
              <div id="replies-${commentId}" style="display: none; margin-top: 4px;">${repliesHtml}</div>
              ${!isMemberRole ? `
              <div class="reply-input-box" id="reply-box-${commentId}" style="display: none; gap: 8px; margin-top: 8px;">
                <input type="text" id="reply-input-${commentId}" placeholder="Write a reply..." style="flex: 1; border: 1px solid #ffccd7; border-radius: 20px; padding: 5px 12px; font-size: 0.8rem; outline: none;">
                <button onclick="submitReply('${postId}', '${commentId}', this)" style="background: var(--primary-pink); color: white; border: none; border-radius: 20px; padding: 0 12px; font-size: 0.8rem; cursor: pointer; font-weight: bold;">SEND</button>
              </div>
              ` : ''}
            ` : ''}
          </div>
        </div>
      `;
  }

  function buildCommentsHtml(comments, postId) {
    if (!comments || comments.length === 0) {
      return `<div class="no-comment-placeholder" style="color: gray; font-size: 0.8rem; text-align: center; margin: 10px 0;">NOT COMMENTS YET.</div>`;
    }
    const byId = {};
    comments.forEach(c => { if (c.commentId) byId[c.commentId] = c; });
    const topLevel = [];
    const repliesByParent = {};
    comments.forEach(c => {
      if (!c.parentCommentId || !byId[c.parentCommentId]) {
        topLevel.push(c);
      } else {
        let topId = c.parentCommentId;
        let hops = 0;
        while (byId[topId] && byId[topId].parentCommentId && byId[byId[topId].parentCommentId] && hops < 5) {
          topId = byId[topId].parentCommentId;
          hops++;
        }
        if (!repliesByParent[topId]) repliesByParent[topId] = [];
        repliesByParent[topId].push(c);
      }
    });
    return topLevel.map(cmt => buildSingleCommentHtml(cmt, postId, false, repliesByParent[cmt.commentId] || [])).join('');
  }

  function renderPost(post) {
    if (!post) return '';

    const canManage = hasManagementPermission(post.authorUsername);
    const authorProfileImg = post.profile_img || 'https://lh3.googleusercontent.com/d/1rebp2F8vyP0nyvsEOFD9Nw2mPcRtVqtG=s1000';
    const authorName = escapeHtml(post.authorName || 'Anonymous');

    const rawDate = post.timestamp || post.date || 'เมื่อสักครู่';
    const postTimestamp = escapeHtml(rawDate !== 'เมื่อสักครู่' ? formatThaiDate(rawDate) : rawDate);

    const postContent = formatPostContent(post.content || '');
    const postLikes = post.likes || 0;
    const postId = post.id || '';
    const displayImage = post.imageUrl || post.imageURL || '';
    const heartClass = post.isLiked ? 'fa-solid' : 'fa-regular';

    const postComments = Array.isArray(post.comments) ? post.comments : [];
    const commentsHtml = buildCommentsHtml(postComments, postId);
    const imagesHtml = buildImagesHtml(displayImage);

    const actionMenu = canManage ? `
      <div class="post-menu-container">
        <button class="post-menu-btn" onclick="togglePostMenu(event, '${postId}')">
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>
        <div class="post-dropdown-menu" id="dropdown-${postId}">

  /* ==========================================
     🌸 Feed loading
     ========================================== */
  window.isFeedLoading = false;
  async function loadFanPostFeed() {
    if (window.isFeedLoading) return;
    const container = document.getElementById('fanpost-feed');
    if (!container) return;

    window.isFeedLoading = true;
    try {
      const currentUser = getUserSession();
      const username = currentUser ? currentUser.username : "";
      const allPosts = await blm48GetPosts(username);
      const posts = (Array.isArray(allPosts) ? allPosts : []).filter(p => p.postType === 'fan');

      if (posts.length === 0) {
        container.innerHTML = `<div class="empty-feed-state"><i class="fa-solid fa-star"></i>ยังไม่มีโพสต์แฟนคลับ มาเป็นคนแรกกันเลย!</div>`;
        return;
      }

      // get_posts already orders newest-first (created_at desc). Only touch posts that changed:
      // existing cards get their live counters patched in place (no re-render, images never
      // reload); a post with no card yet gets inserted fresh - the rest of the feed is left alone.
      const wasEmpty = container.querySelectorAll('.post-card').length === 0;
      if (wasEmpty) container.innerHTML = '';

      [...posts].reverse().forEach(post => {
        const existingPost = document.getElementById(`post-${post.id}`);
        if (existingPost) {
          const likeCountEl = document.getElementById(`like-count-${post.id}`);
          if (likeCountEl) likeCountEl.innerText = post.likes;
          const heartIcon = document.getElementById(`heart-${post.id}`);
          if (heartIcon) heartIcon.className = post.isLiked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
          const postComments = Array.isArray(post.comments) ? post.comments : [];
          const commentCountEl = document.getElementById(`comment-count-${post.id}`);
          if (commentCountEl) commentCountEl.innerText = postComments.length;
          const commentListEl = document.getElementById(`comment-list-${post.id}`);
          if (commentListEl) commentListEl.innerHTML = buildCommentsHtml(postComments, post.id);
        } else {
          container.insertAdjacentHTML('afterbegin', renderPost(post));
        }
      });

      if (wasEmpty) scrollToSharedPostFromUrl();
    } catch (error) {
      console.error('โหลดฟีดแฟนคลับไม่สำเร็จ:', error);
      if (!container.querySelector('.post-card')) {
        container.innerHTML = `<div class="empty-feed-state">เกิดข้อผิดพลาดในการโหลดฟีด ลองรีเฟรชอีกครั้งค่ะ</div>`;
      }
    } finally {
      window.isFeedLoading = false;
    }
  }

  async function editPostUi(postId, encodedContent) {
    const oldContent = decodeURIComponent(encodedContent);
    const postEl = document.getElementById(`post-${postId}`);
    const oldImageUrl = postEl ? (postEl.dataset.images || '') : '';
    __editPostImages = oldImageUrl.split(',').map(s => s.trim()).filter(Boolean);

    const { value: formValues } = await Swal.fire({
      title: 'แก้ไขโพสต์',
      html: `
        <textarea id="swal-edit-content" class="swal2-textarea" style="margin-top:0;">${escapeHtml(oldContent)}</textarea>
        <div id="edit-post-img-list" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; text-align:left;"></div>
      `,
      didOpen: () => { __renderEditPostImages(); },
      showCancelButton: true, confirmButtonColor: 'var(--primary-pink)', cancelButtonColor: 'gray',
      focusConfirm: false, preConfirm: () => document.getElementById('swal-edit-content').value
    });

    if (typeof formValues === 'undefined') return;

    const newText = formValues;
    const newImageUrl = __editPostImages.join(',');
    if (newText === oldContent && newImageUrl === oldImageUrl) return;

    const currentUser = getUserSession();
    const data = await blm48EditPost(currentUser.username, postId, newText, newImageUrl);

    if (data.status === 'success') {
      const removedImages = oldImageUrl.split(',').map(s => s.trim()).filter(u => u && !__editPostImages.includes(u));
      blm48DeleteStorageFiles(removedImages);

      document.getElementById(`content-${postId}`).innerHTML = formatPostContent(newText);
      if (postEl) postEl.dataset.images = newImageUrl;
      const imagesContainer = document.getElementById(`post-images-${postId}`);
      if (imagesContainer) imagesContainer.innerHTML = buildImagesHtml(newImageUrl);
      Swal.fire('สำเร็จ!', 'อัปเดตโพสต์เรียบร้อย', 'success');
    } else {
      Swal.fire('เอ๊ะ!', 'เกิดข้อผิดพลาด หรือคุณไม่มีสิทธิ์ในการแก้ไขโพสต์นี้', 'error');
    }
  }

  window.likePost = async function(postId) {
    const currentUser = getUserSession();
    if (!currentUser || !currentUser.username) {
      Swal.fire({ icon: 'warning', title: 'ไม่พบผู้ใช้งาน', text: 'กรุณาล็อกอินก่อนงับ', confirmButtonColor: 'var(--primary-pink)' });
      return;
    }
    const likeSpan = document.getElementById(`like-count-${postId}`);
    const heartIcon = document.querySelector(`#post-${postId} .fa-heart`);
    if (!heartIcon || !likeSpan) return;
    if (heartIcon.dataset.loading === "true") return;
    heartIcon.dataset.loading = "true";

    const isCurrentlyLiked = heartIcon.classList.contains('fa-solid');
    const currentLikes = parseInt(likeSpan.innerText) || 0;
    heartIcon.classList.toggle('fa-solid', !isCurrentlyLiked);
    heartIcon.classList.toggle('fa-regular', isCurrentlyLiked);
    likeSpan.innerText = isCurrentlyLiked ? Math.max(0, currentLikes - 1) : currentLikes + 1;

    try {
      const result = await blm48LikePost(currentUser.username, postId);
      if (result.status === "success") {
        likeSpan.innerText = result.likes;
        heartIcon.classList.toggle('fa-solid', result.isLiked);
        heartIcon.classList.toggle('fa-regular', !result.isLiked);
      } else {
        throw new Error(result.message);
      }
    } catch (error) {
      heartIcon.classList.toggle('fa-solid', isCurrentlyLiked);
      heartIcon.classList.toggle('fa-regular', !isCurrentlyLiked);
      likeSpan.innerText = currentLikes;
      console.error("Like Error:", error);
    } finally {
      delete heartIcon.dataset.loading;
    }
  };

  window.submitComment = async function(postId, btnElement) {

      Swal.fire('พบปัญหา 😥', 'กรุณาล็อกอินเข้าสู่ระบบก่อนแสดงความคิดเห็นนะงับ', 'warning');

    const inputEl = document.getElementById(`comment-input-${postId}`);
    if (!inputEl) return;
    const commentText = inputEl.value.trim();
    if (btnElement && btnElement.disabled) return;
    if (!commentText) {
      Swal.fire('ข้อความว่างเปล่า', 'พิมพ์อะไรบางอย่างก่อนส่งน้า', 'info');
      return;
    }

    let originalText = "";
    if (btnElement) { originalText = btnElement.innerText; btnElement.innerText = "กำลังส่ง..."; btnElement.disabled = true; }
    inputEl.disabled = true;

    try {
      const result = await blm48AddComment(currentUser.username, postId, commentText);
      if (result.status !== 'success') throw new Error(result.message);

      const commentListEl = document.getElementById(`comment-list-${postId}`);
      const commentCountEl = document.getElementById(`comment-count-${postId}`);
      if (commentListEl) {
        const placeholder = commentListEl.querySelector('.no-comment-placeholder');

        commentListEl.insertAdjacentHTML('beforeend', buildSingleCommentHtml({
          commentId: result.commentId, username: currentUser.username,
          name: currentUser.name || currentUser.username || 'Anonymous',
          role: currentUser.role || 'user',
          profile_img: currentUser.profile_img || 'https://lh3.googleusercontent.com/d/1rebp2F8vyP0nyvsEOFD9Nw2mPcRtVqtG=s1000',
          text: commentText, likes: 0, isLiked: false
        }, postId, false));
        commentListEl.scrollTop = commentListEl.scrollHeight;
      }
      if (commentCountEl) commentCountEl.innerText = (parseInt(commentCountEl.innerText) || 0) + 1;
      inputEl.value = "";
    } catch (error) {
      console.error("Add Comment Error:", error);
      Swal.fire('เกิดข้อผิดพลาด', (error && error.message) || 'ส่งคอมเมนต์ไม่สำเร็จงับ', 'error');

      if (btnElement) { btnElement.innerText = originalText; btnElement.disabled = false; }
      inputEl.disabled = false;
    }
  };

  window.startEditComment = function(commentId) {
    const textEl = document.getElementById(`cmt-text-${commentId}`);
    if (!textEl || textEl.dataset.editing === 'true') return;
    const raw = (window.__commentTextCache && window.__commentTextCache[commentId]) || '';
    textEl.dataset.editing = 'true';
    textEl.innerHTML = `
      <div style="display: flex; gap: 6px; margin-top: 2px;">
        <input type="text" id="cmt-edit-input-${commentId}" value="${escapeAttr(raw)}" style="flex: 1; border: 1px solid #ffccd7; border-radius: 20px; padding: 4px 12px; font-size: 0.85rem; outline: none;">

        <button onclick="cancelEditComment('${commentId}')" title="Cancel" style="background: #eee; color: #555; border: none; border-radius: 50%; width: 26px; height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>
    `;
    const input = document.getElementById(`cmt-edit-input-${commentId}`);
    if (input) {
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveEditComment(commentId);
        if (e.key === 'Escape') cancelEditComment(commentId);
      });

  window.saveEditComment = async function(commentId) {
    const currentUser = getUserSession();
    if (!currentUser || !currentUser.username) {
      Swal.fire({ icon: 'warning', title: 'ไม่พบผู้ใช้งาน', text: 'กรุณาล็อกอินก่อนงับ', confirmButtonColor: 'var(--primary-pink)' });

    const input = document.getElementById(`cmt-edit-input-${commentId}`);
    const textEl = document.getElementById(`cmt-text-${commentId}`);
    if (!input || !textEl) return;
    const newText = input.value.trim();
    if (!newText) {
      Swal.fire('ข้อความว่างเปล่า', 'พิมพ์อะไรบางอย่างก่อนบันทึกน้า', 'info');
      return;
    }
    const saveBtn = input.nextElementSibling;
    const cancelBtn = saveBtn ? saveBtn.nextElementSibling : null;
    input.disabled = true;
    if (saveBtn) saveBtn.disabled = true;
    if (cancelBtn) cancelBtn.disabled = true;

    try {
      const result = await blm48EditComment(currentUser.username, commentId, newText);
      if (result.status !== 'success') throw new Error(result.message);
      window.__commentTextCache[commentId] = result.text || newText;
      textEl.textContent = result.text || newText;
      delete textEl.dataset.editing;
    } catch (error) {
      console.error("Edit Comment Error:", error);
      Swal.fire('เกิดข้อผิดพลาด', (error && error.message) || 'แก้ไขคอมเมนต์ไม่สำเร็จงับ', 'error');

      if (saveBtn) saveBtn.disabled = false;
      if (cancelBtn) cancelBtn.disabled = false;
    }
  };

    let originalText = "";
    if (btnElement) { originalText = btnElement.innerText; btnElement.innerText = "..."; btnElement.disabled = true; }
    inputEl.disabled = true;

    try {
      const result = await blm48AddComment(currentUser.username, postId, replyText, parentCommentId);
      if (result.status !== 'success') throw new Error(result.message);

      const repliesEl = document.getElementById(`replies-${parentCommentId}`);
      if (repliesEl) {
        repliesEl.insertAdjacentHTML('beforeend', buildSingleCommentHtml({
          commentId: result.commentId, username: currentUser.username,
          name: currentUser.name || currentUser.username || 'Anonymous',
          role: currentUser.role || 'user',
          profile_img: currentUser.profile_img || 'https://lh3.googleusercontent.com/d/1rebp2F8vyP0nyvsEOFD9Nw2mPcRtVqtG=s1000',
          text: replyText, likes: 0, isLiked: false
        }, postId, true));
      }
      const commentCountEl = document.getElementById(`comment-count-${postId}`);
      if (commentCountEl) commentCountEl.innerText = (parseInt(commentCountEl.innerText) || 0) + 1;

      const repliesCountEl = document.getElementById(`replies-count-${parentCommentId}`);
      if (repliesCountEl) repliesCountEl.innerText = (parseInt(repliesCountEl.innerText) || 0) + 1;
      const repliesToggleBtn = document.getElementById(`replies-toggle-btn-${parentCommentId}`);
      if (repliesToggleBtn) repliesToggleBtn.style.display = 'flex';
      if (repliesEl) repliesEl.style.display = 'block';
      const repliesChevron = document.getElementById(`replies-chevron-${parentCommentId}`);
      if (repliesChevron) { repliesChevron.classList.remove('fa-chevron-down'); repliesChevron.classList.add('fa-chevron-up'); }

      inputEl.value = "";
      toggleReplyBox(parentCommentId);
    } catch (error) {
      console.error("Submit Reply Error:", error);
      Swal.fire('เกิดข้อผิดพลาด', (error && error.message) || 'ส่งการตอบกลับไม่สำเร็จงับ', 'error');
    } finally {
      if (btnElement) { btnElement.innerText = originalText; btnElement.disabled = false; }
      inputEl.disabled = false;
    }
  };

  /* ==========================================
     ✏️ Composer (role='user' only - server-enforced too)
     ========================================== */
  let selectedFanPostImages = [];

  function compressImageFile(file, maxDimension = 1280, quality = 0.75) {
    return new Promise((resolve) => {
      if (file.type === 'image/gif') { resolve(file); return; }
      const img = new Image();
      const objectUrl = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(objectUrl);
        let { width, height } = img;
        if (width <= maxDimension && height <= maxDimension) { resolve(file); return; }
        const scale = Math.min(maxDimension / width, maxDimension / height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => { resolve(blob ? new File([blob], file.name, { type: 'image/jpeg' }) : file); }, 'image/jpeg', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(objectUrl); resolve(file); };
      img.src = objectUrl;
    });
  }

  function renderFanPostImagePreviews() {
    const container = document.getElementById('fanpost-image-preview');
    container.innerHTML = '';
    selectedFanPostImages.forEach((imgObj, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'preview-image-wrapper';
      wrapper.innerHTML = `
        <img src="${imgObj.preview}">
        <div class="img-action-overlay" data-index="${index}"><i class="fa-solid fa-xmark"></i></div>
      `;
      wrapper.querySelector('.img-action-overlay').addEventListener('click', function() {
        selectedFanPostImages.splice(parseInt(this.getAttribute('data-index')), 1);
        renderFanPostImagePreviews();
      });
      container.appendChild(wrapper);
    });
  }

  function initFanPostComposer() {
    const imageInput = document.getElementById('fanpost-image');
    imageInput.addEventListener('change', function() {
      if (this.files && this.files.length > 0) {
        const startIndex = selectedFanPostImages.length;
        const files = Array.from(this.files);
        files.forEach((file, i) => { selectedFanPostImages[startIndex + i] = { file: file, preview: null }; });
        files.forEach(async (file, i) => {
          const compressedFile = await compressImageFile(file);
          selectedFanPostImages[startIndex + i].file = compressedFile;
          const reader = new FileReader();
          reader.onload = function(e) {
            selectedFanPostImages[startIndex + i].preview = e.target.result;
            renderFanPostImagePreviews();
          };
          reader.readAsDataURL(compressedFile);
        });
        this.value = '';
      }
    });
  }

  window.toggleFanPostComposer = function(forceOpen) {
    const composer = document.getElementById('fanpost-composer');
    const addBtn = document.getElementById('fanpost-add-btn');
    if (!composer) return;
    const shouldOpen = forceOpen !== undefined ? forceOpen : composer.style.display !== 'block';
    composer.style.display = shouldOpen ? 'block' : 'none';
    if (addBtn) addBtn.classList.toggle('open', shouldOpen);
    if (shouldOpen) {
      const contentEl = document.getElementById('fanpost-content');
      if (contentEl) contentEl.focus();
    }
  };

  window.submitFanPost = async function() {
    const contentEl = document.getElementById('fanpost-content');
    const content = contentEl.value.trim();
    const currentUser = getUserSession();
    if (!currentUser || !currentUser.username) {
      Swal.fire({ title: 'Session Expired', text: 'กรุณาล็อกอินใหม่อีกครั้งค่ะ', icon: 'warning', confirmButtonColor: 'var(--primary-pink)' });
      return;
    }
    if (!content && selectedFanPostImages.length === 0) {
      Swal.fire('ยังไม่มีเนื้อหา', 'พิมพ์ข้อความหรือแนบรูปก่อนโพสต์น้า', 'info');
      return;
    }

    Swal.fire({ title: 'กำลังโพสต์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    try {
      let imageUrlString = "";
      if (selectedFanPostImages.length > 0) {
        let uploadedUrls = [];
        let failedCount = 0;
        for (let i = 0; i < selectedFanPostImages.length; i++) {
          try {
            const url = await blm48UploadPostImage(currentUser.username, selectedFanPostImages[i].file);
            if (url) uploadedUrls.push(url);
          } catch (err) { failedCount++; console.error(`Upload error on image ${i+1}:`, err); }
        }
        imageUrlString = uploadedUrls.join(',');
        if (failedCount > 0) {
          const proceedAnyway = await Swal.fire({
            icon: 'warning', title: 'อัปโหลดรูปไม่ครบ',
            text: `อัปโหลดสำเร็จ ${uploadedUrls.length} จาก ${selectedFanPostImages.length} รูป ต้องการโพสต่อไหมคะ?`,
            showCancelButton: true, confirmButtonText: 'โพสต่อ', cancelButtonText: 'ยกเลิก', confirmButtonColor: 'var(--primary-pink)'
          });
          if (!proceedAnyway.isConfirmed) return;
        }
      }

      const data = await blm48CreatePost(currentUser.username, content, imageUrlString, '', '', 'fan');
      if (data.status === 'success') {
        contentEl.value = '';
        selectedFanPostImages = [];
        renderFanPostImagePreviews();
        toggleFanPostComposer(false);
        Swal.close();
        loadFanPostFeed();
      } else {
        Swal.fire('เกิดข้อผิดพลาด', data.message || 'โพสต์ไม่สำเร็จค่ะ', 'error');
      }
    } catch (error) {
      console.error('Fan post submission failure:', error);
      Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: error.message || 'ระบบขัดข้อง กรุณาลองใหม่อีกครั้ง' });
    }
  };

  /* ==========================================
     🎨 Sub-page nav icon theming (custom uploaded icons, no splash)
     ========================================== */
  function loadChampThemeSubPage() {
    const CACHE_KEY = "bnl_winner_theme_cache";
    const cachedDataStr = localStorage.getItem(CACHE_KEY);
    if (cachedDataStr) {
      try {
        const cachedObj = JSON.parse(cachedDataStr);
        applySubPageTheme(cachedObj.champ ? cachedObj.champ : cachedObj);
      } catch (e) {}
    }
    blm48GetWinnerTheme().then(newData => {
      const newChampData = newData.champ ? newData.champ : newData;
      if (newChampData && newChampData.name) {
        let cacheChampStr = "";
        if (cachedDataStr) {
          try {
            const parsed = JSON.parse(cachedDataStr);
            cacheChampStr = JSON.stringify(parsed.champ ? parsed.champ : parsed);
          } catch (e) {}
        }
        if (cacheChampStr !== JSON.stringify(newChampData)) {
          localStorage.setItem(CACHE_KEY, JSON.stringify(newData));
          applySubPageTheme(newChampData);
        }
      }
    }).catch(e => console.error(e));
  }
  function applySubPageTheme(champData) {
    if (!champData) return;
    updateSubPageIcon('nav-home', 'nav-home-fallback', champData.homeIcon);
    updateSubPageIcon('nav-kami', 'nav-kami-fallback', champData.kamiIcon);
    updateSubPageIcon('nav-cart', 'nav-cart-fallback', champData.cartIcon);
    updateSubPageIcon('nav-noti', 'nav-noti-fallback', champData.notiIcon);
  }
  function updateSubPageIcon(imgId, fallbackId, iconUrl) {
    const imgElement = document.getElementById(imgId);
    const fallbackElement = document.getElementById(fallbackId);
    if (imgElement && fallbackElement) {
      if (iconUrl && iconUrl.trim() !== "") {
        imgElement.src = iconUrl; imgElement.style.display = 'block'; fallbackElement.style.display = 'none';
      } else {
        imgElement.style.display = 'none'; fallbackElement.style.display = 'block';
      }
    }
  }

  /* ==========================================
     🚀 Boot
     ========================================== */
  document.addEventListener('DOMContentLoaded', async () => {
    user = getUserSession();
    if (!user || !user.username) {
      window.location.replace('login');
      return;
    }

    const role = (user.role || '').toLowerCase();
    isMemberRole = role === 'member';
    if (role === 'user') {
      document.getElementById('fanpost-add-btn').style.display = 'block';
      initFanPostComposer();
    } else if (isMemberRole) {
      document.getElementById('fanpost-member-note').style.display = 'block';
    }

    const tabProfileImg = document.getElementById('tab-profile-img');
    if (tabProfileImg && user.profile_img) tabProfileImg.src = user.profile_img;

    if (typeof checkNotificationBadge === 'function') checkNotificationBadge();
    loadChampThemeSubPage();

    await loadFanPostFeed();

    if (typeof blm48SubscribePosts === 'function') {
      blm48SubscribePosts(() => loadFanPostFeed(), 500);
    }
  });
</script>
