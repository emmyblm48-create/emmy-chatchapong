<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLM48 | Major Vote Detail</title>
    <script type="module" src="assets/js/firebase-realtime.js"></script>
    <meta name="theme-color" content="#ffc0cb">
    
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/0">
    <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1">
    
    <meta name="apple-mobile-web-app-title" content="BLM48">   
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>

    <style>
        :root {
            --primary-pink: #ff85a2;
            --blm-pink: var(--primary-pink);
            --blm-light-pink: #fff0f5;
            --text-dark: #4a4a4a;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Quicksand', 'Kanit', sans-serif;
            color: var(--text-dark);
            margin: 0; padding: 0; padding-top: 60px; padding-bottom: 40px;
        }
        /* หน้า Major Vote ขอพื้นหลังสีขาวล้วน แทนพื้นหลังไล่เฉดสีทองของ glass-mesh-bg (เฉพาะหน้านี้) */
        body.glass-mesh-bg {
            background-color: #ffffff;
            background-image: none;
        }

        /* Top Navbar: แถบขาว ปุ่มย้อนกลับซ้าย + ชื่อหน้าตรงกลาง */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: #ffffff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .nav-back {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            background: none; border: none; color: #333; font-size: 20px; cursor: pointer;
        }
        .nav-title { font-weight: 600; font-size: 17px; color: #222; }

        /* แบนเนอร์เต็มความกว้าง */
        .campaign-cover-wrapper { position: relative; width: 100%; aspect-ratio: 2 / 1; max-height: 420px; background: linear-gradient(135deg, #fff8e1 0%, #ffe9a8 100%); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .campaign-cover { width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 2; }
        .campaign-fallback-icon { position: absolute; color: #ffc107; font-size: 3rem; opacity: 0.4; z-index: 1; }

        /* Poll detail */
        .poll-head { display: flex; align-items: center; gap: 12px; padding: 22px 12px 18px; cursor: pointer; user-select: none; border-bottom: 1px solid #e6e6e6; }
        .poll-head h2 { margin: 0; font-size: 20px; font-weight: 700; color: #111; }
        .poll-badge { display: inline-flex; align-items: center; gap: 4px; background: #ffd75e; color: #333; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 6px; }
        .poll-badge i { font-size: 11px; }
        .poll-badge.mech-lock { background: #cfe8ff; color: #1c5d99; }
        .poll-badge.mech-partial { background: #ffe1c2; color: #8a4b00; }
        .poll-chevron { margin-left: auto; font-size: 16px; color: #333; transition: transform 0.2s; }
        .poll-head.open { border-bottom-color: transparent; }
        .poll-head.open .poll-chevron { transform: rotate(180deg); }
        .poll-detail { padding: 4px 12px 22px; font-size: 14px; color: #222; line-height: 1.9; border-bottom: 1px solid #e6e6e6; }
        .poll-detail b { font-weight: 700; color: #111; }
        .pd-desc-label { margin-top: 18px; }
        .pd-desc { white-space: pre-line; line-height: 1.7; color: #333; }

        /* แท็บกลุ่ม (All / BLM48 / ...) */
        .group-tabs { display: flex; gap: 34px; padding: 16px 12px 0; border-bottom: 1px solid #e6e6e6; overflow-x: auto; scrollbar-width: none; }
        .group-tabs::-webkit-scrollbar { display: none; }
        .group-tab { background: none; border: none; padding: 0 2px 14px; font-family: inherit; font-size: 15px; font-weight: 600; color: #b5b5b5; cursor: pointer; position: relative; white-space: nowrap; }
        .group-tab span { position: relative; z-index: 1; }
        .group-tab.active { color: #111; }
        .group-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 13px; height: 5px; border-radius: 2px; background: #ffc107; }

        /* รายชื่อผู้สมัคร (โหมดเปิดโหวต) */
        .candidate-list { display: flex; flex-direction: column; gap: 18px; padding: 24px 12px 10px; }
        .candidate-row { display: flex; align-items: center; gap: 12px; }
        .candidate-img-wrapper { width: 82px; height: 82px; border-radius: 10px; overflow: hidden; background: #f4f4f4; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .candidate-img { width: 100%; height: 100%; object-fit: cover; z-index: 2; }
        .cand-avatar-fallback { position: absolute; color: #ccc; font-size: 2rem; z-index: 1; }
        .candidate-name { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; color: #111; overflow: hidden; text-overflow: ellipsis; }
        .candidate-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        .vote-action-btn, .getoken-action-btn, .gift-action-btn {
            min-width: 84px; border: none; padding: 8px 16px; border-radius: 999px;
            font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: transform 0.1s; white-space: nowrap;
        }
        .vote-action-btn { background: #ffd75e; color: #222; }
        .getoken-action-btn { background: #cfe8ff; color: #1c5d99; }
        .gift-action-btn { background: #ffe1ea; color: #c2335b; }
        .vote-action-btn:active, .getoken-action-btn:active, .gift-action-btn:active { transform: scale(0.95); }

        /* Gift Sheet (แบบแผงส่งของขวัญของแอป: รูปเมมเบอร์ลอยขอบบน > แท็บขีดเส้นใต้ > กริด 4x2 ปัดเปลี่ยนหน้า > ปุ่มจำนวน > แถบ Send) */
        .gift-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 2000; align-items: flex-end; justify-content: center; }
        .gift-modal-box { background: #ffffff; width: 100%; max-width: 480px; max-height: calc(100vh - 70px); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; position: relative; animation: gift-modal-slide-up 0.25s ease; }
        @keyframes gift-modal-slide-up { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .gift-modal-close { position: absolute; top: 12px; right: 14px; background: #f3f3f3; border: none; width: 30px; height: 30px; border-radius: 50%; color: #888; cursor: pointer; font-size: 14px; z-index: 2; }

        .gift-modal-recipient { display: flex; flex-direction: column; align-items: center; margin-top: -56px; padding-bottom: 12px; flex-shrink: 0; }
        .gift-modal-avatar { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; background: #f5f5f5; border: 4px solid #ffffff; box-shadow: 0 0 0 3px #d4a5dc, 0 4px 14px rgba(0,0,0,0.12); }
        .gift-modal-target { font-family: 'Quicksand', 'Kanit', sans-serif; font-weight: 700; font-size: 21px; color: #111; text-transform: uppercase; margin-top: 10px; max-width: 80%; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* แท็บหมวดของขวัญ + Backpack (ของที่ซื้อเก็บไว้) อยู่แถวเดียวกัน */
        .gift-tabs { display: flex; border-top: 1px solid #eeeeee; border-bottom: 1px solid #eeeeee; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
        .gift-tabs::-webkit-scrollbar { display: none; }
        .gift-tab { flex: 1 0 auto; min-width: 25%; background: none; border: none; padding: 14px 10px 12px; font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 16px; font-weight: 600; color: #b8b8b8; cursor: pointer; position: relative; white-space: nowrap; }
        .gift-tab.active { color: #111; }
        .gift-tab.active::after { content: ''; position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 60%; height: 4px; border-radius: 2px; background: #ffd75e; }

        /* หน้าละ 8 ชิ้น (4x2) ปัดซ้ายขวาได้ มีจุดบอกหน้าด้านล่าง */
        .gift-pager { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; flex-shrink: 1; min-height: 0; }
        .gift-pager::-webkit-scrollbar { display: none; }
        .gift-page { flex: 0 0 100%; scroll-snap-align: start; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; padding: 12px 10px 4px; align-content: start; min-height: 290px; }
        .gift-item-card { background: none; border: 2px solid transparent; border-radius: 12px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 0; transition: transform 0.1s, background 0.15s, border-color 0.15s; }
        .gift-item-card:active { transform: scale(0.96); }
        .gift-item-card.selected { border-color: #ffd75e; background: #fffdf4; }
        .gift-item-img { width: 70px; height: 70px; object-fit: contain; display: block; }
        .gift-item-name { width: 100%; text-align: center; font-size: 12.5px; font-weight: 500; color: #a9a9a9; margin: 6px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gift-item-cost { width: 100%; background: #ececec; border-radius: 999px; padding: 5px 4px; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 14px; font-weight: 700; color: #333; }
        .gift-item-cost i { color: #e2a63b; font-size: 13px; }
        .gift-loading, .gift-empty { flex: 0 0 100%; min-height: 290px; display: flex; align-items: center; justify-content: center; text-align: center; color: #999; padding: 30px 24px; font-size: 13.5px; line-height: 1.6; }
        .gift-dots { display: flex; justify-content: center; gap: 10px; padding: 6px 0 12px; flex-shrink: 0; min-height: 26px; }
        .gift-dot { width: 8px; height: 8px; border-radius: 50%; background: #e3e3e3; transition: background 0.2s; }
        .gift-dot.active { background: #9a9a9a; }

        .gift-qty-row { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-top: 1px solid #eeeeee; flex-shrink: 0; }
        .gift-qty-btn { flex: 1; min-width: 0; background: #ffffff; color: #222; border: 1.5px solid #ececec; padding: 10px 0; border-radius: 999px; font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 16px; font-weight: 500; cursor: pointer; white-space: nowrap; }
        .gift-qty-btn.custom { flex: 2; }
        .gift-qty-btn.active { border-color: #ffd75e; background: #fffdf4; }
        .gift-qty-btn:disabled { color: #cfcfcf; cursor: not-allowed; }

        .gift-send-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #f2f2f2; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); flex-shrink: 0; }
        .gift-balance-chip { display: flex; align-items: center; gap: 10px; background: #ffffff; border-radius: 999px; padding: 6px 6px 6px 14px; min-width: 0; }
        .gift-balance-chip > i { color: #e2a63b; font-size: 20px; }
        .gift-balance-chip span { font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 17px; font-weight: 600; color: #222; min-width: 40px; text-align: center; overflow: hidden; text-overflow: ellipsis; }
        .gift-topup-btn { width: 34px; height: 34px; border-radius: 50%; background: #ffd36b; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; text-decoration: none; flex-shrink: 0; }
        .gift-send-btn { background: #ffd75e; color: #222; border: none; border-radius: 999px; padding: 14px 44px; font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
        .gift-send-btn:active { transform: scale(0.97); }
        .gift-send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

        /* ป๊อปอัปยืนยันก่อนส่ง: ของขวัญ x จำนวน = Cookie ที่ต้องจ่าย */
        .gift-confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 2100; align-items: center; justify-content: center; padding: 16px; }
        .gift-confirm-box { background: #ffffff; width: 100%; max-width: 380px; border-radius: 22px; overflow: hidden; animation: gift-confirm-pop 0.18s ease; }
        @keyframes gift-confirm-pop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .gift-confirm-title { text-align: center; font-size: 18px; font-weight: 700; color: #111; padding: 16px 12px 14px; border-bottom: 1px solid #eeeeee; }
        .gift-confirm-body { padding: 22px 28px 18px; display: flex; flex-direction: column; align-items: center; }
        .gift-confirm-item { display: flex; align-items: center; gap: 18px; }
        .gift-confirm-item-col { display: flex; flex-direction: column; align-items: center; width: 130px; }
        .gift-confirm-item-col img { width: 96px; height: 96px; object-fit: contain; }
        .gift-confirm-item-col .gift-item-name { font-size: 13px; margin: 6px 0; }
        .gift-confirm-qty { font-size: 24px; font-weight: 700; color: #111; white-space: nowrap; }
        .gift-confirm-divider { display: flex; align-items: center; gap: 14px; width: 100%; margin: 20px 0 8px; font-size: 17px; font-weight: 700; color: #222; }
        .gift-confirm-divider::before, .gift-confirm-divider::after { content: ''; flex: 1; height: 1px; background: #e6e6e6; }
        .gift-confirm-total { display: flex; align-items: center; gap: 12px; font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 34px; font-weight: 700; color: #111; }
        .gift-confirm-total i { color: #e2a63b; font-size: 30px; }
        .gift-confirm-note { font-size: 12.5px; color: #999; margin-top: 4px; text-align: center; }
        .gift-confirm-actions { display: flex; gap: 12px; padding: 16px 20px 18px; border-top: 1px solid #eeeeee; }
        .gift-confirm-cancel, .gift-confirm-ok { flex: 1; border-radius: 999px; padding: 13px 0; font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 17px; cursor: pointer; }
        .gift-confirm-cancel { background: #ffffff; color: #222; border: 1.5px solid #222; font-weight: 500; }
        .gift-confirm-ok { flex: 1.5; background: #ffd75e; color: #222; border: none; font-weight: 700; }
        .gift-confirm-keep { display: block; width: 100%; background: none; border: none; color: #a0a0a0; font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 13px; padding: 0 0 16px; margin-top: -4px; cursor: pointer; }
        .gift-confirm-keep i { margin-right: 4px; }

        @media (max-width: 360px) {
            .gift-item-img { width: 56px; height: 56px; }
            .gift-qty-btn { font-size: 14px; }
            .gift-send-btn { padding: 13px 30px; }
        }
        /* ผลอันดับ (โหมดปิดโหวต): การ์ดผู้ชนะด้านบน + อันดับถัดไปเป็นแถวเรียบ */
        .ranking-list { display: flex; flex-direction: column; padding: 0 12px; }
        .ranking-heading { font-size: 16px; font-weight: 700; color: #222; margin: 24px 0 18px; line-height: 1.6; }
        .rank-winner { display: flex; align-items: center; position: relative; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.07); overflow: hidden; margin-bottom: 28px; }
        .rank-winner .rank-side { align-self: stretch; padding: 22px 0; background: #ffe08a; border-radius: 0 50% 50% 0 / 0 100% 100% 0; box-shadow: 10px 0 0 #fff5d1; }
        .rank-row { display: flex; align-items: center; margin-bottom: 24px; }
        .rank-side { flex: 0 0 42%; display: flex; align-items: center; justify-content: center; }
        .rank-img-wrapper { width: 92px; height: 92px; border-radius: 10px; overflow: hidden; background: #f4f4f4; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .rank-img { width: 100%; height: 100%; object-fit: cover; z-index: 2; }
        .rank-info { display: flex; flex-direction: column; min-width: 0; padding: 0 12px 0 14px; }
        .rank-status-text { font-size: 12px; color: #999; margin-bottom: 4px; }
        .rank-name { font-weight: 700; font-size: 16px; color: #111; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rank-score { font-size: 18px; font-weight: 700; color: #111; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
        .rank-score i { font-size: 14px; }
        .rank-percentage { font-size: 12px; color: #c4c4c4; margin-top: 2px; }
        .rank-medal { position: absolute; top: 10px; right: 12px; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe27a, #f5b700); color: #fff; font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(245,183,0,0.4); }

        .loading-view { text-align: center; color: #999; padding: 50px 20px; font-size: 14px; }
    </style>
</head>
<body class="glass-mesh-bg force-white-bg">

    <div class="top-navbar">
        <button class="nav-back" type="button" title="กลับ" onclick="goBack()"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="nav-title">Major vote</div>
    </div>

    <!-- แบนเนอร์เต็มความกว้างจอ -->
    <div class="campaign-cover-wrapper">
        <div class="campaign-fallback-icon"><i class="fa-solid fa-star"></i></div>
        <img id="campaign-cover" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Cover" class="campaign-cover" style="display:none;">
    </div>

    <!-- Poll detail: กดแถวนี้เพื่อกาง/พับรายละเอียดกิจกรรม -->
    <div class="poll-head" id="poll-head" onclick="togglePollDetail()">
        <h2>Poll detail</h2>
        <span class="poll-badge" id="pd-badge"><i class="fa-solid fa-circle-exclamation"></i> <span id="pd-badge-text">Burned</span></span>
        <i class="fa-solid fa-chevron-down poll-chevron"></i>
    </div>
    <div class="poll-detail" id="poll-detail" style="display: none;">
        <div><b>Poll name:</b> <span id="pd-name">-</span></div>
        <div><b>Token:</b> <span id="pd-token">-</span></div>
        <div><b>Token mechanic:</b> <span id="pd-mechanic">Burned (Your token will be permanently deducted)</span></div>
        <div><b>End date:</b> <span id="pd-end">-</span></div>
        <div><b>Minimum token per vote:</b> <span id="pd-min">1 token</span></div>
        <div class="pd-desc-label"><b>Description:</b></div>
        <div class="pd-desc" id="campaign-desc">Loading...</div>
    </div>

    <!-- โหมดเปิดโหวต: แท็บกลุ่ม + รายชื่อผู้สมัคร -->
    <div class="group-tabs" id="group-tabs" style="display: none;"></div>
    <div id="voting-view" class="candidate-list" style="display: none;"></div>

    <!-- โหมดปิดโหวต: ผลอันดับ -->
    <div id="ranking-view" class="ranking-list" style="display: none;"></div>

    <div id="loading-spinner" class="loading-view">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading...
    </div>

    <div id="gift-modal-overlay" class="gift-modal-overlay" onclick="closeGiftModal()">
        <div class="gift-modal-box" onclick="event.stopPropagation()">
            <button type="button" class="gift-modal-close" onclick="closeGiftModal()"><i class="fa-solid fa-xmark"></i></button>

            <div class="gift-modal-recipient">
                <img id="gift-modal-avatar" class="gift-modal-avatar" src="" alt="">
                <div class="gift-modal-target" id="gift-modal-target"></div>
            </div>

            <div class="gift-tabs" id="gift-tabs"></div>

            <div class="gift-pager" id="gift-pager"></div>
            <div class="gift-dots" id="gift-dots"></div>

            <div class="gift-qty-row" id="gift-qty-row"></div>

            <div class="gift-send-bar">
                <div class="gift-balance-chip">
                    <i class="fa-solid fa-cookie-bite"></i>
                    <span id="gift-modal-cookie-balance">0</span>
                    <a class="gift-topup-btn" href="shop.html" title="เติม Cookie"><i class="fa-solid fa-plus"></i></a>
                </div>
                <button type="button" class="gift-send-btn" id="gift-send-btn" onclick="openGiftConfirm()" disabled>Send</button>
            </div>
        </div>
    </div>

    <div id="gift-confirm-overlay" class="gift-confirm-overlay" onclick="closeGiftConfirm()">
        <div class="gift-confirm-box" onclick="event.stopPropagation()">
            <div class="gift-confirm-title">Confirmation</div>
            <div class="gift-confirm-body" id="gift-confirm-body"></div>
            <div class="gift-confirm-actions">
                <button type="button" class="gift-confirm-cancel" onclick="closeGiftConfirm()">Cancel</button>
                <button type="button" class="gift-confirm-ok" onclick="confirmGiftSend()">Confirm</button>
            </div>
            <button type="button" class="gift-confirm-keep" id="gift-confirm-keep" onclick="confirmGiftKeep()"><i class="fa-solid fa-box-archive"></i> ยังไม่โหวตตอนนี้ ซื้อเก็บเข้า Backpack แทน</button>
        </div>
    </div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const campaignId = urlParams.get('id');

    function fixSecureImageUrl(urlStr) {
        if (!urlStr) return "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
        let fixedUrl = urlStr.toString().trim();
        
        if (fixedUrl.includes("googleusercontent.com")) {
            return fixedUrl;
        }
        
        if (fixedUrl.startsWith("http://")) {
            fixedUrl = fixedUrl.replace("http://", "https://");
        }
        
        if (fixedUrl.includes("drive.google.com")) {
            const matches = fixedUrl.match(/\/d\/([^/]+)/);
            if (matches && matches[1]) {
                return `https://docs.google.com/uc?export=view&id=${matches[1]}`;
            }
        }
        
        return fixedUrl;
    }

    // =========================================================
    // 💰 ระบบรองรับหลายสกุลเงินต่อกิจกรรม (Token / GE Token / Gift-Cookie)
    // =========================================================
    // ผู้สมัครแต่ละคนอาจโหวตได้ด้วย Token, GEToken หรือทั้งคู่ (แล้วแต่ว่ามีแถวใน majorVoteCandidates กี่ TokenType)
    // ส่วน Gift เปิด/ปิดได้ทั้งแคมเปญ ผ่านคอลัมน์ EnableGift ในชีต majorVoteCollections — backend ส่ง enableGift กลับมาให้ตรงๆ
    let campaignEnableGift = false;
    let campaignTokenType = ''; // สกุลเงินหลักที่แคมเปญนี้ใช้โหวตจริง ('token' / 'getoken' / 'gift') ใช้เลือกไอคอนหน้าคะแนนในหน้าสรุปอันดับ

    // ไอคอน + สีของคะแนนในหน้าสรุปอันดับ ให้ตรงกับหมวดหมู่ที่แคมเปญนี้ใช้โหวตจริง
    function getVoteCategoryIcon(tokenType) {
        const t = (tokenType || '').toString().trim().toLowerCase();
        if (t === 'getoken') return { icon: 'fa-gem', color: '#4dabf7' };
        if (t === 'gift') return { icon: 'fa-gift', color: '#ff69b4' };
        if (t === 'cookie') return { icon: 'fa-cookie-bite', color: '#d2691e' };
        return { icon: 'fa-coins', color: '#ffd700' }; // ค่าเริ่มต้น: token
    }

    function getUserBalance(tokenType) {
        const userData = getUserSession();
        if (!userData) return 0;
        if (tokenType === 'GEToken') {
            return Number(userData.GEToken !== undefined ? userData.GEToken : (userData.geToken || 0));
        }
        return Number(userData.token || 0);
    }

    function getUserCookieBalance() {
        const userData = getUserSession();
        return userData ? Number(userData.cookie || 0) : 0;
    }

    function renderWalletStrip() {
        const strip = document.getElementById('dv-wallet-strip');
        const userData = getUserSession();
        if (!strip || !userData) return;
        strip.style.display = 'flex';
        document.getElementById('dv-token-balance').textContent = getUserBalance('Token').toLocaleString();
        document.getElementById('dv-getoken-balance').textContent = getUserBalance('GEToken').toLocaleString();
        document.getElementById('dv-cookie-balance').textContent = getUserCookieBalance().toLocaleString();
    }

    async function initDetailPage() {
        if (!campaignId) {
            Swal.fire('ข้อผิดพลาด', 'ไม่พบรหัสกิจกรรมโหวตในระบบ', 'error').then(() => window.history.back());
            return;
        }
        renderWalletStrip();
        setupHeaderFromCache();
        await fetchCandidatesFromBackend();
        setupRealtimeSubscriptions();
    }

    // 🔴 Realtime: ยอดเงินและคะแนนโหวต/ของขวัญของผู้สมัคร เปลี่ยนจากที่ไหนก็ตาม (แท็บอื่น/คนอื่น) -> อัปเดตหน้านี้ทันที
    // Supabase subscriptions only signal "something changed" (no payload) - re-fetch fresh data on each trigger.
    function setupRealtimeSubscriptions() {
        const username = getUsername();
        if (username) {
            blm48SubscribeWallet(username, async () => {
                try {
                    const wallet = await blm48GetWallet(username);
                    if (!wallet || wallet.token === undefined) return;
                    const userData = getUserSession();
                    if (!userData) return;
                    if (wallet.token !== undefined) userData.token = wallet.token;
                    if (wallet.cookie !== undefined) userData.cookie = wallet.cookie;
                    if (wallet.geToken !== undefined) userData.geToken = wallet.geToken;
                    saveUserSession(userData);
                    renderWalletStrip();
                } catch (e) { console.error("Wallet Realtime Refresh Error:", e); }
            });
        }

        blm48SubscribeMajorVoteCandidates(campaignId, () => {
            fetchCandidatesFromBackend();
        });
    }

    let campaignTitle = '';

    function goBack() {
        if (document.referrer && history.length > 1) history.back();
        else window.location.href = 'majorvote';
    }

    // กาง/พับกล่อง Poll detail
    function togglePollDetail() {
        const head = document.getElementById('poll-head');
        const detail = document.getElementById('poll-detail');
        const open = detail.style.display === 'none';
        detail.style.display = open ? 'block' : 'none';
        head.classList.toggle('open', open);
    }

    function formatPollEndDate(endTime) {
        if (!endTime) return '-';
        const d = new Date(endTime);
        if (isNaN(d.getTime())) return '-';
        const pad = n => String(n).padStart(2, '0');
        return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function getPollTokenLabel(tokenType) {
        const t = (tokenType || '').toString().trim().toLowerCase();
        if (t === 'getoken') return 'GE Token';
        if (t === 'gift') return 'Gift (Cookie)';
        if (t === 'cookie') return 'Cookie';
        return 'Token';
    }

    // โหมด Token ของแคมเปญ: burn = หักถาวร, lock = ได้คืนครบเมื่อปิดโหวต, partial = ได้คืนบางส่วนตาม refundPercent
    let campaignMechanic = 'burn';
    let campaignRefundPercent = 0;

    function normalizeMechanic(m) {
        const t = String(m || '').trim().toLowerCase();
        return (t === 'lock' || t === 'partial') ? t : 'burn';
    }

    function getMechanicInfo(mechanic, refundPercent) {
        const pct = Number(refundPercent) || 0;
        if (mechanic === 'lock') return {
            badge: 'Locked', cls: 'mech-lock',
            detail: 'Locked (Your token will be fully returned when the poll closes)',
            confirmNote: 'โหวตแบบ Locked: Token จะถูกล็อกไว้และได้คืนครบ 100% เมื่อปิดโหวต'
        };
        if (mechanic === 'partial') return {
            badge: 'Partially Burned', cls: 'mech-partial',
            detail: `Partially Burned (${pct}% of your token will be returned when the poll closes)`,
            confirmNote: `โหวตแบบ Partially Burned: ได้คืน ${pct}% เมื่อปิดโหวต ส่วนที่เหลือจะถูกหักถาวร`
        };
        return {
            badge: 'Burned', cls: '',
            detail: 'Burned (Your token will be permanently deducted)',
            confirmNote: 'โหวตแบบ Burned: Token จะถูกหักถาวร ไม่ได้คืน'
        };
    }

    function applyMechanicHeader(mechanic, refundPercent) {
        campaignMechanic = normalizeMechanic(mechanic);
        campaignRefundPercent = Number(refundPercent) || 0;
        const info = getMechanicInfo(campaignMechanic, campaignRefundPercent);
        const badge = document.getElementById('pd-badge');
        badge.classList.remove('mech-lock', 'mech-partial');
        if (info.cls) badge.classList.add(info.cls);
        document.getElementById('pd-badge-text').textContent = info.badge;
        document.getElementById('pd-mechanic').textContent = info.detail;
    }

    // เติมแบนเนอร์ + กล่อง Poll detail จากข้อมูลแคมเปญ (VoteCollectionID/Title/Description/CoverImage/EndTime/TokenType/TokenMechanic)
    function applyCampaignHeader(camp) {
        campaignTitle = camp.Title || 'Major Vote';
        document.getElementById('pd-name').textContent = campaignTitle;
        document.getElementById('pd-token').textContent = getPollTokenLabel(camp.TokenType);
        applyMechanicHeader(camp.TokenMechanic, camp.RefundPercent);
        document.getElementById('pd-end').textContent = formatPollEndDate(camp.EndTime);
        document.getElementById('campaign-desc').textContent = camp.Description || 'ร่วมส่งคะแนนโหวตให้กับผู้สมัครที่คุณชื่นชอบ';
        if (camp.CoverImage) {
            const imgEl = document.getElementById('campaign-cover');
            imgEl.src = fixSecureImageUrl(camp.CoverImage);
            imgEl.style.display = 'block';
        }
        const heading = document.querySelector('.ranking-heading');
        if (heading) heading.textContent = campaignTitle;
    }

    function setupHeaderFromCache() {
        try {
            const cachedVotes = localStorage.getItem('blm48_major_votes_cache');
            if (cachedVotes) {
                const list = JSON.parse(cachedVotes);
                const currentCamp = list.find(item => String(item.VoteCollectionID) === String(campaignId));
                if (currentCamp) applyCampaignHeader(currentCamp);
            }
        } catch(e) { console.error("Cache Header Error:", e); }

        // ดึงข้อมูลแคมเปญล่าสุดด้วย (กรณีเปิดลิงก์ตรงโดยไม่มีแคช หรือแอดมินแก้รายละเอียด)
        blm48GetVoteCollections().then(data => {
            if (!Array.isArray(data)) return;
            const c = data.find(item => String(item.voteCollectionId) === String(campaignId));
            if (!c) return;
            applyCampaignHeader({
                Title: c.title, Description: c.description, CoverImage: c.coverImage,
                EndTime: c.endTime, TokenType: c.tokenType,
                TokenMechanic: c.tokenMechanic, RefundPercent: c.refundPercent
            });
        }).catch(e => console.error("Campaign Header Fetch Error:", e));
    }

    async function fetchCandidatesFromBackend() {
        try {
            const result = await blm48GetMajorVoteCandidates(campaignId);

            if (result && result.status === "success" && result.data) {
                const candidates = result.data || [];
                document.getElementById("loading-spinner").style.display = "none";

                campaignEnableGift = !!result.enableGift;
                campaignTokenType = result.tokenType || '';

                if (result.campaignTimeStatus === 'open') {
                    setupVotingMode(candidates);
                } else {
                    setupRankingMode(candidates);
                }
            } else {
                document.getElementById("loading-spinner").innerHTML = `ไม่พบข้อมูลรายชื่อผู้สมัคร`;
            }
        } catch (error) {
            console.error("Fetch API Error:", error);
            document.getElementById("loading-spinner").innerHTML = "เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง";
        }
    }

    let votingCandidates = [];
    let activeGroup = 'All';

    // กลุ่มของผู้สมัครเอามาจากคำท้ายชื่อ เช่น "Emmy BLM48" -> "BLM48" (ตาราง major_vote_candidates ไม่มีคอลัมน์กลุ่ม)
    function getCandidateGroup(name) {
        const parts = String(name || '').trim().split(/\s+/);
        const last = parts.length > 1 ? parts[parts.length - 1] : '';
        return /^[A-Z]+\d+$/i.test(last) ? last.toUpperCase() : 'Others';
    }

    function setupVotingMode(candidates) {
        document.getElementById("ranking-view").style.display = "none";
        votingCandidates = candidates;

        const groups = [...new Set(candidates.map(m => getCandidateGroup(m.MemberName)))];
        if (activeGroup !== 'All' && !groups.includes(activeGroup)) activeGroup = 'All';
        const tabs = document.getElementById("group-tabs");
        tabs.innerHTML = ['All', ...groups].map(g =>
            `<button type="button" class="group-tab ${g === activeGroup ? 'active' : ''}" onclick="selectGroupTab('${escapeAttr(g)}')"><span>${escapeHtml(g)}</span></button>`
        ).join('');
        tabs.style.display = candidates.length ? 'flex' : 'none';

        renderCandidateList();
    }

    function selectGroupTab(group) {
        activeGroup = group;
        document.querySelectorAll('.group-tab').forEach(btn => btn.classList.toggle('active', btn.textContent === group));
        renderCandidateList();
    }

    function renderCandidateList() {
        const container = document.getElementById("voting-view");
        container.style.display = "flex";

        const list = activeGroup === 'All' ? votingCandidates : votingCandidates.filter(m => getCandidateGroup(m.MemberName) === activeGroup);
        if (list.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:#999; padding:20px;">ไม่มีข้อมูลผู้สมัครในกิจกรรมโหวตนี้</div>`;
            return;
        }

        container.innerHTML = list.map(member => {
            const mName = member.MemberName || 'Member';
            const mImg = fixSecureImageUrl(member.ProfileMember || member.ImageURL || member.profile);
            return `
                <div class="candidate-row">
                    <div class="candidate-img-wrapper">
                        <i class="fa-solid fa-user cand-avatar-fallback"></i>
                        <img src="${mImg}" class="candidate-img" alt="${escapeAttr(mName)}" onerror="this.style.display='none';">
                    </div>
                    <div class="candidate-name">${escapeHtml(mName)}</div>
                    <div class="candidate-actions">
                        ${buildCandidateActionButtons(mName, mImg, member.TokenTypes)}
                    </div>
                </div>
            `;
        }).join('');
    }

    // สร้างปุ่มร่วมสนุกตามที่มีจริงสำหรับผู้สมัครคนนี้ (Token / GEToken มาจาก TokenTypes ที่ backend ส่งมา, Gift มาจากค่าเปิด/ปิดของทั้งแคมเปญ)
    function buildCandidateActionButtons(mName, mImg, tokenTypes) {
        const types = Array.isArray(tokenTypes) ? tokenTypes : ['token'];
        let buttons = '';
        if (types.includes('token')) {
            buttons += `
                <button class="vote-action-btn" onclick="handleVoteClick('${escapeAttr(mName)}', 'Token', '${escapeAttr(mImg)}')">
                    Vote
                </button>`;
        }
        if (types.includes('getoken')) {
            buttons += `
                <button class="getoken-action-btn" onclick="handleVoteClick('${escapeAttr(mName)}', 'GEToken', '${escapeAttr(mImg)}')">
                    GE Vote
                </button>`;
        }
        if (campaignEnableGift) {
            buttons += `
                <button class="gift-action-btn" onclick="openGiftModal('${escapeAttr(mName)}', '${escapeAttr(mImg)}')">
                    Gift
                </button>`;
        }
        return buttons;
    }

    function getOrdinal(n) {
        const mod100 = n % 100;
        if (mod100 >= 11 && mod100 <= 13) return n + 'th';
        return n + ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
    }

    // โหมดปิดโหวต: หัวข้อ = ชื่อแคมเปญ, อันดับ 1 เป็นการ์ดเด่นพร้อมเหรียญ, อันดับถัดไปเป็นแถวเรียบ
    function setupRankingMode(candidates) {
        const container = document.getElementById("ranking-view");
        document.getElementById("voting-view").style.display = "none";
        document.getElementById("group-tabs").style.display = "none";
        container.style.display = "flex";

        if (candidates.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:#999; padding:20px; width:100%;">ไม่มีข้อมูลสรุปผลคะแนนโหวตในขณะนี้</div>`;
            return;
        }

        const scoreIcon = getVoteCategoryIcon(campaignTokenType);
        const rows = candidates.map((member, index) => {
            const rank = index + 1;
            const mName = member.MemberName || 'Member';
            const mImg = fixSecureImageUrl(member.ProfileMember || member.ImageURL || member.profile);
            const voteCount = Number(member.CurrentVotes || 0).toLocaleString();
            const percentStr = member.VotePercentage || "0%";
            const placementText = rank === 1 ? 'The winner of this poll is:' : `The ${getOrdinal(rank)} place of this poll is:`;

            return `
                <div class="${rank === 1 ? 'rank-winner' : 'rank-row'}" data-candidate="${escapeAttr(mName)}">
                    <div class="rank-side">
                        <div class="rank-img-wrapper">
                            <i class="fa-solid fa-user cand-avatar-fallback"></i>
                            <img src="${mImg}" class="rank-img" alt="Member" onerror="this.style.display='none';">
                        </div>
                    </div>
                    <div class="rank-info">
                        <span class="rank-status-text">${placementText}</span>
                        <span class="rank-name">${escapeHtml(mName)}</span>
                        <span class="rank-score"><i class="fa-solid ${scoreIcon.icon}" style="color:${scoreIcon.color};"></i> <span class="rank-score-value">${voteCount}</span></span>
                        <span class="rank-percentage">${percentStr}</span>
                    </div>
                    ${rank === 1 ? '<div class="rank-medal">1</div>' : ''}
                </div>
            `;
        }).join('');

        container.innerHTML = `<div class="ranking-heading">${escapeHtml(campaignTitle || 'Major Vote')}</div>${rows}`;
    }

    // กด Vote / GE Vote แล้วไปหน้าโหวตแยก (majorvote_vote): เลือกจำนวน > Confirm transaction > Submission completed > Thank you card
    function handleVoteClick(candidateName, tokenType, candidateImg) {
        tokenType = tokenType === 'GEToken' ? 'GEToken' : 'Token';

        if (!getUsername()) {
            Swal.fire({
                title: 'กรุณาเข้าสู่ระบบ',
                text: 'คุณต้องเข้าสู่ระบบก่อนทำการลงคะแนนโหวต',
                icon: 'warning',
                confirmButtonText: 'ตกลง',
                confirmButtonColor: 'var(--primary-pink)'
            });
            return;
        }

        const params = new URLSearchParams({ id: campaignId, candidate: candidateName, type: tokenType, img: candidateImg || '' });
        window.location.href = `majorvote_vote?${params.toString()}`;
    }

    // =========================================================
    // 🎁 ระบบปาของขวัญ (Gift) ให้ผู้สมัคร — ใช้ Cookies แลกคะแนน
    // (เลือกไอเทม > เลือกจำนวน > กด Send > ป๊อปอัปยืนยัน > Confirm)
    // แท็บ Backpack = ของที่เคยซื้อเก็บไว้ เอามาโหวตได้เลยโดยไม่เสีย Cookie ซ้ำ
    // =========================================================
    let giftCatalog = [];
    let giftCatalogLoaded = false;
    let activeGiftCandidate = "";
    let activeGiftTab = "Normal";
    let selectedGiftId = null;
    let selectedGiftQty = 1;
    let isGiftBusy = false;
    let myGiftWallet = [];

    const GIFT_TIER_LABELS = { Normal: "Normal", MembersDesign: "BLM48" };
    const GIFT_TIER_ORDER = ["Normal", "MembersDesign"];
    const GIFT_BACKPACK_TAB = "__backpack";
    const GIFT_QTY_PRESETS = [1, 10, 50, 100];
    const GIFT_PER_PAGE = 8;
    const GIFT_MAX_CUSTOM_QTY = 9999;
    const BLANK_IMG = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

    async function loadGiftCatalog() {
        if (giftCatalogLoaded) return giftCatalog;
        try {
            // GiftCatalog ตอนนี้ sync เข้า Supabase แบบเรียลไทม์แล้ว อ่านจากตรงนั้นแทน Apps Script
            const data = await blm48GetGiftCatalog();
            if (Array.isArray(data)) {
                giftCatalog = data
                    .filter(g => g.active === true || g.active === undefined)
                    .map(g => ({
                        GiftID: g.giftId,
                        GiftName: g.giftName,
                        Tier: g.tier,
                        CostCookies: g.costCookies,
                        Points: g.points,
                        ImageURL: g.imageUrl,
                        Active: g.active
                    }));
            }
        } catch (e) {
            console.error("Load Gift Catalog Error:", e);
        }
        giftCatalogLoaded = true;
        return giftCatalog;
    }

    async function loadGiftWallet() {
        try {
            const data = await blm48GetGiftWallet(getUsername());
            myGiftWallet = Array.isArray(data) ? data : [];
        } catch (e) {
            console.error("Load Gift Wallet Error:", e);
            myGiftWallet = [];
        }
    }

    function isBackpackTab() {
        return activeGiftTab === GIFT_BACKPACK_TAB;
    }

    function getGiftTiers() {
        let tiers = GIFT_TIER_ORDER.filter(t => giftCatalog.some(g => g.Tier === t));
        const extra = [...new Set(giftCatalog.map(g => g.Tier))].filter(t => t && !tiers.includes(t));
        return tiers.concat(extra);
    }

    // รวมไอเทมของแท็บปัจจุบันให้อยู่รูปแบบเดียวกัน ไม่ว่าจะมาจากร้านค้าหรือ Backpack
    function getActiveGiftItems() {
        if (isBackpackTab()) {
            return myGiftWallet.map(g => ({
                id: String(g.giftId), rawId: g.giftId, name: g.giftName, img: g.imageUrl,
                cost: 0, points: Number(g.points || 0), owned: Number(g.qty || 0)
            }));
        }
        return giftCatalog.filter(g => g.Tier === activeGiftTab).map(g => ({
            id: String(g.GiftID), rawId: g.GiftID, name: g.GiftName, img: g.ImageURL,
            cost: Number(g.CostCookies || 0), points: Number(g.Points || 0), owned: null
        }));
    }

    function getSelectedGiftItem() {
        return getActiveGiftItems().find(g => g.id === String(selectedGiftId)) || null;
    }

    function getMaxGiftQty() {
        const item = getSelectedGiftItem();
        return (item && item.owned !== null) ? item.owned : GIFT_MAX_CUSTOM_QTY;
    }

    async function openGiftModal(candidateName, candidateImg) {
        const username = getUsername();
        if (!username) {
            Swal.fire({
                title: 'กรุณาเข้าสู่ระบบ',
                text: 'คุณต้องเข้าสู่ระบบก่อนส่งของขวัญให้เมมเบอร์',
                icon: 'warning',
                confirmButtonText: 'ตกลง',
                confirmButtonColor: 'var(--primary-pink)'
            });
            return;
        }

        activeGiftCandidate = candidateName;
        selectedGiftId = null;
        selectedGiftQty = 1;

        document.getElementById('gift-modal-target').textContent = candidateName;
        document.getElementById('gift-modal-avatar').src = fixSecureImageUrl(candidateImg);
        document.getElementById('gift-modal-overlay').style.display = 'flex';
        document.getElementById('gift-tabs').innerHTML = '';
        document.getElementById('gift-dots').innerHTML = '';
        document.getElementById('gift-pager').innerHTML = `<div class="gift-loading"><i class="fa-solid fa-spinner fa-spin"></i>&nbsp; กำลังโหลด...</div>`;
        renderQtyRow();
        updateGiftSendBar();

        await loadGiftCatalog();

        // เปิดโมดัลใหม่ทุกครั้งให้เริ่มที่หมวดแรกของร้านค้าเสมอ (ถ้าร้านว่างก็ไปที่ Backpack)
        const tiers = getGiftTiers();
        await selectGiftTab(tiers[0] || GIFT_BACKPACK_TAB);
    }

    function closeGiftModal() {
        closeGiftConfirm();
        document.getElementById('gift-modal-overlay').style.display = 'none';
    }

    function renderGiftTabs() {
        const tabs = getGiftTiers().map(t => ({ key: t, label: GIFT_TIER_LABELS[t] || t }));
        tabs.push({ key: GIFT_BACKPACK_TAB, label: 'Backpack' });
        document.getElementById('gift-tabs').innerHTML = tabs.map(t => `
            <button type="button" class="gift-tab ${t.key === activeGiftTab ? 'active' : ''}" onclick="selectGiftTab('${escapeAttr(t.key)}')">${escapeAttr(t.label)}</button>
        `).join('');
    }

    async function selectGiftTab(tab) {
        activeGiftTab = tab;
        selectedGiftId = null; // สลับแท็บแล้วให้เลือกไอเทมใหม่ กันสับสนว่าเลือกอันไหนไว้
        selectedGiftQty = 1;
        renderGiftTabs();
        renderQtyRow();
        updateGiftSendBar();

        if (tab === GIFT_BACKPACK_TAB) {
            document.getElementById('gift-dots').innerHTML = '';
            document.getElementById('gift-pager').innerHTML = `<div class="gift-loading"><i class="fa-solid fa-spinner fa-spin"></i>&nbsp; กำลังเปิด Backpack...</div>`;
            await loadGiftWallet();
            if (!isBackpackTab()) return; // ผู้ใช้สลับแท็บไปแล้วระหว่างรอโหลด
        }
        renderGiftItems();
    }

    function renderGiftItems() {
        const pager = document.getElementById('gift-pager');
        const dots = document.getElementById('gift-dots');
        const items = getActiveGiftItems();

        if (!items.length) {
            pager.innerHTML = isBackpackTab()
                ? `<div class="gift-empty">Backpack ของคุณยังว่างอยู่ค่ะ<br>ซื้อของขวัญเก็บไว้ก่อนได้ ตอนกด Send ในแท็บร้านค้า</div>`
                : `<div class="gift-empty">ยังไม่มีของขวัญในหมวดนี้</div>`;
            dots.innerHTML = '';
            return;
        }

        const pages = [];
        for (let i = 0; i < items.length; i += GIFT_PER_PAGE) pages.push(items.slice(i, i + GIFT_PER_PAGE));

        pager.innerHTML = pages.map(page => `
            <div class="gift-page">
                ${page.map(item => `
                    <div class="gift-item-card ${item.id === String(selectedGiftId) ? 'selected' : ''}" data-gift-id="${escapeAttr(item.id)}" onclick="selectGiftItem('${escapeAttr(item.id)}')">
                        <img src="${fixSecureImageUrl(item.img)}" class="gift-item-img" alt="" onerror="this.src='${BLANK_IMG}'">
                        <div class="gift-item-name">${escapeAttr(item.name)}</div>
                        <div class="gift-item-cost">${item.owned !== null
                            ? `x${item.owned.toLocaleString()}`
                            : `<i class="fa-solid fa-cookie-bite"></i>${item.cost.toLocaleString()}`}</div>
                    </div>
                `).join('')}
            </div>
        `).join('');
        pager.scrollLeft = 0;

        dots.innerHTML = pages.length > 1
            ? pages.map((_, i) => `<span class="gift-dot ${i === 0 ? 'active' : ''}"></span>`).join('')
            : '';
    }

    function updateGiftPageDots() {
        const pager = document.getElementById('gift-pager');
        const page = Math.round(pager.scrollLeft / Math.max(1, pager.clientWidth));
        document.querySelectorAll('#gift-dots .gift-dot').forEach((d, i) => d.classList.toggle('active', i === page));
    }

    function selectGiftItem(giftId) {
        selectedGiftId = giftId;
        // สลับแค่คลาส ไม่ render ใหม่ทั้งกริด จะได้ไม่เด้งกลับหน้าแรก
        document.querySelectorAll('#gift-pager .gift-item-card').forEach(card => {
            card.classList.toggle('selected', card.dataset.giftId === String(giftId));
        });
        selectedGiftQty = Math.min(selectedGiftQty, Math.max(1, getMaxGiftQty()));
        renderQtyRow();
        updateGiftSendBar();
    }

    function renderQtyRow() {
        const maxQty = getMaxGiftQty();
        const isCustom = !GIFT_QTY_PRESETS.includes(selectedGiftQty);
        document.getElementById('gift-qty-row').innerHTML = GIFT_QTY_PRESETS.map(q => `
            <button type="button" class="gift-qty-btn ${q === selectedGiftQty ? 'active' : ''}" onclick="selectGiftQuantity(${q})" ${q > maxQty ? 'disabled' : ''}>×${q}</button>
        `).join('') + `
            <button type="button" class="gift-qty-btn custom ${isCustom ? 'active' : ''}" onclick="openCustomGiftQty()">${isCustom ? `×${selectedGiftQty.toLocaleString()}` : 'Customize'}</button>
        `;
    }

    function selectGiftQuantity(qty) {
        selectedGiftQty = qty;
        renderQtyRow();
        updateGiftSendBar();
    }

    async function openCustomGiftQty() {
        const maxQty = getMaxGiftQty();
        const { value } = await Swal.fire({
            title: 'ระบุจำนวน',
            input: 'number',
            inputValue: selectedGiftQty,
            inputAttributes: { min: 1, max: maxQty, step: 1, inputmode: 'numeric' },
            showCancelButton: true,
            confirmButtonText: 'ตกลง',
            cancelButtonText: 'ยกเลิก',
            confirmButtonColor: '#ffd75e',
            inputValidator: (v) => {
                const n = Number(v);
                if (!Number.isInteger(n) || n < 1) return 'กรุณาใส่จำนวนเต็มตั้งแต่ 1 ขึ้นไป';
                if (n > maxQty) return `ใส่ได้สูงสุด ${maxQty.toLocaleString()} ชิ้น`;
            }
        });
        if (value) selectGiftQuantity(Number(value));
    }

    function updateGiftSendBar() {
        document.getElementById('gift-modal-cookie-balance').textContent = getUserCookieBalance().toLocaleString();
        document.getElementById('gift-send-btn').disabled = !getSelectedGiftItem() || isGiftBusy;
    }

    function applyCookieBalance(res, totalCost) {
        // อัปเดตยอด Cookie ในเซสชันให้ตรงกับหลังบ้านทันที
        try {
            const sessionUpdate = JSON.parse(localStorage.getItem('bnl_session'));
            const userData = sessionUpdate.data || sessionUpdate.user || sessionUpdate;
            userData.cookie = (res.newBalance !== undefined) ? Number(res.newBalance) : Math.max(0, Number(userData.cookie || 0) - totalCost);
            localStorage.setItem('bnl_session', JSON.stringify(sessionUpdate));
            renderWalletStrip();
        } catch (e) { console.error("Session Update Error:", e); }
    }

    function warnNotEnoughCookies(totalCost) {
        const balance = getUserCookieBalance();
        Swal.fire({
            title: 'คุกกี้ไม่พอ',
            text: `คุณมี ${balance.toLocaleString()} Cookies แต่ต้องใช้ ${totalCost.toLocaleString()} Cookies`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'เติม Cookie',
            cancelButtonText: 'ปิด',
            confirmButtonColor: '#ffd75e'
        }).then(r => { if (r.isConfirmed) window.location.href = 'shop.html'; });
    }

    function showGiftError(title, text) {
        Swal.fire({ title, text, icon: 'error', confirmButtonText: 'ตกลง', confirmButtonColor: 'var(--primary-pink)' });
    }

    function openGiftConfirm() {
        const item = getSelectedGiftItem();
        if (!item || isGiftBusy) return;

        const totalCost = item.cost * selectedGiftQty;
        const totalPoints = item.points * selectedGiftQty;
        if (!isBackpackTab() && getUserCookieBalance() < totalCost) {
            warnNotEnoughCookies(totalCost);
            return;
        }

        const pill = isBackpackTab()
            ? `มีอยู่ x${item.owned.toLocaleString()}`
            : `<i class="fa-solid fa-cookie-bite"></i>${item.cost.toLocaleString()}`;
        const total = isBackpackTab()
            ? `<div class="gift-confirm-total"><i class="fa-solid fa-star"></i>${totalPoints.toLocaleString()}</div>
               <div class="gift-confirm-note">คะแนนโหวต · ใช้ของจาก Backpack ไม่หัก Cookie</div>`
            : `<div class="gift-confirm-total"><i class="fa-solid fa-cookie-bite"></i>${totalCost.toLocaleString()}</div>
               ${totalPoints ? `<div class="gift-confirm-note">ได้ +${totalPoints.toLocaleString()} คะแนนโหวตให้ ${escapeAttr(activeGiftCandidate)}</div>` : ''}`;

        document.getElementById('gift-confirm-body').innerHTML = `
            <div class="gift-confirm-item">
                <div class="gift-confirm-item-col">
                    <img src="${fixSecureImageUrl(item.img)}" alt="" onerror="this.src='${BLANK_IMG}'">
                    <div class="gift-item-name">${escapeAttr(item.name)}</div>
                    <div class="gift-item-cost">${pill}</div>
                </div>
                <div class="gift-confirm-qty">× ${selectedGiftQty.toLocaleString()}</div>
            </div>
            <div class="gift-confirm-divider">Equal</div>
            ${total}
        `;
        document.getElementById('gift-confirm-keep').style.display = isBackpackTab() ? 'none' : 'block';
        document.getElementById('gift-confirm-overlay').style.display = 'flex';
    }

    function closeGiftConfirm() {
        document.getElementById('gift-confirm-overlay').style.display = 'none';
    }

    function confirmGiftSend() {
        closeGiftConfirm();
        if (isBackpackTab()) giveSelectedWalletGift();
        else sendSelectedGift();
    }

    function confirmGiftKeep() {
        closeGiftConfirm();
        buySelectedGiftToWallet();
    }

    function setGiftBusy(busy) {
        isGiftBusy = busy;
        const btn = document.getElementById('gift-send-btn');
        btn.innerHTML = busy ? '<i class="fa-solid fa-spinner fa-spin"></i>' : 'Send';
        updateGiftSendBar();
    }

    function resetGiftSelection() {
        selectedGiftId = null;
        selectedGiftQty = 1;
        renderGiftItems();
        renderQtyRow();
        updateGiftSendBar();
    }

    async function sendSelectedGift() {
        const item = getSelectedGiftItem();
        if (!item || isGiftBusy) return;
        const qty = selectedGiftQty;
        const totalCost = item.cost * qty;
        if (getUserCookieBalance() < totalCost) { warnNotEnoughCookies(totalCost); return; }

        setGiftBusy(true);
        try {
            const res = await blm48SendGift(getUsername(), campaignId, activeGiftCandidate, item.rawId, qty);
            if (res.status === "success") {
                applyCookieBalance(res, totalCost);
                Swal.fire({ icon: 'success', title: `ส่ง "${item.name}" x${qty} ให้ ${activeGiftCandidate} สำเร็จ`, timer: 1400, showConfirmButton: false });
                // รีเซ็ตกลับไปเลือกใหม่ได้ทันที (โมดัลยังเปิดอยู่ ไม่ต้องกดปุ่ม Gift ซ้ำ)
                resetGiftSelection();
                fetchCandidatesFromBackend();
            } else {
                showGiftError('ส่งของขวัญไม่สำเร็จ', res.message || 'เกิดข้อผิดพลาดในการตรวจสอบสิทธิ์หรือการหักคุกกี้');
            }
        } catch (err) {
            console.error("Send Gift Error:", err);
            showGiftError('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้ในขณะนี้ กรุณาลองใหม่อีกครั้งในภายหลัง');
        } finally {
            setGiftBusy(false);
        }
    }

    // ซื้อของขวัญเก็บเข้า Backpack (จ่าย Cookie ทันทีเหมือนกัน แต่ยังไม่โหวตให้ใคร ไปโหวตทีหลังได้ที่แท็บ Backpack)
    async function buySelectedGiftToWallet() {
        const item = getSelectedGiftItem();
        if (!item || isGiftBusy) return;
        const qty = selectedGiftQty;
        const totalCost = item.cost * qty;
        if (getUserCookieBalance() < totalCost) { warnNotEnoughCookies(totalCost); return; }

        setGiftBusy(true);
        try {
            const res = await blm48BuyGiftWallet(getUsername(), item.rawId, qty);
            if (res.status === "success") {
                applyCookieBalance(res, totalCost);
                Swal.fire({ icon: 'success', title: `เก็บ "${item.name}" x${qty} เข้า Backpack แล้ว`, text: 'ไปโหวตให้เมมเบอร์ได้ทีหลังที่แท็บ Backpack', timer: 1800, showConfirmButton: false });
                resetGiftSelection();
            } else {
                showGiftError('เก็บของขวัญไม่สำเร็จ', res.message || 'เกิดข้อผิดพลาดในการตรวจสอบสิทธิ์หรือการหักคุกกี้');
            }
        } catch (err) {
            console.error("Buy Gift To Wallet Error:", err);
            showGiftError('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้ในขณะนี้ กรุณาลองใหม่อีกครั้งในภายหลัง');
        } finally {
            setGiftBusy(false);
        }
    }

    async function giveSelectedWalletGift() {
        const item = getSelectedGiftItem();
        if (!item || isGiftBusy) return;
        const qty = selectedGiftQty;

        setGiftBusy(true);
        try {
            const res = await blm48GiveGiftWallet(getUsername(), campaignId, activeGiftCandidate, item.rawId, qty);
            if (res.status === "success") {
                Swal.fire({ icon: 'success', title: `โหวตให้ ${activeGiftCandidate} ด้วย "${item.name}" x${qty} สำเร็จ`, timer: 1400, showConfirmButton: false });
                // หักจำนวนในกระเป๋าฝั่งหน้าจอทันที ไม่ต้องรอโหลดใหม่
                myGiftWallet = myGiftWallet
                    .map(g => String(g.giftId) === item.id ? { ...g, qty: Number(g.qty) - qty } : g)
                    .filter(g => Number(g.qty) > 0);
                resetGiftSelection();
                fetchCandidatesFromBackend();
            } else {
                showGiftError('โหวตไม่สำเร็จ', res.message || 'เกิดข้อผิดพลาดในการตรวจสอบของขวัญในกระเป๋า');
            }
        } catch (err) {
            console.error("Give Wallet Gift Error:", err);
            showGiftError('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้ในขณะนี้ กรุณาลองใหม่อีกครั้งในภายหลัง');
        } finally {
            setGiftBusy(false);
        }
    }

    document.getElementById('gift-pager').addEventListener('scroll', updateGiftPageDots, { passive: true });

    document.addEventListener("DOMContentLoaded", initDetailPage);
</script>
</body>
</html>
