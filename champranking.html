<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLM48 Membership | Monthly Ranking</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffc0cb">

    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s192">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>

    <style>
        :root {
            --blm-pink: #ff85a2;
            --blm-light-pink: #fff0f5;
            --text-dark: #4a4a4a;
            --text-muted: #9e9e9e;
            --glass-card: rgba(255, 255, 255, 0.95);
            --rank-gold: #ffb703;
            --rank-silver: #b0b6bd;
            --rank-bronze: #e0895e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Quicksand', 'Kanit', sans-serif;
            background-attachment: fixed;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(var(--glass-blur-lg));
            -webkit-backdrop-filter: blur(var(--glass-blur-lg));
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 2px 10px rgba(255, 133, 162, 0.06);
            z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-back-btn {
            color: var(--blm-pink);
            font-size: 1.1rem;
            text-decoration: none;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--blm-light-pink);
        }

        .nav-title {
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--blm-pink);
            letter-spacing: 0.5px;
        }

        .nav-spacer { width: 35px; }

        .main-container {
            width: 100%;
            padding: 85px 16px 40px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ranking-page-wrapper {
            max-width: 800px;
            width: 100%;
        }

        /* 🏆 การ์ดผู้ชนะด้านบน */
        .winner-card {
            position: relative;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(var(--glass-blur-lg));
            -webkit-backdrop-filter: blur(var(--glass-blur-lg));
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            padding: 28px 20px 24px 20px;
            box-shadow: var(--glass-shadow-lg);
            text-align: center;
            overflow: hidden;
            animation: fadeInCard 0.4s ease-out;
        }

        .winner-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% -10%, rgba(255, 183, 3, 0.14), transparent 60%);
            pointer-events: none;
        }

        .confetti-icon {
            position: absolute;
            font-size: 1.1rem;
            opacity: 0.55;
            pointer-events: none;
        }

        .period-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 16px;
            position: relative;
        }

        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 14px auto;
        }

        .avatar-frame {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--rank-gold), #fff3cd, #ffe066);
            padding: 4px;
            box-shadow: 0 4px 12px rgba(255, 183, 3, 0.2);
        }

        .member-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #fff;
        }

        .crown-icon {
            position: absolute;
            bottom: -2px;
            right: -2px;
            color: var(--rank-gold);
            font-size: 1rem;
            background: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--rank-gold);
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }

        .winner-name {
            margin: 0 0 8px 0;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-dark);
            position: relative;
        }

        .winner-cookies {
            font-size: 1.1rem;
            color: var(--text-dark);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
        }

        .winner-cookies i {
            color: var(--blm-pink);
        }

        /* 📋 รายการอันดับที่เหลือ */
        .ranking-list {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .rank-row {
            background: var(--glass-bg-strong);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            animation: fadeInRow 0.35s ease-out backwards;
        }

        .rank-indicator {
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .rank-indicator.rank-2 { color: var(--rank-silver); font-size: 1.2rem; }
        .rank-indicator.rank-3 { color: var(--rank-bronze); font-size: 1.2rem; }

        .rank-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background-color: #fff;
            border: 2px solid var(--blm-light-pink);
        }

        .rank-name {
            flex: 1;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-dark);
            min-width: 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .rank-name span.name-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 🎓 ป้ายสถานะแบบสีเทา - เหมือนหน้า champ */
        .grad-badge {
            font-size: 0.65rem;
            color: #ffffff;
            background-color: #a8a8a8;
            padding: 1px 6px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* 🎓 ไอคอนหมวกปริญญามุมบนซ้ายของรูปโปรไฟล์ */
        .grad-icon-profile {
            position: absolute;
            top: -3px;
            left: -3px;
            background-color: #a8a8a8;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8px;
            border: 2px solid white;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .rank-avatar-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .rank-cookies {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .rank-cookies i {
            color: var(--blm-pink);
            font-size: 0.85rem;
        }

        .skeleton-anim {
            background: linear-gradient(90deg, #f3f3f3 25%, #eaeaea 37%, #f3f3f3 63%);
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
        }

        @keyframes skeleton-loading {
            0% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInRow {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-state, .error-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .error-state i {
            color: #e63946;
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: block;
        }

        @media (min-width: 768px) {
            .winner-card { padding: 36px 30px 30px 30px; }
            .avatar-wrapper { width: 130px; height: 130px; }
            .winner-name { font-size: 1.7rem; }
        }
    </style>
</head>
<body class="glass-mesh-bg force-white-bg">

    <div class="top-navbar">
        <a href="champ" class="nav-back-btn">
            <i class="fas fa-chevron-left"></i>
        </a>
        <div class="nav-title">Monthly Ranking</div>
        <div class="nav-spacer"></div>
    </div>

    <div class="main-container">
        <div class="ranking-page-wrapper" id="ranking-page-wrapper">
            <div class="winner-card">
                <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
                    <div class="skeleton-anim" style="width:100px; height:100px; border-radius:50%;"></div>
                    <div class="skeleton-anim" style="width:120px; height:16px; border-radius:4px;"></div>
                    <div class="skeleton-anim" style="width:160px; height:22px; border-radius:4px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CONFETTI_ICONS = ['fa-crown', 'fa-star', 'fa-heart'];
        const CONFETTI_POSITIONS = [
            { top: '10%', left: '8%', rotate: '-15deg' },
            { top: '18%', right: '10%', rotate: '12deg' },
            { top: '55%', left: '4%', rotate: '20deg' },
            { top: '60%', right: '6%', rotate: '-10deg' }
        ];

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const indexParam = urlParams.get('index');
            const wrapper = document.getElementById('ranking-page-wrapper');

            if (indexParam === null) {
                showError("ไม่พบข้อมูลพารามิเตอร์ของเดือนที่ต้องการดูอันดับค่ะ");
                return;
            }

            const targetIndex = Number(indexParam);
            let champData = null;

            const localData = sessionStorage.getItem('blm_champ_history');
            if (localData) {
                try {
                    const parsed = JSON.parse(localData);
                    if (parsed && parsed[targetIndex]) champData = parsed[targetIndex];
                } catch (e) {}
            }

            if (!champData) {
                try {
                    const result = await blm48GetChampOfTheMonth();
                    if (result.status === "success" && result.data && result.data[targetIndex]) {
                        champData = result.data[targetIndex];
                        sessionStorage.setItem('blm_champ_history', JSON.stringify(result.data));
                    }
                } catch (error) {
                    console.error("Fetch API error:", error);
                }
            }

            if (!champData) {
                showError("ไม่พบข้อมูลเกียรติยศของเมมเบอร์คนดังกล่าวในทำเนียบแชมป์ค่ะ");
                return;
            }

            if (!champData.yearMonth) {
                showError("ไม่สามารถระบุเดือนของอันดับนี้ได้ค่ะ");
                return;
            }

            document.querySelector('.nav-title').textContent = `Ranking · ${champData.monthYear || ''}`;

            try {
                const rankingResult = await blm48GetRankingFull(champData.yearMonth);
                const rankingList = Array.isArray(rankingResult) ? rankingResult : [];
                renderRankingPage(champData, rankingList);
            } catch (error) {
                console.error("Ranking fetch error:", error);
                showError("ระบบขัดข้อง กรุณาลองใหม่อีกครั้งงับ");
            }
        });

        function renderRankingPage(champData, rankingList) {
            const wrapper = document.getElementById('ranking-page-wrapper');

            const winnerAvatar = champData.profileImage || 'https://lh3.googleusercontent.com/d/1rebp2F8vyP0nyvsEOFD9Nw2mPcRtVqtG=s400';
            const winnerCookies = Number(champData.totalCookie || 0).toLocaleString();
            const winnerIsGraduated = champData.status === 'Graduated' || champData.status === 'Not in System';
            const winnerGradIcon = winnerIsGraduated ? `<div class="grad-icon-profile"><i class="fa-solid fa-graduation-cap"></i></div>` : '';
            const winnerGradBadge = winnerIsGraduated ? `<span class="grad-badge"><i class="fa-solid fa-graduation-cap"></i> GRADUATED</span>` : '';

            const confettiHtml = CONFETTI_POSITIONS.map((pos, i) => {
                const style = Object.entries(pos).filter(([k]) => k !== 'rotate').map(([k, v]) => `${k}:${v}`).join(';');
                return `<i class="fa-solid ${CONFETTI_ICONS[i % CONFETTI_ICONS.length]} confetti-icon" style="${style}; transform: rotate(${pos.rotate}); color:${i % 2 === 0 ? 'var(--rank-gold)' : 'var(--blm-pink)'};"></i>`;
            }).join('');

            let html = `
                <div class="winner-card">
                    ${confettiHtml}
                    <div class="period-title">The Winner &nbsp;${escapeHtml(champData.monthYear || '')}</div>
                    <div class="avatar-wrapper">
                        <div class="avatar-frame">
                            ${winnerGradIcon}
                            <img class="member-avatar" src="${winnerAvatar}" alt="${escapeHtml(champData.name || '')}" onerror="this.src='https://lh3.googleusercontent.com/d/1rebp2F8vyP0nyvsEOFD9Nw2mPcRtVqtG=s400'">
                        </div>
                        <div class="crown-icon"><i class="fa-solid fa-crown"></i></div>
                    </div>
                    <h1 class="winner-name">${escapeHtml(champData.name || 'Unknown Member')} ${winnerGradBadge}</h1>
                    <div class="winner-cookies"><i class="fa-solid fa-cookie"></i> ${winnerCookies} Cookies</div>
                </div>
                <div class="ranking-list" id="ranking-list-body"></div>
            `;
            wrapper.innerHTML = html;

            const listBody = document.getElementById('ranking-list-body');

            // อันดับ 2 เป็นต้นไปทั้งหมด: ตัดคนที่เป็นแชมป์ (ตามชื่อ) ออกจากลิสต์ แทนการตัด index แรกทิ้งเฉยๆ
            // เพราะข้อมูล ranking_monthly อาจขยับหลังจากบันทึกแชมป์ไปแล้ว ทำให้แชมป์ไม่ได้อยู่อันดับ 1 ของไลฟ์เดตาเสมอไป
            const champNameLower = (champData.name || '').toString().trim().toLowerCase();
            let champRemoved = false;
            const restRanking = rankingList.filter(m => {
                const nameLower = (m.name || '').toString().trim().toLowerCase();
                if (!champRemoved && nameLower === champNameLower) {
                    champRemoved = true;
                    return false;
                }
                return true;
            });

            if (restRanking.length === 0) {
                listBody.innerHTML = `<div class="empty-state">ยังไม่มีข้อมูลอันดับอื่นในเดือนนี้ค่ะ</div>`;
                return;
            }

            const fragment = document.createDocumentFragment();

            restRanking.forEach((member, i) => {
                const rank = i + 2; // เริ่มที่อันดับ 2
                const avatarImg = member.profile_img || 'https://lh3.googleusercontent.com/d/1rebp2F8vyP0nyvsEOFD9Nw2mPcRtVqtG=s400';
                const cookieCount = Number(member.monthly_cookies || 0).toLocaleString();

                let rankBadge;
                if (rank === 2) rankBadge = `<i class="fa-solid fa-crown"></i>`;
                else if (rank === 3) rankBadge = `<i class="fa-solid fa-crown"></i>`;
                else rankBadge = rank;

                const rankClass = rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';

                const isGraduated = member.status === 'Graduated';
                const gradIcon = isGraduated ? `<div class="grad-icon-profile"><i class="fa-solid fa-graduation-cap"></i></div>` : '';
                const gradBadge = isGraduated ? `<span class="grad-badge"><i class="fa-solid fa-graduation-cap"></i> GRADUATED</span>` : '';

                const row = document.createElement('div');
                row.className = 'rank-row';
                row.style.animationDelay = `${Math.min(i, 20) * 0.04}s`;
                row.innerHTML = `
                    <div class="rank-indicator ${rankClass}">${rankBadge}</div>
                    <div class="rank-avatar-wrapper">
                        ${gradIcon}
                        <img class="rank-avatar" loading="lazy" src="${avatarImg}" alt="${escapeHtml(member.name || '')}" onerror="this.src='https://lh3.googleusercontent.com/d/1rebp2F8vyP0nyvsEOFD9Nw2mPcRtVqtG=s400'">
                    </div>
                    <div class="rank-name"><span class="name-text">${escapeHtml(member.name || 'Unknown')}</span> ${gradBadge}</div>
                    <div class="rank-cookies"><i class="fa-solid fa-cookie"></i> ${cookieCount}</div>
                `;
                fragment.appendChild(row);
            });

            listBody.appendChild(fragment);
        }

        function showError(msg) {
            const wrapper = document.getElementById('ranking-page-wrapper');
            wrapper.innerHTML = `
                <div class="error-state">
                    <i class="fa-solid fa-circle-xmark"></i>
                    <div>${msg}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
