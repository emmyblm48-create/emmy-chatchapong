<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLM48 Membership | Monthly Ranking</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffc0cb">

    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s192">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>

    <style>
        /* หน้าตาเดียวกับ specialfansday.html (การ์ดอันดับ 1 + แถวอันดับ) แต่ไม่มีไทม์ไลน์ / ปุ่ม Send Cookie / ลูกศรขึ้นลง */
        :root {
            --blm-pink: #ff85a2;
            --blm-light-pink: #fff0f5;
            --blm-yellow: #ffc107;
            --text-dark: #4a4a4a;
            --text-muted: #9e9e9e;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Quicksand', 'Kanit', sans-serif;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(var(--glass-blur-lg));
            -webkit-backdrop-filter: blur(var(--glass-blur-lg));
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 2px 10px rgba(255, 133, 162, 0.06);
            z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
        }
        .nav-back-btn {
            color: var(--blm-pink); font-size: 1.1rem; text-decoration: none;
            width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: var(--blm-light-pink);
        }
        .nav-title { font-weight: 600; font-size: 1.2rem; color: var(--blm-pink); letter-spacing: 0.5px; }
        .nav-spacer { width: 35px; }

        .main-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 78px 12px 40px 12px;
        }

        /* 🥇 การ์ดอันดับ 1 (แชมป์) */
        .top1-card {
            position: relative;
            background: #fff;
            border: 1px solid #f1f1f1;
            border-radius: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            padding: 26px 16px 22px;
            text-align: center;
            overflow: hidden;
            margin: 4px 0 8px;
        }
        .top1-decor { position: absolute; inset: 0; pointer-events: none; }
        .top1-decor i { position: absolute; opacity: 0.85; }
        .top1-avatar-wrap { position: relative; width: 104px; height: 104px; margin: 0 auto; }
        .top1-avatar {
            width: 104px; height: 104px; border-radius: 50%; object-fit: cover;
            border: 3px solid #ffde5b; background: #fff;
        }
        .top1-crown {
            position: absolute; right: -2px; bottom: 2px;
            width: 30px; height: 30px; border-radius: 50%;
            background: #fff; display: flex; align-items: center; justify-content: center;
            color: #f5a623; font-size: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        .top1-name { margin-top: 12px; font-size: 20px; font-weight: 600; position: relative; }
        .top1-cookie { margin-top: 4px; font-size: 22px; font-weight: 700; color: #666; position: relative; }

        /* 📋 อันดับ 2 เป็นต้นไป */
        .rank-row {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 6px;
        }
        .rank-col { width: 34px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
        .rank-num {
            width: 26px; height: 26px; border-radius: 50%;
            border: 1.5px solid #444; color: #333;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
        }
        .rank-medal { font-size: 18px; }
        .rank-avatar-wrap { position: relative; flex-shrink: 0; }
        .rank-avatar {
            width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: block;
            border: 2px solid #ffde5b; background: #fff;
        }
        .rank-info { flex: 1; min-width: 0; }
        .rank-name { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rank-cookie { font-size: 16px; font-weight: 700; color: #777; margin-top: 2px; }
        .rank-cookie i, .top1-cookie i { color: #d2691e; margin-right: 4px; }

        /* 🎓 เมมเบอร์ที่จบการศึกษาแล้ว */
        .grad-badge {
            font-size: 0.65rem; color: #ffffff; background-color: #a8a8a8;
            padding: 1px 6px; border-radius: 10px; vertical-align: middle;
            display: inline-flex; align-items: center; gap: 3px;
            font-weight: 600; text-transform: uppercase;
        }
        .grad-icon-profile {
            position: absolute; top: -3px; left: -3px; z-index: 2;
            background-color: #a8a8a8; color: white; border-radius: 50%;
            width: 20px; height: 20px; display: flex; justify-content: center; align-items: center;
            font-size: 9px; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .skeleton-anim {
            background: linear-gradient(90deg, #f3f3f3 25%, #eaeaea 37%, #f3f3f3 63%);
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
        }
        @keyframes skeleton-loading {
            0% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .state-msg { text-align: center; color: #999; padding: 30px 0; font-size: 14px; }
        .error-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.95rem; }
        .error-state i { color: #e63946; font-size: 1.8rem; margin-bottom: 10px; display: block; }
    </style>
</head>
<body class="glass-mesh-bg force-white-bg">

    <div class="top-navbar">
        <a href="champ" class="nav-back-btn">
            <i class="fas fa-chevron-left"></i>
        </a>
        <div class="nav-title">Monthly Ranking</div>
        <div class="nav-spacer"></div>
    </div>

    <div class="main-container">
        <div class="ranking-page-wrapper" id="ranking-page-wrapper">
            <div class="top1-card">
                <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
                    <div class="skeleton-anim" style="width:104px; height:104px; border-radius:50%;"></div>
                    <div class="skeleton-anim" style="width:120px; height:18px; border-radius:4px;"></div>
                    <div class="skeleton-anim" style="width:140px; height:22px; border-radius:4px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_AVATAR = 'https://lh3.googleusercontent.com/d/1rebp2F8vyP0nyvsEOFD9Nw2mPcRtVqtG=s400';
        // ไอคอนตกแต่งการ์ดอันดับ 1 ชุดเดียวกับ specialfansday.html: [ไอคอน, x%, y%, ขนาด, สี]
        const TOP1_DECOR = [
            ['fa-crown', 8, 14, 22, '#ffd56b'], ['fa-crown', 78, 8, 20, '#ffd56b'], ['fa-crown', 20, 62, 24, '#ffd56b'],
            ['fa-crown', 84, 66, 22, '#ffd56b'], ['fa-heart', 30, 10, 12, '#ffb3c1'], ['fa-heart', 70, 40, 12, '#c9a7e8'],
            ['fa-star', 12, 40, 12, '#ffd56b'], ['fa-star', 90, 30, 11, '#ffb3c1'], ['fa-star', 60, 12, 10, '#c9a7e8']
        ];

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const indexParam = urlParams.get('index');
            const wrapper = document.getElementById('ranking-page-wrapper');

            if (indexParam === null) {
                showError("ไม่พบข้อมูลพารามิเตอร์ของเดือนที่ต้องการดูอันดับค่ะ");
                return;
            }

            const targetIndex = Number(indexParam);
            let champData = null;

            const localData = sessionStorage.getItem('blm_champ_history');
            if (localData) {
                try {
                    const parsed = JSON.parse(localData);
                    if (parsed && parsed[targetIndex]) champData = parsed[targetIndex];
                } catch (e) {}
            }

            if (!champData) {
                try {
                    const result = await blm48GetChampOfTheMonth();
                    if (result.status === "success" && result.data && result.data[targetIndex]) {
                        champData = result.data[targetIndex];
                        sessionStorage.setItem('blm_champ_history', JSON.stringify(result.data));
                    }
                } catch (error) {
                    console.error("Fetch API error:", error);
                }
            }

            if (!champData) {
                showError("ไม่พบข้อมูลเกียรติยศของเมมเบอร์คนดังกล่าวในทำเนียบแชมป์ค่ะ");
                return;
            }

            if (!champData.yearMonth) {
                showError("ไม่สามารถระบุเดือนของอันดับนี้ได้ค่ะ");
                return;
            }

            document.querySelector('.nav-title').textContent = `Ranking · ${champData.monthYear || ''}`;

            try {
                const rankingResult = await blm48GetRankingFull(champData.yearMonth);
                const rankingList = Array.isArray(rankingResult) ? rankingResult : [];
                renderRankingPage(champData, rankingList);
            } catch (error) {
                console.error("Ranking fetch error:", error);
                showError("ระบบขัดข้อง กรุณาลองใหม่อีกครั้งงับ");
            }
        });

        function renderRankingPage(champData, rankingList) {
            const wrapper = document.getElementById('ranking-page-wrapper');

            const winnerAvatar = champData.profileImage || DEFAULT_AVATAR;
            const winnerCookies = Number(champData.totalCookie || 0).toLocaleString();
            const winnerIsGraduated = champData.status === 'Graduated' || champData.status === 'Not in System';
            const winnerGradIcon = winnerIsGraduated ? `<div class="grad-icon-profile"><i class="fa-solid fa-graduation-cap"></i></div>` : '';
            const winnerGradBadge = winnerIsGraduated ? ` <span class="grad-badge"><i class="fa-solid fa-graduation-cap"></i> GRADUATED</span>` : '';

            const decorHtml = TOP1_DECOR
                .map(([ic, x, y, s, c]) => `<i class="fa-solid ${ic}" style="left:${x}%;top:${y}%;font-size:${s}px;color:${c};"></i>`)
                .join('');

            wrapper.innerHTML = `
                <div class="top1-card">
                    <div class="top1-decor">${decorHtml}</div>
                    <div class="top1-avatar-wrap"${memberLinkAttr(champData.name)}>
                        ${winnerGradIcon}
                        <img class="top1-avatar" src="${winnerAvatar}" alt="${escapeHtml(champData.name || '')}" onerror="this.src='${DEFAULT_AVATAR}'">
                        <div class="top1-crown"><i class="fas fa-crown"></i></div>
                    </div>
                    <div class="top1-name"${memberLinkAttr(champData.name)}>${escapeHtml(champData.name || 'Unknown Member')}${winnerGradBadge}</div>
                    <div class="top1-cookie"><i class="fas fa-cookie-bite"></i>${winnerCookies}</div>
                </div>
                <div id="ranking-list-body"></div>
            `;

            const listBody = document.getElementById('ranking-list-body');

            // อันดับ 2 เป็นต้นไปทั้งหมด: ตัดคนที่เป็นแชมป์ (ตามชื่อ) ออกจากลิสต์ แทนการตัด index แรกทิ้งเฉยๆ
            // เพราะข้อมูล ranking_monthly อาจขยับหลังจากบันทึกแชมป์ไปแล้ว ทำให้แชมป์ไม่ได้อยู่อันดับ 1 ของไลฟ์เดตาเสมอไป
            const champNameLower = (champData.name || '').toString().trim().toLowerCase();
            let champRemoved = false;
            const restRanking = rankingList.filter(m => {
                const nameLower = (m.name || '').toString().trim().toLowerCase();
                if (!champRemoved && nameLower === champNameLower) {
                    champRemoved = true;
                    return false;
                }
                return true;
            });

            if (restRanking.length === 0) {
                listBody.innerHTML = `<div class="state-msg">ยังไม่มีข้อมูลอันดับอื่นในเดือนนี้ค่ะ</div>`;
                return;
            }

            listBody.innerHTML = restRanking.map((member, i) => {
                const rank = i + 2; // เริ่มที่อันดับ 2
                const badge = rank === 2 ? '<i class="fas fa-crown rank-medal" style="color:#c0c0c0;"></i>'
                            : rank === 3 ? '<i class="fas fa-crown rank-medal" style="color:#cd7f32;"></i>'
                            : `<div class="rank-num">${rank}</div>`;
                const isGraduated = member.status === 'Graduated';
                const gradIcon = isGraduated ? `<div class="grad-icon-profile"><i class="fa-solid fa-graduation-cap"></i></div>` : '';
                const gradBadge = isGraduated ? ` <span class="grad-badge"><i class="fa-solid fa-graduation-cap"></i> GRADUATED</span>` : '';
                return `
                    <div class="rank-row">
                        <div class="rank-col">${badge}</div>
                        <div class="rank-avatar-wrap"${memberLinkAttr(member.name)}>
                            ${gradIcon}
                            <img class="rank-avatar" loading="lazy" src="${member.profile_img || DEFAULT_AVATAR}" alt="${escapeHtml(member.name || '')}" onerror="this.src='${DEFAULT_AVATAR}'">
                        </div>
                        <div class="rank-info"${memberLinkAttr(member.name)}>
                            <div class="rank-name">${escapeHtml(member.name || 'Unknown')}${gradBadge}</div>
                            <div class="rank-cookie"><i class="fas fa-cookie-bite"></i>${Number(member.monthly_cookies || 0).toLocaleString()}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showError(msg) {
            const wrapper = document.getElementById('ranking-page-wrapper');
            wrapper.innerHTML = `
                <div class="error-state">
                    <i class="fa-solid fa-circle-xmark"></i>
                    <div>${msg}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
