<!DOCTYPE html>
<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>BLM48 Membership | Order Details</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/shop-orders.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>
    <style>
        .status-block { padding: 16px 12px; border-bottom: 1px solid var(--order-line); }
        .status-block .section-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .status-block .section-heading i { color: #555; }
        .status-text { font-size: 15px; }
        .status-text i { margin-right: 6px; }
        .line-status { font-size: 12.5px; margin-top: 4px; }
        .detail-summary { padding: 14px 12px; border-bottom: 1px solid var(--order-line); }
        .detail-summary .summary-row:not(.is-total) { color: #aaa; }
        .pay-method { display: flex; align-items: center; gap: 14px; }
        .pay-icon {
            width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
            background: #fff4d6; color: #c9932c; display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .meta-rows { padding: 16px 12px; }
        .meta-rows .summary-row { color: #888; font-size: 14.5px; padding: 5px 0; }
        .meta-rows .summary-value { color: #222; }
        .copy-btn { background: none; border: none; color: var(--order-accent); font: inherit; font-weight: 500; cursor: pointer; padding: 0 0 0 10px; }
        .redeem-note { text-align: center; font-size: 12.5px; color: var(--order-muted); margin-bottom: 8px; }
        .bottom-bar-inner.is-column { flex-direction: column; align-items: stretch; gap: 0; }
    </style>
</head>
<body class="has-bottom-bar">

<div class="top-navigation-bar">
    <button type="button" class="nav-back-btn" onclick="goBack()" aria-label="ย้อนกลับ"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="top-bar-page-title">Order Details</div>
</div>

<div class="page-wrapper" id="detail-content">
    <div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> Loading data...</div>
</div>

<div class="bottom-bar" id="detail-bottom" style="display:none;">
    <div class="bottom-bar-inner is-column">
        <div class="redeem-note" id="redeem-note" style="display:none;"></div>
        <button type="button" class="btn-yellow is-block" id="btn-redeem" style="font-weight:500;">Redeem</button>
    </div>
</div>

<script>
  let user = null;
  let order = null;
  let redeeming = false;

  function goBack() {
    if (document.referrer && window.history.length > 1) window.history.back();
    else window.location.href = 'orders';
  }

  function formatDateTime(value) {
    if (!value) return '-';
    const d = new Date(value);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
      + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  function lineStatus(l) {
    if (l.kind !== 'preorder') return '';
    if (l.status === 'waiting') return '<div class="line-status status-waiting"><i class="fa-solid fa-truck-fast"></i> Waiting for shipment</div>';
    if (l.status === 'ready') return '<div class="line-status status-ready"><i class="fa-solid fa-box"></i> Shipped · Redeemable</div>';
    return '<div class="line-status status-done"><i class="fa-solid fa-circle-check"></i> Redeemed</div>';
  }

  function copyOrderNo() {
    const text = order.orderNo;
    const done = () => {
      const btn = document.getElementById('btn-copy');
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => {});
  }

  function render() {
    const lines = order.lines;
    const hasWaiting = lines.some(l => l.status === 'waiting');
    const hasReady = lines.some(l => l.status === 'ready');
    const hasRedeemed = lines.some(l => l.status === 'redeemed');
    const subtotal = lines.reduce((n, l) => n + Number(l.lineTotal || 0), 0);

    const statusText = hasWaiting
      ? '<span class="status-waiting"><i class="fa-solid fa-truck-fast"></i>Waiting for shipment</span>'
      : hasReady
      ? '<span class="status-ready"><i class="fa-solid fa-gift"></i>Ready to redeem</span>'
      : '<span class="status-done"><i class="fa-solid fa-circle-check"></i>Redeemed</span>';

    document.getElementById('detail-content').innerHTML = `
      <div class="status-block">
        <div class="section-heading"><i class="fa-solid fa-box-open"></i> Order Status</div>
        <div class="status-text">${statusText}</div>
      </div>
      ${lines.map(l => `
        <div class="order-line">
          <img class="order-line-thumb" src="${escapeHtml(l.imageUrl || '')}" alt="" onerror="this.onerror=null;this.src='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='">
          <div class="order-line-body">
            <div class="order-line-name">${escapeHtml(l.name)}</div>
            ${lineStatus(l)}
            <div class="order-line-bottom">
              <div class="order-line-qty">${Number(l.unitPrice).toLocaleString()} Tokens</div>
              <div class="order-line-qty">X${l.quantity}</div>
            </div>
          </div>
        </div>`).join('')}
      <div class="detail-summary">
        <div class="summary-row"><span>Merchandise Subtotal</span><span class="summary-value">${subtotal.toLocaleString()} Tokens</span></div>
        <div class="summary-row is-total"><span>Order Total</span><span class="summary-value">${Number(order.totalTokens).toLocaleString()} Tokens</span></div>
      </div>
      <div class="section">
        <div class="section-heading">Payment Method</div>
        <div class="pay-method"><div class="pay-icon"><i class="fas fa-coins"></i></div><span>Token Wallet</span></div>
      </div>
      <div class="meta-rows">
        <div class="summary-row"><span>Order Number</span><span class="summary-value">${escapeHtml(order.orderNo)}<button type="button" class="copy-btn" id="btn-copy" onclick="copyOrderNo()">Copy</button></span></div>
        <div class="summary-row"><span>Order Time</span><span class="summary-value">${formatDateTime(order.createdAt)}</span></div>
        <div class="summary-row"><span>Payment Time</span><span class="summary-value">${formatDateTime(order.paidAt)}</span></div>
      </div>`;

    const bottom = document.getElementById('detail-bottom');
    const btn = document.getElementById('btn-redeem');
    const note = document.getElementById('redeem-note');
    bottom.style.display = '';
    note.style.display = 'none';
    btn.disabled = false;

    if (hasReady) {
      btn.textContent = 'Redeem';
      btn.onclick = redeem;
      if (hasWaiting) {
        note.textContent = 'Pre-order items can be redeemed separately after they ship.';
        note.style.display = '';
      }
    } else if (hasRedeemed) {
      btn.textContent = 'View received items';
      btn.onclick = () => { location.href = 'order_received?id=' + order.orderId; };
      if (hasWaiting) {
        note.textContent = 'The rest of this order can be redeemed after it ships.';
        note.style.display = '';
      }
    } else {
      btn.textContent = 'Redeem';
      btn.disabled = true;
      note.textContent = 'You can redeem this order after it ships.';
      note.style.display = '';
    }
  }

  async function redeem() {
    if (redeeming) return;
    redeeming = true;
    const btn = document.getElementById('btn-redeem');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Redeeming';
    const res = await blm48RedeemShopOrder(user.username, order.orderId);
    if (res && res.status === 'success') {
      if (res.wallet) {
        user.token = res.wallet.token;
        user.cookie = res.wallet.cookie;
        user.geToken = res.wallet.geToken;
        saveUserSession(user);
      }
      localStorage.removeItem(`blm48_inventory_cache_${user.username}`);
      localStorage.removeItem(`blm48_inventory_time_${user.username}`);
      window.location.href = 'order_received?id=' + order.orderId + '&new=1';
      return;
    }
    redeeming = false;
    const note = document.getElementById('redeem-note');
    note.textContent = (res && res.message) || 'Redeem ไม่สำเร็จ กรุณาลองใหม่อีกครั้งค่ะ';
    note.style.display = '';
    note.style.color = '#d64545';
    btn.textContent = 'Redeem';
    btn.disabled = false;
  }

  async function load() {
    user = getUserSession();
    if (!user) { window.location.href = 'login'; return; }
    const id = Number(new URLSearchParams(location.search).get('id'));
    const res = id ? await blm48GetShopOrder(user.username, id) : null;
    if (!res || res.status !== 'success') {
      document.getElementById('detail-content').innerHTML = `<div class="empty-state"><i class="fa-solid fa-receipt"></i>${escapeHtml((res && res.message) || 'ไม่พบคำสั่งซื้อนี้ค่ะ')}</div>`;
      return;
    }
    order = res.data;
    render();
  }

  window.addEventListener('DOMContentLoaded', load);
  window.addEventListener('pageshow', e => { if (e.persisted) { redeeming = false; load(); } });
</script>
</body>
</html>
