<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script>
    document.addEventListener('touchmove', function(e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) { const now = Date.now(); if (now - lastTouchEnd <= 300 && !(e.target.closest && e.target.closest('button, a, input, textarea, select, [onclick]'))) e.preventDefault(); lastTouchEnd = now; }, false);
    document.addEventListener('wheel', function(e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    document.addEventListener('dblclick', function(e) { e.preventDefault(); }, { passive: false });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --blm-pink: #ff85a2;
      --blm-yellow: #ffc107;
      --text-dark: #4a4a4a;
      --text-muted: #9b9b9b;
      --line-color: #e6e6e6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      /* 🌟 ใช้ฟอนต์คู่ Quicksand (Eng) + Kanit (ไทย) */
      font-family: 'Quicksand', 'Kanit', sans-serif;
      background: #ffffff;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      position: relative;
    }

    /* 📦 คอนเทนเนอร์หลัก — ไม่มีกล่อง ลอยอยู่บนพื้นขาวโล่งๆ */
    .login-container {
      width: 100%;
      max-width: 360px;
      padding: 40px 28px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .title {
      font-size: 30px;
      font-weight: 700;
      color: var(--text-dark);
      margin: 0 0 6px 0;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0 0 26px 0;
      font-weight: 400;
    }

    /* ✏️ ช่องกรอกแบบเส้นใต้ ป้ายชื่ออยู่ด้านบน */
    .form-group {
      text-align: left;
      margin-bottom: 18px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .form-group:focus-within label {
      color: var(--blm-pink);
    }

    .input-wrapper {
      position: relative;
    }

    .cute-input {
      width: 100%;
      height: 46px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line-color);
      border-radius: 0;
      padding: 0 40px 0 0;
      font-family: 'Quicksand', 'Kanit', sans-serif;
      font-size: 16px;
      color: var(--text-dark);
      outline: none;
      transition: border-color 0.2s;
    }

    .cute-input::placeholder {
      color: #cfcfcf;
      font-size: 14px;
    }

    .cute-input:focus {
      border-bottom-color: var(--blm-pink);
    }

    /* 👁️ ปุ่มเปิด/ปิดการมองเห็นรหัสผ่าน */
    .toggle-password {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 6px;
      cursor: pointer;
      color: var(--text-dark);
      font-size: 17px;
      line-height: 1;
    }

    /* 🖤 ปุ่มเข้าสู่ระบบทรงแคปซูลสีเข้ม */
    .btn-login {
      width: 100%;
      height: 50px;
      background: #111111;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      font-family: 'Quicksand', 'Kanit', sans-serif;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
      transition: transform 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .divider {
      margin: 26px 0 16px;
      display: flex;
      align-items: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line-color);
      margin: 0 10px;
    }

    .btn-login-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 50px;
      text-decoration: none;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn-login-main:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .note-text {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 22px;
      line-height: 1.7;
    }

    .note-text b {
      color: var(--blm-yellow);
      font-weight: 700;
    }
  </style>
  <script src="assets/js/pull-to-refresh.js"></script>
</head>
<body class="glass-mesh-bg force-white-bg">


  <div class="login-container">
    <h1 class="title">BLM48 Login</h1>
    <p class="subtitle"></p>

    <form id="loginForm">

      <div class="form-group">
        <label for="username">Membership ID</label>
        <div class="input-wrapper">
          <input type="text" id="username" class="cute-input" placeholder="กรอกรหัสสมาชิก" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="cute-input" placeholder="กรอกรหัสผ่าน" required autocomplete="current-password">
          <button type="button" class="toggle-password" id="togglePassword" aria-label="แสดงรหัสผ่าน">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login">
        Sign In <i class="fas fa-arrow-right"></i>
      </button>

    </form>
    <div class="divider">หรือถ้ายังไม่มีบัญชี</div>

    <a href="https://line.me/R/ti/p/@569rnpsj?from=page&liff.referrer=https%3A%2F%2Flinktr.ee%2F&searchId=569rnpsj"
       target="_blank"
       class="btn-login-main"
       style="background: #06C755;">
      <i class="fab fa-line" style="font-size: 20px;"></i> สมัครสมาชิกผ่าน LINE
    </a>

    <p class="note-text">
      หมายเหตุ : ติดต่อสมัคร BLM48 Membership ฟรี<br>
      ได้ทาง BLM48 Line ID : <b>@569rnpsj</b>
    </p>

  </div>

 <script>
  // 👁️ สลับแสดง/ซ่อนรหัสผ่าน
  document.getElementById('togglePassword').addEventListener('click', function() {
    const input = document.getElementById('password');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    this.querySelector('i').className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
    this.setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
  });
 </script>

 <script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // 🌟 ใช้ .trim() ตัดช่องว่างด้านหน้าและด้านหลังทิ้ง ป้องกันคนพิมพ์แค่ Spacebar
      const userVal = document.getElementById('username').value.trim();
      const passVal = document.getElementById('password').value.trim();

      // 🌟 ดักจับค่าว่าง หากไม่มีข้อมูลจะไม่ยอมให้ส่ง Request เด็ดขาด
      if (!userVal || !passVal) {
        Swal.fire({
          icon: 'warning',
          title: 'ข้อมูลไม่ครบถ้วน',
          text: 'กรุณากรอกรหัสสมาชิกและรหัสผ่านให้ครบถ้วนนะคะ',
          confirmButtonColor: 'var(--blm-pink)',
          didOpen: () => {
            Swal.getPopup().style.fontFamily = "'Quicksand', 'Kanit', sans-serif";
            Swal.getPopup().style.borderRadius = "20px";
          }
        });
        return; // หยุดการทำงานทันที ไม่ส่งข้อมูลไปหลังบ้าน
      }

      Swal.fire({
        title: 'กำลังตรวจสอบข้อมูล...',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      // ส่ง Request ไปตรวจสอบล็อกอินที่ Supabase
      blm48Login(userVal, passVal)
        .then(result => {
          if (result.success) {

            // 👑 ตั้งเวลาหมดอายุเซสชัน 90 วัน ให้แมตช์กับระบบหลักของพี่เอ็มมี่
            const expireTime = new Date().getTime() + (90 * 24 * 60 * 60 * 1000);

            // 🎯 จัดโครงสร้าง Object (data และ expiry) ให้ตรงกับฟังก์ชัน getUserSession() เป๊ะๆ
            const sessionData = {
              data: result.data,
              expiry: expireTime
            };

            // บันทึกลง localStorage ในคีย์ bnl_session เพื่อให้อินเด็กซ์เอาไปแกะใช้งานต่อได้
            localStorage.setItem('bnl_session', JSON.stringify(sessionData));

            Swal.fire({
              icon: 'success',
              title: 'ยินดีต้อนรับ',
              text: `สวัสดีค่ะคุณ ${result.data.name}`,
              showConfirmButton: false,
              timer: 1500,
              didOpen: () => {
                Swal.getPopup().style.fontFamily = "'Quicksand', 'Kanit', sans-serif";
                Swal.getPopup().style.borderRadius = "20px";
              }
            }).then(() => {
              // 🎯 หมายเหตุ: ถ้าไฟล์หน้าหลักชื่อ index (1).html ให้เปลี่ยนตรงนี้เป็น 'index (1).html' นะครับ
              window.location.href = 'index';
            });
          } else if (result.status === 'pending') {
            Swal.fire({
              icon: 'info',
              title: 'บัญชีรอการอนุมัติ',
              text: result.message,
              confirmButtonColor: 'var(--blm-pink)',
              didOpen: () => {
                Swal.getPopup().style.fontFamily = "'Quicksand', 'Kanit', sans-serif";
                Swal.getPopup().style.borderRadius = "20px";
              }
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: 'ล็อกอินล้มเหลว',
              text: result.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',
              confirmButtonColor: 'var(--blm-pink)',
              didOpen: () => {
                Swal.getPopup().style.fontFamily = "'Quicksand', 'Kanit', sans-serif";
                Swal.getPopup().style.borderRadius = "20px";
              }
            });
          }
        })
        .catch(err => {
          console.error(err);
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'ไม่สามารถเชื่อมต่อระบบฐานข้อมูลได้',
            confirmButtonColor: 'var(--blm-pink)'
          });
        });
  });
</script>
</body>
</html>
